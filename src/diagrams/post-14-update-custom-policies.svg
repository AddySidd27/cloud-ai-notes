  <text x="422" y="523" font-size="13" text-anchor="middle" fill="#1f2933">No</text>
  <line x1="394" y1="530" x2="450" y2="530" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="450" y="506" width="240" height="48" rx="4" fill="#e1efd0" stroke="#9fb9d0" stroke-width="1.2"/>
  <text x="570.0" y="525.55" font-size="13" text-anchor="middle" fill="#1f2933">Replace outdated policy</text>
  <text x="570.0" y="543.55" font-size="13" text-anchor="middle" fill="#1f2933">contents with newer version</text>
  <text x="372" y="574" font-size="13" text-anchor="end" fill="#1f2933">Yes</text>
  <line x1="380" y1="544" x2="380" y2="598" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="272" y="598" width="216" height="48" rx="4" fill="#e1efd0" stroke="#9fb9d0" stroke-width="1.2"/>
  <text x="380.0" y="617.55" font-size="13" text-anchor="middle" fill="#1f2933">Delete policy initiative</text>
