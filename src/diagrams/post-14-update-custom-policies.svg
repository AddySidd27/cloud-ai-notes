  <rect x="82" y="82" width="203" height="49" rx="3" fill="#cfe6f7" stroke="#a9c9e2" stroke-width="1"/>
  <text x="183.5" y="102.5" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2933">Azure landing zone</text>
  <text x="183.5" y="118.5" font-size="12" text-anchor="middle" fill="#1f2933">Policies in scope for updating</text>
  <line x1="183" y1="60" x2="183" y2="82" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="183" y1="131" x2="183" y2="158" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)"/>
