<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 770" width="1000" height="770" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">Decision tree for Azure landing zone custom policy updates</title>
  <desc id="d">Redraw of the Learn decision tree. Start: policy updates required, policies in scope for updating. If a policy or initiative is not assigned, replace the outdated definition. If a policy is assigned directly: if parameters did not change, replace the outdated policy contents; if they changed, delete or update the assignments, update the outdated policy, and reassign. If assigned through an initiative that is not outdated: replace policy contents if parameters did not change, otherwise delete the initiative assignments, update the policy or initiative definition, and reassign. If the initiative itself is outdated: delete the initiative assignments, update the policy or initiative definition, and assign the initiative. </desc>
