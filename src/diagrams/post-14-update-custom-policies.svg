  <text x="168" y="513" font-size="12" text-anchor="end" fill="#1f2933">outdated</text>
  <text x="232" y="509" font-size="12" text-anchor="middle" fill="#1f2933">No</text>
  <line x1="196" y1="504" x2="303" y2="504" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="316" y="478" font-size="12" text-anchor="middle" fill="#3a3a3a">Policy parameter(s)</text>
  <text x="316" y="492" font-size="12" text-anchor="middle" fill="#3a3a3a">changed</text>
  <text x="362" y="509" font-size="12" text-anchor="middle" fill="#1f2933">No</text>
  <line x1="329" y1="504" x2="423" y2="504" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="423" y="481" width="195" height="48" rx="3" fill="#e1efd0" stroke="#9fb9d0" stroke-width="1"/>
  <text x="520.5" y="501.0" font-size="12" text-anchor="middle" fill="#1f2933">Replace outdated policy</text>
  <text x="520.5" y="517.0" font-size="12" text-anchor="middle" fill="#1f2933">contents with newer version</text>
  <text x="306" y="542" font-size="12" text-anchor="end" fill="#1f2933">Yes</text>
  <line x1="316" y1="517" x2="316" y2="558" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="240" y="558" width="155" height="50" rx="3" fill="#e1efd0" stroke="#9fb9d0" stroke-width="1"/>
  <text x="317.5" y="579.0" font-size="12" text-anchor="middle" fill="#1f2933">Delete policy initiative</text>
  <text x="317.5" y="595.0" font-size="12" text-anchor="middle" fill="#1f2933">assignment(s)</text>
  <line x1="395" y1="583" x2="425" y2="583" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)"/>
