  <text x="422" y="535.6" font-size="14" text-anchor="middle" fill="#1f2933">No</text>
  <line x1="394" y1="542.6" x2="450" y2="542.6" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arr)"/>
