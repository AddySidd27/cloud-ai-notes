  <text x="193" y="542.5" font-size="13" text-anchor="end" fill="#1f2933">outdated</text>
  <text x="290" y="523" font-size="13" text-anchor="middle" fill="#1f2933">No</text>
  <line x1="229" y1="530" x2="366" y2="530" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="380" y="492" font-size="13" text-anchor="middle" fill="#1f2933">Policy parameter(s)</text>
