<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1356" width="1000" height="1356" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">Privileged access: Conditional Access sets the rule, MFA is the proof, PIM switches the role on for a limited time, emergency accounts are the safety net</title>
  <desc id="d">From top to bottom, five numbered boxes joined by down arrows. 1, Administrator: a separate cloud-only account for admin work, eligible for a role, not always active. 2, Conditional Access, the rule: signals are user or role, location, device, application and risk; the decision is to block or grant access and require MFA or an authentication strength; for admin roles, start in report-only mode then turn on, and exclude emergency accounts. 3, Multifactor authentication, the proof: two or more of something you know, something you have and something you are, with three built-in strengths, multifactor, passwordless and phishing-resistant, where phishing-resistant is the most restrictive and recommended for admins; register methods first or risk lockout. 4, PIM activation, the switch: the role is eligible, and to activate there is an MFA check, a business reason and approval if required. 5, Active then ends: the role works for a set time only, with notifications, audit history and access reviews. Below them, the safety net, as stacked boxes. Emergency access accounts: two or more cloud-only accounts, a passkey different from normal admins, Global Administrator permanent active in PIM, excluded from Conditional Access policies that block or restrict sign-in. Monitor and test: alert on every sign-in, test at least every 90 days, review after any use. Footer: register sign-in methods before turning a policy on. Icons are official: Microsoft Entra ID and Log Analytics workspaces.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/></marker></defs>
  <rect x="6" y="6" width="988" height="1344" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
  <text x="500" y="40" font-size="18" font-weight="600" text-anchor="middle" fill="#1f2933">Privileged access: the rule, the proof, the switch and the safety net</text>
  <text x="500" y="68" font-size="14" font-weight="600" text-anchor="middle" fill="#3a3a3a">Everyday administrator access</text>
  <rect x="30" y="86" width="940" height="104" rx="6" fill="#e8f0fe" stroke="#3b6fb6" stroke-width="2"/>
  <image x="46" y="98" width="28" height="28" href="data:image/svg+xml;base64,"/>
  <text x="86" y="119" font-size="15" font-weight="600" text-anchor="start" fill="#1f2933">1. Administrator</text>
  <text x="46" y="154" font-size="13" text-anchor="start" fill="#1f2933">Separate cloud-only account for admin work</text>
  <text x="46" y="174" font-size="13" text-anchor="start" fill="#1f2933">Eligible for a role, not always active</text>
  <line x1="500" y1="190" x2="500" y2="218" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="30" y="218" width="940" height="166" rx="6" fill="#e8f5e9" stroke="#3c8d40" stroke-width="2"/>
  <text x="46" y="246" font-size="15" font-weight="600" text-anchor="start" fill="#1f2933">2. Conditional Access</text>
  <text x="46" y="266" font-size="13" text-anchor="start" fill="#3a3a3a">The rule: if this, then that</text>
  <text x="46" y="300" font-size="13" font-weight="600" text-anchor="start" fill="#1f2933">Signals</text>
  <text x="46" y="320" font-size="13" text-anchor="start" fill="#1f2933">User or group, location,</text>
  <text x="46" y="340" font-size="13" text-anchor="start" fill="#1f2933">device, application, risk</text>
  <text x="356" y="300" font-size="13" font-weight="600" text-anchor="start" fill="#1f2933">Decision</text>
  <text x="356" y="320" font-size="13" text-anchor="start" fill="#1f2933">Block, or grant access and</text>
  <text x="356" y="340" font-size="13" text-anchor="start" fill="#1f2933">require MFA or an</text>
  <text x="356" y="360" font-size="13" text-anchor="start" fill="#1f2933">authentication strength</text>
  <text x="666" y="300" font-size="13" font-weight="600" text-anchor="start" fill="#1f2933">Policy for admin roles</text>
  <text x="666" y="320" font-size="13" text-anchor="start" fill="#1f2933">Start in report-only, then On</text>
  <text x="666" y="340" font-size="13" text-anchor="start" fill="#1f2933">Exclude emergency accounts</text>
  <line x1="500" y1="384" x2="500" y2="412" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="30" y="412" width="940" height="184" rx="6" fill="#e8f5e9" stroke="#3c8d40" stroke-width="2"/>
  <text x="46" y="440" font-size="15" font-weight="600" text-anchor="start" fill="#1f2933">3. Multifactor authentication</text>
  <text x="46" y="460" font-size="13" text-anchor="start" fill="#3a3a3a">The proof: two or more factors</text>
  <text x="46" y="494" font-size="13" font-weight="600" text-anchor="start" fill="#1f2933">Two or more of these:</text>
  <text x="46" y="514" font-size="13" text-anchor="start" fill="#1f2933">Something you know (password)</text>
  <text x="46" y="534" font-size="13" text-anchor="start" fill="#1f2933">Something you have (phone, key)</text>
  <text x="46" y="554" font-size="13" text-anchor="start" fill="#1f2933">Something you are (fingerprint)</text>
  <text x="356" y="494" font-size="13" font-weight="600" text-anchor="start" fill="#1f2933">Three built-in strengths</text>
  <text x="356" y="514" font-size="13" text-anchor="start" fill="#1f2933">Multifactor (less restrictive)</text>
  <text x="356" y="534" font-size="13" text-anchor="start" fill="#1f2933">Passwordless MFA</text>
  <rect x="350" y="546" width="292" height="26" rx="4" fill="#c8e6c9" stroke="#3c8d40" stroke-width="1"/>
  <text x="356" y="564" font-size="13" font-weight="600" text-anchor="start" fill="#1f2933">Phishing-resistant (most restrictive)</text>
  <text x="666" y="494" font-size="13" font-weight="600" text-anchor="start" fill="#1f2933">Recommended for admins:</text>
  <text x="666" y="514" font-size="13" text-anchor="start" fill="#1f2933">phishing-resistant MFA</text>
  <text x="666" y="542" font-size="13" font-weight="600" text-anchor="start" fill="#1f2933">Register methods first,</text>
  <text x="666" y="562" font-size="13" text-anchor="start" fill="#1f2933">or you risk a lockout</text>
  <line x1="500" y1="596" x2="500" y2="624" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="30" y="624" width="940" height="166" rx="6" fill="#e8f0fe" stroke="#3b6fb6" stroke-width="2"/>
  <text x="46" y="652" font-size="15" font-weight="600" text-anchor="start" fill="#1f2933">4. PIM activation</text>
  <text x="46" y="672" font-size="13" text-anchor="start" fill="#3a3a3a">The switch: only when needed</text>
  <text x="46" y="706" font-size="13" font-weight="600" text-anchor="start" fill="#1f2933">Role is eligible,</text>
  <text x="46" y="726" font-size="13" text-anchor="start" fill="#1f2933">not always active</text>
  <text x="356" y="706" font-size="13" font-weight="600" text-anchor="start" fill="#1f2933">To activate:</text>
  <text x="356" y="726" font-size="13" text-anchor="start" fill="#1f2933">MFA check</text>
  <text x="356" y="746" font-size="13" text-anchor="start" fill="#1f2933">A business reason</text>
  <text x="356" y="766" font-size="13" text-anchor="start" fill="#1f2933">Approval, if required</text>
  <line x1="500" y1="790" x2="500" y2="818" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="30" y="818" width="940" height="106" rx="6" fill="#e8f0fe" stroke="#3b6fb6" stroke-width="2"/>
  <text x="46" y="848" font-size="15" font-weight="600" text-anchor="start" fill="#1f2933">5. Active, then it ends</text>
  <text x="46" y="880" font-size="13" text-anchor="start" fill="#1f2933">Works for a set time only</text>
  <text x="46" y="902" font-size="13" text-anchor="start" fill="#1f2933">Notifications, audit history and access reviews</text>
  <text x="500" y="954" font-size="14" font-weight="600" text-anchor="middle" fill="#3a3a3a">Safety net</text>
  <rect x="30" y="970" width="940" height="150" rx="6" fill="#fff7e0" stroke="#8a6d00" stroke-width="2"/>
  <image x="46" y="980" width="28" height="28" href="data:image/svg+xml;base64,"/>
  <text x="86" y="1001" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Emergency access (break-glass) accounts</text>
  <text x="46" y="1034" font-size="13" text-anchor="start" fill="#1f2933">Two or more, cloud-only (*.onmicrosoft.com)</text>
  <text x="46" y="1054" font-size="13" text-anchor="start" fill="#1f2933">Passkey (FIDO2), different from normal admins</text>
  <text x="46" y="1074" font-size="13" text-anchor="start" fill="#1f2933">Global Administrator, permanent active in PIM</text>
  <text x="46" y="1094" font-size="13" text-anchor="start" fill="#1f2933">Excluded from Conditional Access policies that block or restrict sign-in</text>
  <rect x="30" y="1136" width="940" height="130" rx="6" fill="#f5f7fa" stroke="#5f6b7a" stroke-width="2"/>
  <image x="46" y="1146" width="28" height="28" href="data:image/svg+xml;base64,"/>
  <text x="86" y="1167" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Monitor and test the emergency accounts</text>
  <text x="46" y="1200" font-size="13" text-anchor="start" fill="#1f2933">Alert on every sign-in (for example Microsoft Sentinel)</text>
  <text x="46" y="1220" font-size="13" text-anchor="start" fill="#1f2933">Test that they work at least every 90 days</text>
  <text x="46" y="1240" font-size="13" text-anchor="start" fill="#1f2933">Review after any use: drill, emergency or misuse</text>
  <rect x="30" y="1282" width="940" height="54" rx="6" fill="#fff7e0" stroke="#8a6d00" stroke-width="1"/>
  <text x="500" y="1304" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2933">Before turning a policy On: administrators must have registered their sign-in methods,</text>
  <text x="500" y="1324" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2933">or you risk locking yourself out.</text>
</svg>
