<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 680" width="1150" height="680" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">Privileged access: Conditional Access sets the rule, MFA is the proof, PIM switches the role on for a limited time, emergency accounts are the safety net</title>
  <desc id="d">Top row, five steps. 1, Administrator: a separate cloud-only account for admin work, eligible for a role, not always active. 2, Conditional Access, the rule: signals are user or role, location, device, application and risk; the decision is to block or grant access and require MFA or an authentication strength; for admin roles, start in report-only mode then turn on, and exclude emergency accounts. 3, Multifactor authentication, the proof: two or more of something you know, something you have and something you are, with three built-in strengths, multifactor, passwordless and phishing-resistant, where phishing-resistant is the most restrictive and recommended for admins; register methods first or risk lockout. 4, PIM activation, the switch: the role is eligible, and to activate there is an MFA check, a business reason and approval if required. 5, Active then ends: the role works for a set time only, with notifications, audit history and access reviews. Bottom row. Emergency access accounts: two or more cloud-only accounts, a passkey different from normal admins, Global Administrator permanent active in PIM, excluded from Conditional Access policies that block or restrict sign-in. Monitor and test: alert on every sign-in, test at least every 90 days, review after any use. Footer: register sign-in methods before turning a policy on. Icons are official: Microsoft Entra ID and Log Analytics workspaces.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/></marker></defs>
  <rect x="10" y="10" width="1130" height="660" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
  <text x="575" y="38" font-size="17" font-weight="600" text-anchor="middle" fill="#1f2933">Privileged access: the rule, the proof, the switch and the safety net</text>
  <text x="575" y="64" font-size="12" font-weight="600" text-anchor="middle" fill="#3a3a3a">Everyday administrator access</text>
  <rect x="20" y="80" width="130" height="360" rx="6" fill="#e8f0fe" stroke="#3b6fb6" stroke-width="2"/>
  <image x="34" y="90" width="28" height="28" href="data:image/svg+xml;base64,"/>
  <text x="34" y="146" font-size="12" font-weight="600" text-anchor="start" fill="#1f2933">1. Administrator</text>
  <text x="34" y="176" font-size="11" text-anchor="start" fill="#1f2933">Separate</text>
  <text x="34" y="193" font-size="11" text-anchor="start" fill="#1f2933">cloud-only account</text>
  <text x="34" y="210" font-size="11" text-anchor="start" fill="#1f2933">for admin work</text>
  <text x="34" y="244" font-size="11" text-anchor="start" fill="#1f2933">Eligible for a role,</text>
  <text x="34" y="261" font-size="11" text-anchor="start" fill="#1f2933">not always active</text>
  <rect x="180" y="80" width="250" height="360" rx="6" fill="#e8f5e9" stroke="#3c8d40" stroke-width="2"/>
  <text x="194" y="134" font-size="13" font-weight="600" text-anchor="start" fill="#1f2933">2. Conditional Access</text>
  <text x="194" y="152" font-size="11" text-anchor="start" fill="#3a3a3a">The rule: if this, then that</text>
  <text x="194" y="176" font-size="11" font-weight="600" text-anchor="start" fill="#1f2933">Signals</text>
  <text x="194" y="193" font-size="11" text-anchor="start" fill="#1f2933">User or group, location,</text>
  <text x="194" y="210" font-size="11" text-anchor="start" fill="#1f2933">device, application, risk</text>
  <text x="194" y="235" font-size="11" font-weight="600" text-anchor="start" fill="#1f2933">Decision</text>
  <text x="194" y="252" font-size="11" text-anchor="start" fill="#1f2933">Block, or grant access and</text>
  <text x="194" y="269" font-size="11" text-anchor="start" fill="#1f2933">require MFA or an</text>
  <text x="194" y="286" font-size="11" text-anchor="start" fill="#1f2933">authentication strength</text>
  <text x="194" y="311" font-size="11" font-weight="600" text-anchor="start" fill="#1f2933">Policy for admin roles</text>
  <text x="194" y="328" font-size="11" text-anchor="start" fill="#1f2933">Start in report-only, then On</text>
  <text x="194" y="345" font-size="11" text-anchor="start" fill="#1f2933">Exclude emergency accounts</text>
  <rect x="460" y="80" width="250" height="360" rx="6" fill="#e8f5e9" stroke="#3c8d40" stroke-width="2"/>
  <text x="474" y="134" font-size="13" font-weight="600" text-anchor="start" fill="#1f2933">3. Multifactor authentication</text>
  <text x="474" y="152" font-size="11" text-anchor="start" fill="#3a3a3a">The proof: two or more factors</text>
  <text x="474" y="180" font-size="11" font-weight="600" text-anchor="start" fill="#1f2933">Two or more of these:</text>
  <text x="474" y="198" font-size="11" text-anchor="start" fill="#1f2933">Something you know (password)</text>
  <text x="474" y="215" font-size="11" text-anchor="start" fill="#1f2933">Something you have (phone, key)</text>
  <text x="474" y="232" font-size="11" text-anchor="start" fill="#1f2933">Something you are (fingerprint)</text>
  <text x="474" y="262" font-size="11" font-weight="600" text-anchor="start" fill="#1f2933">Three built-in strengths</text>
  <text x="474" y="280" font-size="11" text-anchor="start" fill="#1f2933">Multifactor (less restrictive)</text>
  <text x="474" y="297" font-size="11" text-anchor="start" fill="#1f2933">Passwordless MFA</text>
  <rect x="468" y="304" width="234" height="24" rx="4" fill="#c8e6c9" stroke="#3c8d40" stroke-width="1"/>
  <text x="474" y="320" font-size="11" font-weight="600" text-anchor="start" fill="#1f2933">Phishing-resistant (most restrictive)</text>
  <text x="474" y="348" font-size="11" font-weight="600" text-anchor="start" fill="#1f2933">Recommended for admins:</text>
  <text x="474" y="365" font-size="11" text-anchor="start" fill="#1f2933">phishing-resistant MFA</text>
  <text x="474" y="390" font-size="11" font-weight="600" text-anchor="start" fill="#1f2933">Register methods first,</text>
  <text x="474" y="407" font-size="11" text-anchor="start" fill="#1f2933">or you risk a lockout</text>
  <rect x="740" y="80" width="210" height="360" rx="6" fill="#e8f0fe" stroke="#3b6fb6" stroke-width="2"/>
  <text x="754" y="134" font-size="13" font-weight="600" text-anchor="start" fill="#1f2933">4. PIM activation</text>
  <text x="754" y="152" font-size="11" text-anchor="start" fill="#3a3a3a">The switch: only when needed</text>
  <text x="754" y="180" font-size="11" font-weight="600" text-anchor="start" fill="#1f2933">Role is eligible,</text>
  <text x="754" y="197" font-size="11" text-anchor="start" fill="#1f2933">not always active</text>
  <text x="754" y="231" font-size="11" font-weight="600" text-anchor="start" fill="#1f2933">To activate:</text>
  <text x="754" y="248" font-size="11" text-anchor="start" fill="#1f2933">MFA check</text>
  <text x="754" y="265" font-size="11" text-anchor="start" fill="#1f2933">A business reason</text>
  <text x="754" y="282" font-size="11" text-anchor="start" fill="#1f2933">Approval, if required</text>
  <rect x="980" y="80" width="150" height="360" rx="6" fill="#e8f0fe" stroke="#3b6fb6" stroke-width="2"/>
  <text x="994" y="134" font-size="13" font-weight="600" text-anchor="start" fill="#1f2933">5. Active,</text>
  <text x="994" y="152" font-size="13" font-weight="600" text-anchor="start" fill="#1f2933">then it ends</text>
  <text x="994" y="184" font-size="11" text-anchor="start" fill="#1f2933">Works for a set</text>
  <text x="994" y="201" font-size="11" text-anchor="start" fill="#1f2933">time only</text>
  <text x="994" y="235" font-size="11" text-anchor="start" fill="#1f2933">Notifications,</text>
  <text x="994" y="252" font-size="11" text-anchor="start" fill="#1f2933">audit history and</text>
  <text x="994" y="269" font-size="11" text-anchor="start" fill="#1f2933">access reviews</text>
  <line x1="150" y1="250" x2="180" y2="250" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="430" y1="250" x2="460" y2="250" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="710" y1="250" x2="740" y2="250" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="950" y1="250" x2="980" y2="250" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="575" y="468" font-size="12" font-weight="600" text-anchor="middle" fill="#3a3a3a">Safety net</text>
  <rect x="20" y="480" width="555" height="140" rx="6" fill="#fff7e0" stroke="#8a6d00" stroke-width="2"/>
  <image x="32" y="490" width="28" height="28" href="data:image/svg+xml;base64,"/>
  <text x="70" y="510" font-size="12" font-weight="600" text-anchor="start" fill="#1f2933">Emergency access (break-glass) accounts</text>
  <text x="36" y="542" font-size="11" text-anchor="start" fill="#1f2933">Two or more, cloud-only (*.onmicrosoft.com)</text>
  <text x="36" y="562" font-size="11" text-anchor="start" fill="#1f2933">Passkey (FIDO2), different from normal admins</text>
  <text x="36" y="582" font-size="11" text-anchor="start" fill="#1f2933">Global Administrator, permanent active in PIM</text>
  <text x="36" y="602" font-size="11" text-anchor="start" fill="#1f2933">Excluded from Conditional Access policies that block or restrict sign-in</text>
  <rect x="595" y="480" width="535" height="140" rx="6" fill="#f5f7fa" stroke="#5f6b7a" stroke-width="2"/>
  <image x="607" y="490" width="28" height="28" href="data:image/svg+xml;base64,"/>
  <text x="645" y="510" font-size="12" font-weight="600" text-anchor="start" fill="#1f2933">Monitor and test the emergency accounts</text>
  <text x="611" y="542" font-size="11" text-anchor="start" fill="#1f2933">Alert on every sign-in (for example Microsoft Sentinel)</text>
  <text x="611" y="562" font-size="11" text-anchor="start" fill="#1f2933">Test that they work at least every 90 days</text>
  <text x="611" y="582" font-size="11" text-anchor="start" fill="#1f2933">Review after any use: drill, emergency or misuse</text>
  <rect x="20" y="636" width="1110" height="34" rx="6" fill="#fff7e0" stroke="#8a6d00" stroke-width="1"/>
  <text x="575" y="658" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2933">Before turning a policy On: administrators must have registered their sign-in methods, or you risk locking yourself out.</text>
</svg>
