  <text x="107" y="88" font-size="24" text-anchor="middle" fill="#ffffff">Definition</text>
  <text x="107" y="118" font-size="24" text-anchor="middle" fill="#ffffff">of done</text>
  <text x="324" y="88" font-size="16" font-weight="600" text-anchor="middle" fill="#333333">Acceptance</text>
