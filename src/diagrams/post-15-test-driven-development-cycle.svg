<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 907 532" width="907" height="532" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">Test-driven development cycle for an Azure landing zone</title>
  <desc id="d">Based on the picture. A box, Definition of done, with an arrow labelled Acceptance criteria points into a cycle of five numbered circles that go clockwise: 1 create a test, 2 test the landing zone, 3 expand and refactor the landing zone, 4 deploy the landing zone, 5 test the landing zone, and back to 1.</desc>
