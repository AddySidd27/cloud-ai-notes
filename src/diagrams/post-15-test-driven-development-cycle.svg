  <text x="813" y="219" font-size="16" text-anchor="middle" fill="#ffffff">Test the</text>
  <text x="813" y="241" font-size="16" text-anchor="middle" fill="#ffffff">landing</text>
  <text x="813" y="263" font-size="16" text-anchor="middle" fill="#ffffff">zone</text>
  <text x="744" y="421" font-size="16" text-anchor="middle" fill="#ffffff">Expand and</text>
  <text x="744" y="443" font-size="16" text-anchor="middle" fill="#ffffff">refactor the</text>
  <text x="744" y="465" font-size="16" text-anchor="middle" fill="#ffffff">landing</text>
  <text x="744" y="487" font-size="16" text-anchor="middle" fill="#ffffff">zone</text>
