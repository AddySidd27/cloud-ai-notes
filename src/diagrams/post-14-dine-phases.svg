<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" width="960" height="170" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">DINE phases overview</title>
  <desc id="d">Redraw of the Learn picture of the suggested phased approach. Three arrows from left to right: disable DINE and Modify policies automated actions; enable DINE and Modify policies on a specific policy or reduced scope; enable DINE and Modify policies everywhere.</desc>
  <polygon points="10,10 280,10 310,85 280,160 10,160 40,85" fill="#5b9bd5" stroke="#41719c" stroke-width="1"/>
  <polygon points="330,10 600,10 630,85 600,160 330,160 360,85" fill="#5b9bd5" stroke="#41719c" stroke-width="1"/>
  <polygon points="650,10 920,10 950,85 920,160 650,160 680,85" fill="#5b9bd5" stroke="#41719c" stroke-width="1"/>
  <text x="160.0" y="62" font-size="14" text-anchor="middle" fill="#000000">Disable</text>
  <text x="160.0" y="80" font-size="14" text-anchor="middle" fill="#000000">DINE/Modify</text>
  <text x="160.0" y="98" font-size="14" text-anchor="middle" fill="#000000">Policies Automated</text>
  <text x="160.0" y="116" font-size="14" text-anchor="middle" fill="#000000">Actions</text>
  <text x="480.0" y="53" font-size="14" text-anchor="middle" fill="#000000">Enable</text>
  <text x="480.0" y="71" font-size="14" text-anchor="middle" fill="#000000">DINE/Modify</text>
  <text x="480.0" y="89" font-size="14" text-anchor="middle" fill="#000000">Policies on a</text>
  <text x="428.0" y="107" font-size="14" font-weight="600" text-anchor="start" fill="#000000">specific policy</text>
  <text x="527.0" y="107" font-size="14" text-anchor="start" fill="#000000">or</text>
  <text x="480.0" y="125" font-size="14" font-weight="600" text-anchor="middle" fill="#000000">reduced scope</text>
  <text x="800.0" y="62" font-size="14" text-anchor="middle" fill="#000000">Enable</text>
  <text x="800.0" y="80" font-size="14" text-anchor="middle" fill="#000000">DINE/Modify</text>
  <text x="800.0" y="98" font-size="14" text-anchor="middle" fill="#000000">Policies</text>
  <text x="800.0" y="116" font-size="14" font-weight="600" text-anchor="middle" fill="#000000">everywhere</text>
</svg>
