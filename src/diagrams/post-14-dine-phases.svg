<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1021 221" width="1021" height="221" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">DINE phases overview</title>
  <desc id="d">Based on the picture of the suggested phased approach. Three numbered phases from left to right (phase 1, 2, 3): disable DINE and Modify policies automated actions; enable DINE and Modify policies on a specific policy or reduced scope; enable DINE and Modify policies everywhere.</desc>
  <rect x="6" y="6" width="1009" height="209" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
  <polygon points="22.5,22.5 304.5,22.5 338.5,110.5 304.5,198.5 22.5,198.5 56.5,110.5" fill="#5b9bd5" stroke="#41719c" stroke-width="1"/>
  <polygon points="352.5,22.5 634.5,22.5 668.5,110.5 634.5,198.5 352.5,198.5 386.5,110.5" fill="#5b9bd5" stroke="#41719c" stroke-width="1"/>
  <polygon points="682.5,22.5 964.5,22.5 998.5,110.5 964.5,198.5 682.5,198.5 716.5,110.5" fill="#5b9bd5" stroke="#41719c" stroke-width="1"/>
  <text x="180.5" y="50.5" font-size="17" font-weight="700" text-anchor="middle" fill="#000000">Phase 1</text>
  <text x="180.5" y="80.5" font-size="17" text-anchor="middle" fill="#000000">Disable</text>
  <text x="180.5" y="104.5" font-size="17" text-anchor="middle" fill="#000000">DINE/Modify</text>
  <text x="180.5" y="128.5" font-size="17" text-anchor="middle" fill="#000000">Policies Automated</text>
  <text x="180.5" y="152.5" font-size="17" text-anchor="middle" fill="#000000">Actions</text>
  <text x="510.5" y="44.5" font-size="17" font-weight="700" text-anchor="middle" fill="#000000">Phase 2</text>
  <text x="510.5" y="68.5" font-size="17" text-anchor="middle" fill="#000000">Enable</text>
  <text x="510.5" y="92.5" font-size="17" text-anchor="middle" fill="#000000">DINE/Modify</text>
  <text x="510.5" y="116.5" font-size="17" text-anchor="middle" fill="#000000">Policies on a</text>
  <text x="510.5" y="140.5" font-size="17" font-weight="600" text-anchor="middle" fill="#000000">specific policy or</text>
  <text x="510.5" y="164.5" font-size="17" font-weight="600" text-anchor="middle" fill="#000000">reduced scope</text>
  <text x="840.5" y="50.5" font-size="17" font-weight="700" text-anchor="middle" fill="#000000">Phase 3</text>
  <text x="840.5" y="80.5" font-size="17" text-anchor="middle" fill="#000000">Enable</text>
  <text x="840.5" y="104.5" font-size="17" text-anchor="middle" fill="#000000">DINE/Modify</text>
  <text x="840.5" y="128.5" font-size="17" text-anchor="middle" fill="#000000">Policies</text>
  <text x="840.5" y="152.5" font-size="17" font-weight="600" text-anchor="middle" fill="#000000">everywhere</text>
</svg>
