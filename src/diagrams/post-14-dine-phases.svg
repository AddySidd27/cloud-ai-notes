<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">DINE phases overview</title>
  <desc id="d">Redraw of the Learn picture of the suggested phased approach. Three arrows from left to right: disable DINE and Modify policies automated actions; enable DINE and Modify policies on a specific policy or reduced scope; enable DINE and Modify policies everywhere.</desc>
  <polygon points="12,12 294,12 328,100 294,188 12,188 46,100" fill="#5b9bd5" stroke="#41719c" stroke-width="1"/>
  <polygon points="342,12 624,12 658,100 624,188 342,188 376,100" fill="#5b9bd5" stroke="#41719c" stroke-width="1"/>
  <polygon points="672,12 954,12 988,100 954,188 672,188 706,100" fill="#5b9bd5" stroke="#41719c" stroke-width="1"/>
  <text x="170.0" y="70.0" font-size="17" text-anchor="middle" fill="#000000">Disable</text>
  <text x="170.0" y="94.0" font-size="17" text-anchor="middle" fill="#000000">DINE/Modify</text>
  <text x="170.0" y="118.0" font-size="17" text-anchor="middle" fill="#000000">Policies Automated</text>
  <text x="170.0" y="142.0" font-size="17" text-anchor="middle" fill="#000000">Actions</text>
  <text x="500.0" y="58.0" font-size="17" text-anchor="middle" fill="#000000">Enable</text>
  <text x="500.0" y="82.0" font-size="17" text-anchor="middle" fill="#000000">DINE/Modify</text>
  <text x="500.0" y="106.0" font-size="17" text-anchor="middle" fill="#000000">Policies on a</text>
  <text x="500.0" y="130.0" font-size="17" font-weight="600" text-anchor="middle" fill="#000000">specific policy or</text>
  <text x="500.0" y="154.0" font-size="17" font-weight="600" text-anchor="middle" fill="#000000">reduced scope</text>
  <text x="830.0" y="70.0" font-size="17" text-anchor="middle" fill="#000000">Enable</text>
  <text x="830.0" y="94.0" font-size="17" text-anchor="middle" fill="#000000">DINE/Modify</text>
  <text x="830.0" y="118.0" font-size="17" text-anchor="middle" fill="#000000">Policies</text>
  <text x="830.0" y="142.0" font-size="17" font-weight="600" text-anchor="middle" fill="#000000">everywhere</text>
</svg>
