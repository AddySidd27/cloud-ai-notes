<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 694" width="1000" height="694" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">Five business requirements and the landing zone part each one changes</title>
  <desc id="d">Five requirements on the left: compliance, region, recovery, connectivity and cost. Arrows lead to the parts of the landing zone on the right. Compliance changes the management group hierarchy and Azure Policy. Region changes Azure Policy, through an allowed locations policy. Recovery changes Protect and recover in the Management design area. Connectivity changes the Connectivity subscription, with its hub network and hybrid connection. Cost changes budgets, alerts and tags at management group or subscription level. Footer: define your organizational requirements across the design areas before you build the platform landing zone. Icons are official Azure icons: Management groups, Policy, Subscriptions and Virtual networks.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/></marker></defs>
  <rect x="6" y="6" width="988" height="682" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
  <text x="500" y="38" font-size="17" font-weight="600" text-anchor="middle" fill="#1f2933">Five business requirements and the landing zone part each one changes</text>
  <text x="160.0" y="76" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Your requirements</text>
  <text x="685.0" y="76" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">What it changes in the landing zone</text>
  <rect x="20" y="92" width="280" height="98" rx="8" fill="#fff4d6" stroke="#b8860b" stroke-width="2"/>
  <text x="36" y="120" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Compliance</text>
  <text x="36" y="146" font-size="13" text-anchor="start" fill="#3a3a3a">Which rules must we follow,</text>
  <text x="36" y="165" font-size="13" text-anchor="start" fill="#3a3a3a">and for which workloads?</text>
  <rect x="20" y="200" width="280" height="98" rx="8" fill="#fff4d6" stroke="#b8860b" stroke-width="2"/>
  <text x="36" y="228" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Region</text>
  <text x="36" y="254" font-size="13" text-anchor="start" fill="#3a3a3a">Where may our data live, and in</text>
  <text x="36" y="273" font-size="13" text-anchor="start" fill="#3a3a3a">which regions will we deploy?</text>
  <rect x="20" y="308" width="280" height="98" rx="8" fill="#fff4d6" stroke="#b8860b" stroke-width="2"/>
  <text x="36" y="336" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Recovery</text>
  <text x="36" y="362" font-size="13" text-anchor="start" fill="#3a3a3a">How much downtime and data loss</text>
  <text x="36" y="381" font-size="13" text-anchor="start" fill="#3a3a3a">can each workload accept?</text>
  <rect x="20" y="416" width="280" height="98" rx="8" fill="#fff4d6" stroke="#b8860b" stroke-width="2"/>
  <text x="36" y="444" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Connectivity</text>
  <text x="36" y="470" font-size="13" text-anchor="start" fill="#3a3a3a">How do users and workloads reach</text>
  <text x="36" y="489" font-size="13" text-anchor="start" fill="#3a3a3a">Azure and on-premises?</text>
  <rect x="20" y="524" width="280" height="98" rx="8" fill="#fff4d6" stroke="#b8860b" stroke-width="2"/>
  <text x="36" y="552" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Cost</text>
  <text x="36" y="578" font-size="13" text-anchor="start" fill="#3a3a3a">Who owns the spending, and</text>
  <text x="36" y="597" font-size="13" text-anchor="start" fill="#3a3a3a">how do we see it?</text>
  <rect x="390" y="92" width="590" height="98" rx="8" fill="#e8f0fe" stroke="#3b6fb6" stroke-width="2"/>
  <image x="404" y="101" width="28" height="28" href="data:image/svg+xml;base64,"/>
  <text x="442" y="118" font-size="15" font-weight="600" text-anchor="start" fill="#1f2933">Management group hierarchy</text>
  <text x="406" y="142" font-size="13" text-anchor="start" fill="#3a3a3a">Where a subscription sits decides which policies it inherits.</text>
  <text x="406" y="159" font-size="13" text-anchor="start" fill="#3a3a3a">Conflicting rules: more than one landing zone in one tenant.</text>
  <text x="406" y="176" font-size="13" text-anchor="start" fill="#3a3a3a">Do not build management groups by region.</text>
  <rect x="390" y="200" width="590" height="98" rx="8" fill="#e8f0fe" stroke="#3b6fb6" stroke-width="2"/>
  <image x="404" y="209" width="28" height="28" href="data:image/svg+xml;base64,"/>
  <text x="442" y="226" font-size="15" font-weight="600" text-anchor="start" fill="#1f2933">Azure Policy</text>
  <text x="406" y="250" font-size="13" text-anchor="start" fill="#3a3a3a">Map compliance rules to policy definitions.</text>
  <text x="406" y="267" font-size="13" text-anchor="start" fill="#3a3a3a">An allowed locations policy enforces region rules.</text>
  <text x="406" y="284" font-size="13" text-anchor="start" fill="#3a3a3a">Put these rules in the baseline from the start.</text>
  <rect x="390" y="308" width="590" height="98" rx="8" fill="#e8f0fe" stroke="#3b6fb6" stroke-width="2"/>
  <text x="406" y="334" font-size="15" font-weight="600" text-anchor="start" fill="#1f2933">Protect &amp; Recover (Management design area)</text>
  <text x="406" y="358" font-size="13" text-anchor="start" fill="#3a3a3a">Backup and disaster recovery, designed from each</text>
  <text x="406" y="375" font-size="13" text-anchor="start" fill="#3a3a3a">workload&#x27;s RTO and RPO.</text>
  <text x="406" y="392" font-size="13" text-anchor="start" fill="#3a3a3a">Recovery must be tested against the RTO.</text>
  <rect x="390" y="416" width="590" height="98" rx="8" fill="#e8f0fe" stroke="#3b6fb6" stroke-width="2"/>
  <image x="404" y="425" width="28" height="28" href="data:image/svg+xml;base64,"/>
  <text x="442" y="442" font-size="15" font-weight="600" text-anchor="start" fill="#1f2933">Connectivity subscription</text>
  <text x="406" y="466" font-size="13" text-anchor="start" fill="#3a3a3a">Hub network and hybrid connection (VPN Gateway or ExpressRoute).</text>
  <text x="406" y="483" font-size="13" text-anchor="start" fill="#3a3a3a">Hub-and-spoke or Virtual WAN, chosen from your needs.</text>
  <text x="406" y="500" font-size="13" text-anchor="start" fill="#3a3a3a">A new region needs a new hub.</text>
  <rect x="390" y="524" width="590" height="98" rx="8" fill="#e8f0fe" stroke="#3b6fb6" stroke-width="2"/>
  <text x="406" y="550" font-size="15" font-weight="600" text-anchor="start" fill="#1f2933">Cost Management and tags</text>
  <text x="406" y="574" font-size="13" text-anchor="start" fill="#3a3a3a">Budgets and alerts at management group or subscription level,</text>
  <text x="406" y="591" font-size="13" text-anchor="start" fill="#3a3a3a">with an owner who reviews them.</text>
  <text x="406" y="608" font-size="13" text-anchor="start" fill="#3a3a3a">Tags, such as cost center or project name.</text>
  <line x1="304" y1="141.0" x2="386" y2="141.0" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="304" y1="249.0" x2="386" y2="249.0" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="304" y1="357.0" x2="386" y2="357.0" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="304" y1="465.0" x2="386" y2="465.0" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="304" y1="573.0" x2="386" y2="573.0" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="336" y1="141.0" x2="336" y2="225.0" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="336" y1="225.0" x2="386" y2="225.0" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="352" y1="249.0" x2="352" y2="443.0" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="352" y1="443.0" x2="386" y2="443.0" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="500" y="646" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2933">Before you build the platform landing zone, define your organizational requirements</text>
  <text x="500" y="665" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2933">across the design areas. These decisions shape the design.</text>
</svg>
