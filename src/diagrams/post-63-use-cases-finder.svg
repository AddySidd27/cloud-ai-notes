<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1006 649" width="1006" height="649" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">Find your use case at a glance</title>
  <desc id="d">A box at the top asks what you are deciding. Three columns follow. First column, where does this workload go: internet-facing or internal app, development test and production, experiments, an extra compliance rule, more than one region, an AI workload, a platform shared by teams, retiring a subscription. Second column, what shape is my company: one tenant with many subscriptions, several tenants after mergers, many countries with conflicting rules, a software company. Third column, do special rules apply: sovereignty controls, servers that stay on premises.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/></marker></defs>
  <rect x="6" y="6" width="994" height="637" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
  <text x="503" y="45" font-size="24" font-weight="600" text-anchor="middle" fill="#1f2933">Find your use case at a glance</text>
  <text x="503" y="73" font-size="16" text-anchor="middle" fill="#3a3a3a">Pick the question you are asking. Each line is a card in this post.</text>
  <rect x="333" y="95" width="340" height="50" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="503" y="126" font-size="18" font-weight="600" text-anchor="middle" fill="#1f2933">What are you deciding?</text>
  <line x1="503" y1="145" x2="178" y2="177" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="23" y="177" width="310" height="440" rx="10" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="2"/>
  <text x="39" y="211" font-size="18" font-weight="600" text-anchor="start" fill="#1f2933">Where does this workload go?</text>
  <rect x="37" y="233" width="282" height="36" rx="6" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
  <text x="49" y="257" font-size="15" text-anchor="start" fill="#1f2933">Internet-facing or internal app</text>
  <rect x="37" y="275" width="282" height="36" rx="6" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
  <text x="49" y="299" font-size="15" text-anchor="start" fill="#1f2933">Development, test, production</text>
  <rect x="37" y="317" width="282" height="36" rx="6" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
  <text x="49" y="341" font-size="15" text-anchor="start" fill="#1f2933">Experiments and learning</text>
  <rect x="37" y="359" width="282" height="36" rx="6" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
  <text x="49" y="383" font-size="15" text-anchor="start" fill="#1f2933">An extra compliance rule</text>
  <rect x="37" y="401" width="282" height="36" rx="6" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
  <text x="49" y="425" font-size="15" text-anchor="start" fill="#1f2933">More than one region</text>
  <rect x="37" y="443" width="282" height="36" rx="6" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
  <text x="49" y="467" font-size="15" text-anchor="start" fill="#1f2933">An AI workload</text>
  <rect x="37" y="485" width="282" height="36" rx="6" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
  <text x="49" y="509" font-size="15" text-anchor="start" fill="#1f2933">A platform shared by teams</text>
  <rect x="37" y="527" width="282" height="36" rx="6" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
  <text x="49" y="551" font-size="15" text-anchor="start" fill="#1f2933">Retiring a subscription</text>
  <line x1="37" y1="575" x2="319" y2="575" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="39" y="601" font-size="15" font-weight="600" text-anchor="start" fill="#1f2933">Answer: which management group</text>
  <line x1="503" y1="145" x2="503" y2="177" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="348" y="177" width="310" height="440" rx="10" fill="#eaf5ea" stroke="#3c8d40" stroke-width="2"/>
  <text x="364" y="211" font-size="18" font-weight="600" text-anchor="start" fill="#1f2933">What shape is my company?</text>
  <rect x="362" y="233" width="282" height="36" rx="6" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
  <text x="374" y="257" font-size="15" text-anchor="start" fill="#1f2933">One tenant, many subscriptions</text>
  <rect x="362" y="275" width="282" height="36" rx="6" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
  <text x="374" y="299" font-size="15" text-anchor="start" fill="#1f2933">Several tenants after mergers</text>
  <rect x="362" y="317" width="282" height="36" rx="6" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
  <text x="374" y="341" font-size="15" text-anchor="start" fill="#1f2933">Many countries, conflicting rules</text>
  <rect x="362" y="359" width="282" height="36" rx="6" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
  <text x="374" y="383" font-size="15" text-anchor="start" fill="#1f2933">A software company (ISV)</text>
  <line x1="362" y1="575" x2="644" y2="575" stroke="#3c8d40" stroke-width="1.2"/>
  <text x="364" y="601" font-size="15" font-weight="600" text-anchor="start" fill="#1f2933">Answer: how many tenants, groups</text>
  <line x1="503" y1="145" x2="828" y2="177" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="673" y="177" width="310" height="440" rx="10" fill="#fdf3e3" stroke="#c98a1b" stroke-width="2"/>
  <text x="689" y="211" font-size="18" font-weight="600" text-anchor="start" fill="#1f2933">Do special rules apply?</text>
  <rect x="687" y="233" width="282" height="36" rx="6" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
  <text x="699" y="257" font-size="15" text-anchor="start" fill="#1f2933">Sovereignty controls</text>
  <rect x="687" y="275" width="282" height="36" rx="6" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
  <text x="699" y="299" font-size="15" text-anchor="start" fill="#1f2933">Servers that stay on premises</text>
  <line x1="687" y1="575" x2="969" y2="575" stroke="#c98a1b" stroke-width="1.2"/>
  <text x="689" y="601" font-size="15" font-weight="600" text-anchor="start" fill="#1f2933">Answer: Sovereign design or Arc</text>
</svg>
