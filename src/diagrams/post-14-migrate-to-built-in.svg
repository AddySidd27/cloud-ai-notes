<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">Decision tree for migrating Azure landing zone custom policies to built-in policies</title>
  <desc id="d">Redraw of the Learn decision tree. If a policy or initiative is not assigned, delete the Azure landing zone policy or initiative definition. If a policy is assigned directly, assign the Azure built-in policy and delete the Azure landing zone policy assignments. If assigned through an initiative that is superseded by an Azure built-in initiative, assign the built-in initiative, delete the Azure landing zone initiative assignments, and delete the initiative definition. If the initiative is not superseded, update the Azure landing zone initiative definition.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/></marker></defs>
  <polygon points="215,156 229,170 215,184 201,170" fill="#2b7cd3" stroke="#1f5fa8" stroke-width="1"/>
  <polygon points="215,256 229,270 215,284 201,270" fill="#2b7cd3" stroke="#1f5fa8" stroke-width="1"/>
  <polygon points="215,396 229,410 215,424 201,410" fill="#2b7cd3" stroke="#1f5fa8" stroke-width="1"/>
  <polygon points="360,396 374,410 360,424 346,410" fill="#2b7cd3" stroke="#1f5fa8" stroke-width="1"/>
  <rect x="80" y="10" width="270" height="48" rx="14" fill="#8ec5f0" stroke="#7fb1dc" stroke-width="1.2"/>
  <text x="215.0" y="29.55" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2933">Azure landing zone</text>
  <text x="215.0" y="47.55" font-size="13" text-anchor="middle" fill="#1f2933">Policy updates required</text>
  <rect x="80" y="80" width="270" height="48" rx="4" fill="#cfe6f7" stroke="#a9c9e2" stroke-width="1.2"/>
  <text x="215.0" y="99.55" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2933">Azure landing zone</text>
  <text x="215.0" y="117.55" font-size="13" text-anchor="middle" fill="#1f2933">Policies in scope for updating</text>
  <line x1="215" y1="58" x2="215" y2="80" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="215" y1="128" x2="215" y2="156" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="193" y="165.5" font-size="13" text-anchor="end" fill="#1f2933">Policy or policy</text>
  <text x="193" y="182.5" font-size="13" text-anchor="end" fill="#1f2933">initiative assigned</text>
  <text x="262" y="163" font-size="13" text-anchor="middle" fill="#1f2933">No</text>
  <line x1="229" y1="170" x2="290" y2="170" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="290" y="146" width="300" height="48" rx="4" fill="#cdeee6" stroke="#9fb9d0" stroke-width="1.2"/>
  <text x="440.0" y="165.55" font-size="13" text-anchor="middle" fill="#1f2933">Delete Azure landing zone policy</text>
  <text x="440.0" y="183.55" font-size="13" text-anchor="middle" fill="#1f2933">or policy initiative definition</text>
  <text x="207" y="218" font-size="13" text-anchor="end" fill="#1f2933">Yes</text>
  <line x1="215" y1="184" x2="215" y2="256" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="193" y="265.5" font-size="13" text-anchor="end" fill="#1f2933">Policy assigned</text>
  <text x="193" y="282.5" font-size="13" text-anchor="end" fill="#1f2933">directly</text>
  <text x="262" y="263" font-size="13" text-anchor="middle" fill="#1f2933">Yes</text>
  <line x1="229" y1="270" x2="290" y2="270" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="290" y="246" width="150" height="48" rx="4" fill="#d5e8f5" stroke="#9fb9d0" stroke-width="1.2"/>
  <text x="365.0" y="265.55" font-size="13" text-anchor="middle" fill="#1f2933">Assign Azure</text>
  <text x="365.0" y="283.55" font-size="13" text-anchor="middle" fill="#1f2933">built-in policy</text>
  <line x1="440" y1="270" x2="474" y2="270" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="474" y="246" width="220" height="48" rx="4" fill="#d5e8f5" stroke="#9fb9d0" stroke-width="1.2"/>
  <text x="584.0" y="265.55" font-size="13" text-anchor="middle" fill="#1f2933">Delete Azure landing</text>
  <text x="584.0" y="283.55" font-size="13" text-anchor="middle" fill="#1f2933">zone policy assignment(s)</text>
  <text x="207" y="322" font-size="13" text-anchor="end" fill="#1f2933">No</text>
  <line x1="215" y1="284" x2="215" y2="396" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="193" y="405.5" font-size="13" text-anchor="end" fill="#1f2933">Policy assigned through</text>
  <text x="193" y="422.5" font-size="13" text-anchor="end" fill="#1f2933">policy initiative</text>
  <text x="262" y="403" font-size="13" text-anchor="middle" fill="#1f2933">Yes</text>
  <line x1="229" y1="410" x2="346" y2="410" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="360" y="352" font-size="13" text-anchor="middle" fill="#1f2933">Azure landing zone policy</text>
  <text x="360" y="369" font-size="13" text-anchor="middle" fill="#1f2933">initiative superseded by Azure</text>
  <text x="360" y="386" font-size="13" text-anchor="middle" fill="#1f2933">built-in initiative</text>
  <text x="402" y="403" font-size="13" text-anchor="middle" fill="#1f2933">No</text>
  <line x1="374" y1="410" x2="436" y2="410" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="436" y="386" width="250" height="48" rx="4" fill="#d5e8f5" stroke="#9fb9d0" stroke-width="1.2"/>
  <text x="561.0" y="405.55" font-size="13" text-anchor="middle" fill="#1f2933">Update Azure landing zone</text>
  <text x="561.0" y="423.55" font-size="13" text-anchor="middle" fill="#1f2933">policy initiative definition</text>
  <text x="352" y="462" font-size="13" text-anchor="end" fill="#1f2933">Yes</text>
  <line x1="360" y1="424" x2="360" y2="484" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="280" y="484" width="160" height="56" rx="4" fill="#d5e8f5" stroke="#9fb9d0" stroke-width="1.2"/>
  <text x="360.0" y="507.55" font-size="13" text-anchor="middle" fill="#1f2933">Assign Azure</text>
  <text x="360.0" y="525.55" font-size="13" text-anchor="middle" fill="#1f2933">built-in initiative</text>
  <line x1="440" y1="512" x2="474" y2="512" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="474" y="484" width="220" height="56" rx="4" fill="#d5e8f5" stroke="#9fb9d0" stroke-width="1.2"/>
  <text x="584.0" y="498.55" font-size="13" text-anchor="middle" fill="#1f2933">Delete Azure landing zone</text>
  <text x="584.0" y="516.55" font-size="13" text-anchor="middle" fill="#1f2933">policy initiative</text>
  <text x="584.0" y="534.55" font-size="13" text-anchor="middle" fill="#1f2933">assignment(s)</text>
  <line x1="694" y1="512" x2="728" y2="512" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="728" y="484" width="260" height="56" rx="4" fill="#d5e8f5" stroke="#9fb9d0" stroke-width="1.2"/>
  <text x="858.0" y="507.55" font-size="13" text-anchor="middle" fill="#1f2933">Delete Azure landing zone</text>
  <text x="858.0" y="525.55" font-size="13" text-anchor="middle" fill="#1f2933">policy initiative definition</text>
</svg>
