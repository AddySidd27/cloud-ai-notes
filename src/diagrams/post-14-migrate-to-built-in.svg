<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 530" width="780" height="530" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">Decision tree for migrating Azure landing zone custom policies to built-in policies</title>
  <desc id="d">Redraw of the Learn decision tree. If a policy or initiative is not assigned, delete the Azure landing zone policy or initiative definition. If a policy is assigned directly, assign the Azure built-in policy and delete the Azure landing zone policy assignments. If assigned through an initiative that is superseded by an Azure built-in initiative, assign the built-in initiative, delete the Azure landing zone initiative assignments, and delete the initiative definition. If the initiative is not superseded, update the Azure landing zone initiative definition.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/></marker></defs>
  <polygon points="183,160 195,172 183,184 171,172" fill="#2b7cd3" stroke="#1f5fa8" stroke-width="1"/>
  <polygon points="183,256 195,268 183,280 171,268" fill="#2b7cd3" stroke="#1f5fa8" stroke-width="1"/>
  <polygon points="183,384 195,396 183,408 171,396" fill="#2b7cd3" stroke="#1f5fa8" stroke-width="1"/>
  <polygon points="318,384 330,396 318,408 306,396" fill="#2b7cd3" stroke="#1f5fa8" stroke-width="1"/>
  <rect x="82" y="10" width="203" height="50" rx="14" fill="#8ec5f0" stroke="#7fb1dc" stroke-width="1"/>
  <text x="183.5" y="31.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2933">Azure landing zone</text>
  <text x="183.5" y="47.0" font-size="12" text-anchor="middle" fill="#1f2933">Policy updates required</text>
  <rect x="82" y="80" width="203" height="51" rx="3" fill="#cfe6f7" stroke="#a9c9e2" stroke-width="1"/>
  <text x="183.5" y="101.5" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2933">Azure landing zone</text>
  <text x="183.5" y="117.5" font-size="12" text-anchor="middle" fill="#1f2933">Policies in scope for updating</text>
  <line x1="183" y1="60" x2="183" y2="80" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="183" y1="131" x2="183" y2="158" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="168" y="165" font-size="12" text-anchor="end" fill="#1f2933">Policy or policy</text>
  <text x="168" y="180" font-size="12" text-anchor="end" fill="#1f2933">initiative assigned</text>
  <text x="232" y="177" font-size="12" text-anchor="middle" fill="#1f2933">No</text>
  <line x1="196" y1="172" x2="433" y2="172" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="433" y="148" width="239" height="48" rx="3" fill="#cdeee6" stroke="#9fb9d0" stroke-width="1"/>
  <text x="552.5" y="168.0" font-size="12" text-anchor="middle" fill="#1f2933">Delete Azure landing zone policy</text>
  <text x="552.5" y="184.0" font-size="12" text-anchor="middle" fill="#1f2933">or policy initiative definition</text>
  <text x="160" y="214" font-size="12" text-anchor="end" fill="#1f2933">Yes</text>
  <line x1="183" y1="184" x2="183" y2="255" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="168" y="272" font-size="12" text-anchor="end" fill="#1f2933">Policy assigned directly</text>
  <text x="232" y="262" font-size="12" text-anchor="middle" fill="#1f2933">Yes</text>
  <line x1="196" y1="268" x2="306" y2="268" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="306" y="243" width="129" height="50" rx="3" fill="#d5e8f5" stroke="#9fb9d0" stroke-width="1"/>
  <text x="370.5" y="264.0" font-size="12" text-anchor="middle" fill="#1f2933">Assign Azure</text>
  <text x="370.5" y="280.0" font-size="12" text-anchor="middle" fill="#1f2933">built-in policy</text>
  <line x1="435" y1="268" x2="467" y2="268" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="467" y="243" width="208" height="50" rx="3" fill="#d5e8f5" stroke="#9fb9d0" stroke-width="1"/>
  <text x="571.0" y="264.0" font-size="12" text-anchor="middle" fill="#1f2933">Delete Azure landing</text>
  <text x="571.0" y="280.0" font-size="12" text-anchor="middle" fill="#1f2933">zone policy assignment(s)</text>
  <text x="160" y="310" font-size="12" text-anchor="end" fill="#1f2933">No</text>
  <line x1="183" y1="281" x2="183" y2="383" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="168" y="390" font-size="12" text-anchor="end" fill="#1f2933">Policy assigned through</text>
  <text x="168" y="405" font-size="12" text-anchor="end" fill="#1f2933">policy initiative</text>
  <text x="232" y="391" font-size="12" text-anchor="middle" fill="#1f2933">Yes</text>
  <line x1="196" y1="396" x2="305" y2="396" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="318" y="334" font-size="12" text-anchor="middle" fill="#3a3a3a">Azure landing zone policy</text>
  <text x="318" y="349" font-size="12" text-anchor="middle" fill="#3a3a3a">initiative superseded by Azure</text>
  <text x="318" y="364" font-size="12" text-anchor="middle" fill="#3a3a3a">built-in initiative</text>
  <text x="372" y="391" font-size="12" text-anchor="middle" fill="#1f2933">No</text>
  <line x1="331" y1="396" x2="468" y2="396" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="468" y="373" width="207" height="50" rx="3" fill="#d5e8f5" stroke="#9fb9d0" stroke-width="1"/>
  <text x="571.5" y="394.0" font-size="12" text-anchor="middle" fill="#1f2933">Update Azure landing zone</text>
  <text x="571.5" y="410.0" font-size="12" text-anchor="middle" fill="#1f2933">policy initiative definition</text>
  <text x="308" y="440" font-size="12" text-anchor="end" fill="#1f2933">Yes</text>
  <line x1="318" y1="409" x2="318" y2="452" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="253" y="452" width="120" height="53" rx="3" fill="#d5e8f5" stroke="#9fb9d0" stroke-width="1"/>
  <text x="313.0" y="474.5" font-size="12" text-anchor="middle" fill="#1f2933">Assign Azure</text>
  <text x="313.0" y="490.5" font-size="12" text-anchor="middle" fill="#1f2933">built-in initiative</text>
  <line x1="373" y1="478" x2="398" y2="478" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="398" y="452" width="164" height="53" rx="3" fill="#d5e8f5" stroke="#9fb9d0" stroke-width="1"/>
  <text x="480.0" y="466.5" font-size="12" text-anchor="middle" fill="#1f2933">Delete Azure landing zone</text>
  <text x="480.0" y="482.5" font-size="12" text-anchor="middle" fill="#1f2933">policy initiative</text>
  <text x="480.0" y="498.5" font-size="12" text-anchor="middle" fill="#1f2933">assignment(s)</text>
  <line x1="562" y1="478" x2="583" y2="478" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="583" y="452" width="182" height="53" rx="3" fill="#d5e8f5" stroke="#9fb9d0" stroke-width="1"/>
  <text x="674.0" y="474.5" font-size="12" text-anchor="middle" fill="#1f2933">Delete Azure landing zone</text>
  <text x="674.0" y="490.5" font-size="12" text-anchor="middle" fill="#1f2933">policy initiative definition</text>
</svg>
