<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">Billing and access meet at the subscription</title>
  <desc id="d">Two stacks join at one subscription box. Left, billing under an Enterprise Agreement: enrollment, then department, then account, where each account has one account owner who creates subscriptions. Right, access and policy: the Microsoft Entra tenant, then management groups, which pass Azure roles and policy down. Below the subscription box sit resource groups and resources. A note at the bottom says billing roles and Azure roles are separate systems, and that seeing prices needs both. Own layout by the author, not an official Microsoft diagram.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/></marker></defs>
  <text x="500" y="36" font-size="24" font-weight="600" text-anchor="middle" fill="#1f2933">Billing and access meet at the subscription</text>
  <text x="500" y="64" font-size="16" text-anchor="middle" fill="#3a3a3a">Two separate systems manage the same subscription, usually with different people.</text>
  <rect x="20" y="90" width="460" height="330" rx="10" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="2"/>
  <text x="40" y="122" font-size="19" font-weight="600" text-anchor="start" fill="#1f2933">Billing: who pays and who creates</text>
  <text x="40" y="146" font-size="15" text-anchor="start" fill="#3a3a3a">Example: an Enterprise Agreement</text>
  <rect x="40" y="164" width="420" height="66" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
  <text x="54" y="191" font-size="17" font-weight="600" text-anchor="start" fill="#1f2933">Enrollment</text>
  <text x="54" y="213" font-size="15" text-anchor="start" fill="#3a3a3a">Held by the company; enterprise administrators</text>
  <rect x="40" y="254" width="420" height="66" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
  <text x="54" y="281" font-size="17" font-weight="600" text-anchor="start" fill="#1f2933">Departments</text>
  <text x="54" y="303" font-size="15" text-anchor="start" fill="#3a3a3a">Group costs; department administrators</text>
  <rect x="40" y="344" width="420" height="66" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
  <text x="54" y="371" font-size="17" font-weight="600" text-anchor="start" fill="#1f2933">Accounts</text>
  <text x="54" y="393" font-size="15" text-anchor="start" fill="#3a3a3a">One account owner each; creates subscriptions</text>
  <line x1="250" y1="230" x2="250" y2="254" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="250" y1="320" x2="250" y2="344" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="520" y="90" width="460" height="330" rx="10" fill="#eaf5ea" stroke="#3c8d40" stroke-width="2"/>
  <text x="540" y="122" font-size="19" font-weight="600" text-anchor="start" fill="#1f2933">Access: who may do what</text>
  <text x="540" y="146" font-size="15" text-anchor="start" fill="#3a3a3a">Inherited from the group above</text>
  <rect x="540" y="164" width="420" height="66" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
  <image x="552" y="179.0" width="36" height="36" href="data:image/svg+xml;base64,"/>
  <text x="600" y="191" font-size="17" font-weight="600" text-anchor="start" fill="#1f2933">Microsoft Entra tenant</text>
  <text x="600" y="213" font-size="15" text-anchor="start" fill="#3a3a3a">Sign-in, plus the root management group</text>
  <rect x="540" y="254" width="420" height="66" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
  <image x="552" y="269.0" width="36" height="36" href="data:image/svg+xml;base64,"/>
  <text x="600" y="281" font-size="17" font-weight="600" text-anchor="start" fill="#1f2933">Management groups</text>
  <text x="600" y="303" font-size="15" text-anchor="start" fill="#3a3a3a">Pass Azure roles and policy down</text>
  <rect x="540" y="344" width="420" height="66" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
  <text x="554" y="371" font-size="17" font-weight="600" text-anchor="start" fill="#1f2933">Role assignments and policy</text>
  <text x="554" y="393" font-size="15" text-anchor="start" fill="#3a3a3a">Owner, Contributor; policy rules</text>
  <line x1="750" y1="230" x2="750" y2="254" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="750" y1="320" x2="750" y2="344" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="250" y1="410" x2="250" y2="452" stroke="#3a3a3a" stroke-width="2.5"/>
  <line x1="250" y1="452" x2="320" y2="452" stroke="#3a3a3a" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="750" y1="410" x2="750" y2="452" stroke="#3a3a3a" stroke-width="2.5"/>
  <line x1="750" y1="452" x2="680" y2="452" stroke="#3a3a3a" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="320" y="424" width="360" height="60" rx="8" fill="#fdf3e3" stroke="#c98a1b" stroke-width="2"/>
  <image x="334" y="436" width="36" height="36" href="data:image/svg+xml;base64,"/>
  <text x="382" y="460" font-size="19" font-weight="600" text-anchor="start" fill="#1f2933">Subscription</text>
  <line x1="500" y1="484" x2="500" y2="512" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="320" y="512" width="360" height="52" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
  <image x="334" y="520" width="36" height="36" href="data:image/svg+xml;base64,"/>
  <text x="382" y="544" font-size="17" font-weight="600" text-anchor="start" fill="#1f2933">Resource groups, resources</text>
  <rect x="20" y="590" width="960" height="190" rx="10" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
  <text x="40" y="620" font-size="18" font-weight="600" text-anchor="start" fill="#1f2933">What this means in practice</text>
  <rect x="40" y="640" width="8" height="8" rx="4" fill="#1f2933" stroke="#1f2933" stroke-width="1"/>
  <text x="60" y="654" font-size="16" text-anchor="start" fill="#1f2933">Billing roles decide who creates subscriptions and who sees cost. They go to individual users.</text>
  <rect x="40" y="672" width="8" height="8" rx="4" fill="#1f2933" stroke="#1f2933" stroke-width="1"/>
  <text x="60" y="686" font-size="16" text-anchor="start" fill="#1f2933">Azure roles and policy decide what happens inside. Management groups pass them down.</text>
  <rect x="40" y="704" width="8" height="8" rx="4" fill="#1f2933" stroke="#1f2933" stroke-width="1"/>
  <text x="60" y="718" font-size="16" text-anchor="start" fill="#1f2933">Seeing prices needs both: a billing role with view charges turned on, and the Owner role.</text>
  <rect x="40" y="736" width="8" height="8" rx="4" fill="#1f2933" stroke="#1f2933" stroke-width="1"/>
  <text x="60" y="750" font-size="16" text-anchor="start" fill="#1f2933">So a finance contact and a subscription Owner are different people with different tools.</text>
</svg>
