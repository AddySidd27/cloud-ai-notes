<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1006 742" width="1006" height="742" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">A new subscription, request to workload</title>
  <desc id="d">Five steps, each with who does it. 1 The workload team asks for a subscription and gives budget, owner, network needs and how critical it is. 2 The central cloud team, the Cloud Center of Excellence (CCoE), approves against its rules. 3 The platform team creates the subscription, places it in the right management group, sets tags, budget, owner and access groups. 4 The platform team hands it to the workload team. 5 The workload team updates the budget, deploys and runs the workload.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/></marker></defs>
  <rect x="6" y="6" width="994" height="730" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
  <text x="503" y="45" font-size="24" font-weight="600" text-anchor="middle" fill="#1f2933">A new subscription, from request to workload</text>
  <text x="503" y="73" font-size="16" text-anchor="middle" fill="#3a3a3a">Who does each step, and what exists afterwards.</text>
  <rect x="23" y="103" width="960" height="104" rx="10" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="2"/>
  <rect x="37" y="117" width="170" height="76" rx="8" fill="#ffffff" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="122" y="161" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Workload team</text>
  <rect x="227" y="141" width="28" height="28" rx="14" fill="#1f2933" stroke="#1f2933" stroke-width="1"/>
  <text x="241" y="161" font-size="16" font-weight="600" text-anchor="middle" fill="#ffffff">1</text>
  <text x="271" y="137" font-size="19" font-weight="600" text-anchor="start" fill="#1f2933">Ask</text>
  <text x="271" y="161" font-size="15" text-anchor="start" fill="#3a3a3a">Names a budget, an owner, network needs</text>
  <text x="271" y="182" font-size="15" text-anchor="start" fill="#3a3a3a">and how critical the workload is.</text>
  <rect x="693" y="123" width="276" height="64" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
  <text x="707" y="145" font-size="14" font-weight="600" text-anchor="start" fill="#3a3a3a">Result</text>
  <text x="707" y="169" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">A request with all the facts</text>
  <line x1="241" y1="207" x2="241" y2="231" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="23" y="231" width="960" height="104" rx="10" fill="#fdf3e3" stroke="#c98a1b" stroke-width="2"/>
  <rect x="37" y="245" width="170" height="76" rx="8" fill="#ffffff" stroke="#c98a1b" stroke-width="1.2"/>
  <text x="122" y="281" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Central cloud team</text>
  <text x="122" y="302" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">(CCoE)</text>
  <rect x="227" y="269" width="28" height="28" rx="14" fill="#1f2933" stroke="#1f2933" stroke-width="1"/>
  <text x="241" y="289" font-size="16" font-weight="600" text-anchor="middle" fill="#ffffff">2</text>
  <text x="271" y="265" font-size="19" font-weight="600" text-anchor="start" fill="#1f2933">Approve</text>
  <text x="271" y="289" font-size="15" text-anchor="start" fill="#3a3a3a">The request goes through the approval</text>
  <text x="271" y="310" font-size="15" text-anchor="start" fill="#3a3a3a">process this team built in advance.</text>
  <rect x="693" y="251" width="276" height="64" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
  <text x="707" y="273" font-size="14" font-weight="600" text-anchor="start" fill="#3a3a3a">Result</text>
  <text x="707" y="297" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">An approved request</text>
  <line x1="241" y1="335" x2="241" y2="359" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="23" y="359" width="960" height="104" rx="10" fill="#eaf5ea" stroke="#3c8d40" stroke-width="2"/>
  <rect x="37" y="373" width="170" height="76" rx="8" fill="#ffffff" stroke="#3c8d40" stroke-width="1.2"/>
  <text x="122" y="417" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Platform team</text>
  <rect x="227" y="397" width="28" height="28" rx="14" fill="#1f2933" stroke="#1f2933" stroke-width="1"/>
  <text x="241" y="417" font-size="16" font-weight="600" text-anchor="middle" fill="#ffffff">3</text>
  <text x="271" y="393" font-size="19" font-weight="600" text-anchor="start" fill="#1f2933">Create and place</text>
  <text x="271" y="417" font-size="15" text-anchor="start" fill="#3a3a3a">Creates it, puts it in the right management</text>
  <text x="271" y="438" font-size="15" text-anchor="start" fill="#3a3a3a">group, sets tags, budget, owner, access groups.</text>
  <rect x="693" y="379" width="276" height="64" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
  <text x="707" y="401" font-size="14" font-weight="600" text-anchor="start" fill="#3a3a3a">Result</text>
  <text x="707" y="425" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">A governed subscription</text>
  <line x1="241" y1="463" x2="241" y2="487" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="23" y="487" width="960" height="104" rx="10" fill="#eaf5ea" stroke="#3c8d40" stroke-width="2"/>
  <rect x="37" y="501" width="170" height="76" rx="8" fill="#ffffff" stroke="#3c8d40" stroke-width="1.2"/>
  <text x="122" y="545" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Platform team</text>
  <rect x="227" y="525" width="28" height="28" rx="14" fill="#1f2933" stroke="#1f2933" stroke-width="1"/>
  <text x="241" y="545" font-size="16" font-weight="600" text-anchor="middle" fill="#ffffff">4</text>
  <text x="271" y="521" font-size="19" font-weight="600" text-anchor="start" fill="#1f2933">Hand over</text>
  <text x="271" y="545" font-size="15" text-anchor="start" fill="#3a3a3a">Gives the subscription to the workload team.</text>
  <text x="271" y="566" font-size="15" text-anchor="start" fill="#3a3a3a">The platform team keeps the governance.</text>
  <rect x="693" y="507" width="276" height="64" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
  <text x="707" y="529" font-size="14" font-weight="600" text-anchor="start" fill="#3a3a3a">Result</text>
  <text x="707" y="553" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">An owner with a named role</text>
  <line x1="241" y1="591" x2="241" y2="615" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="23" y="615" width="960" height="104" rx="10" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="2"/>
  <rect x="37" y="629" width="170" height="76" rx="8" fill="#ffffff" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="122" y="673" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Workload team</text>
  <rect x="227" y="653" width="28" height="28" rx="14" fill="#1f2933" stroke="#1f2933" stroke-width="1"/>
  <text x="241" y="673" font-size="16" font-weight="600" text-anchor="middle" fill="#ffffff">5</text>
  <text x="271" y="649" font-size="19" font-weight="600" text-anchor="start" fill="#1f2933">Deploy</text>
  <text x="271" y="673" font-size="15" text-anchor="start" fill="#3a3a3a">Adjusts the budget, deploys the workload,</text>
  <text x="271" y="694" font-size="15" text-anchor="start" fill="#3a3a3a">sets up day-to-day operations.</text>
  <rect x="693" y="635" width="276" height="64" rx="8" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
  <text x="707" y="657" font-size="14" font-weight="600" text-anchor="start" fill="#3a3a3a">Result</text>
  <text x="707" y="681" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">A workload that runs</text>
</svg>
