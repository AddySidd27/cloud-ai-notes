<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1260 630" width="1260" height="630" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">How an engineer reaches a Compute Engine VM that has no external IP address</title><desc id="d">An engineer runs gcloud compute ssh. The request goes to Identity-Aware Proxy, which needs the IAP-secured Tunnel User role. The traffic is allowed by a firewall rule that admits ingress on tcp:22 from the IAP range 35.235.240.0/20. The VM has OS Login on, and the engineer needs an OS Login role, granted on the project, or with an extra project-level role that contains compute.projects.get for SSH from the console or gcloud. The VM needs no external IP address.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="6" y="6" width="1248" height="618" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
<rect x="30" y="60" width="210" height="230" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="44" y="88" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Engineer</text>
<text x="44" y="118" font-size="14" text-anchor="start" fill="#1f2933">Runs</text>
<text x="44" y="138" font-size="14" text-anchor="start" fill="#1f2933">gcloud compute ssh</text>
<text x="44" y="158" font-size="14" text-anchor="start" fill="#1f2933">INSTANCE_NAME</text>
<text x="44" y="178" font-size="14" text-anchor="start" fill="#1f2933"></text>
<text x="44" y="198" font-size="14" text-anchor="start" fill="#1f2933">No external IP:</text>
<text x="44" y="218" font-size="14" text-anchor="start" fill="#1f2933">gcloud uses IAP TCP</text>
<text x="44" y="238" font-size="14" text-anchor="start" fill="#1f2933">tunneling automatically</text>
<rect x="313" y="60" width="260" height="230" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<image x="327" y="72" width="32" height="32" href="data:image/svg+xml;base64,"/>
<text x="371" y="86" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Identity-Aware Proxy</text>
<text x="371" y="106" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">(IAP TCP forwarding)</text>
<text x="327" y="140" font-size="14" text-anchor="start" fill="#1f2933">Needs the IAP-secured</text>
<text x="327" y="160" font-size="14" text-anchor="start" fill="#1f2933">Tunnel User role</text>
<text x="327" y="180" font-size="14" text-anchor="start" fill="#1f2933"></text>
<text x="327" y="200" font-size="14" text-anchor="start" fill="#1f2933">Connects to the primary</text>
<text x="327" y="220" font-size="14" text-anchor="start" fill="#1f2933">internal IPv4 address</text>
<text x="327" y="240" font-size="14" text-anchor="start" fill="#1f2933">of the VM</text>
<rect x="646" y="60" width="240" height="230" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<image x="660" y="72" width="32" height="32" href="data:image/svg+xml;base64,"/>
<text x="704" y="86" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Firewall rule</text>
<text x="704" y="106" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">(allows IAP range)</text>
<text x="660" y="140" font-size="14" text-anchor="start" fill="#1f2933">Example name:</text>
<text x="660" y="160" font-size="14" text-anchor="start" fill="#1f2933">allow-ssh-ingress-from-iap</text>
<text x="660" y="180" font-size="14" text-anchor="start" fill="#1f2933">Direction: ingress</text>
<text x="660" y="200" font-size="14" text-anchor="start" fill="#1f2933">Allow: tcp:22</text>
<text x="660" y="220" font-size="14" text-anchor="start" fill="#1f2933">Source range (IAP):</text>
<text x="660" y="240" font-size="14" text-anchor="start" fill="#1f2933">35.235.240.0/20</text>
<rect x="959" y="60" width="270" height="230" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<image x="973" y="72" width="32" height="32" href="data:image/svg+xml;base64,"/>
<text x="1017" y="86" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Compute Engine VM</text>
<text x="1017" y="106" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">OS Login on</text>
<text x="973" y="140" font-size="14" text-anchor="start" fill="#1f2933">No external IP address</text>
<text x="973" y="160" font-size="14" text-anchor="start" fill="#1f2933">needed for IAP TCP forwarding</text>
<text x="973" y="180" font-size="14" text-anchor="start" fill="#1f2933"></text>
<text x="973" y="200" font-size="14" text-anchor="start" fill="#1f2933">Cannot use metadata-based</text>
<text x="973" y="220" font-size="14" text-anchor="start" fill="#1f2933">SSH keys (stored in project</text>
<text x="973" y="240" font-size="14" text-anchor="start" fill="#1f2933">or instance metadata)</text>
<rect x="283" y="360" width="320" height="250" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<image x="297" y="372" width="32" height="32" href="data:image/svg+xml;base64,"/>
<text x="341" y="386" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">IAM role</text>
<text x="341" y="406" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">IAP-secured Tunnel User</text>
<text x="297" y="440" font-size="14" text-anchor="start" fill="#1f2933">roles/iap.tunnelResourceAccessor</text>
<text x="297" y="460" font-size="14" text-anchor="start" fill="#1f2933"></text>
<text x="297" y="480" font-size="14" text-anchor="start" fill="#1f2933">Granted to a user or group</text>
<text x="297" y="500" font-size="14" text-anchor="start" fill="#1f2933">on the project, or on one VM</text>
<rect x="959" y="360" width="270" height="250" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<image x="973" y="372" width="32" height="32" href="data:image/svg+xml;base64,"/>
<text x="1017" y="386" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">IAM roles for</text>
<text x="1017" y="406" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">OS Login</text>
<text x="973" y="440" font-size="14" text-anchor="start" fill="#1f2933">roles/compute.osLogin:</text>
<text x="973" y="460" font-size="14" text-anchor="start" fill="#1f2933">login without admin (sudo)</text>
<text x="973" y="480" font-size="14" text-anchor="start" fill="#1f2933">roles/compute.osAdminLogin:</text>
<text x="973" y="500" font-size="14" text-anchor="start" fill="#1f2933">login with admin (sudo)</text>
<text x="973" y="520" font-size="14" text-anchor="start" fill="#1f2933">For console or gcloud SSH:</text>
<text x="973" y="540" font-size="14" text-anchor="start" fill="#1f2933">grant on the project, or</text>
<text x="973" y="560" font-size="14" text-anchor="start" fill="#1f2933">also a project role with</text>
<text x="973" y="580" font-size="14" text-anchor="start" fill="#1f2933">compute.projects.get</text>
<line x1="240" y1="175" x2="313" y2="175" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="573" y1="175" x2="646" y2="175" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="886" y1="175" x2="959" y2="175" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="443" y1="360" x2="443" y2="290" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1094" y1="360" x2="1094" y2="290" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="276.5" y="164" font-size="14" text-anchor="middle" fill="#1f2933">request</text>
<text x="922.5" y="164" font-size="14" text-anchor="middle" fill="#1f2933">request</text>
<text x="609.5" y="142" font-size="14" text-anchor="middle" fill="#1f2933">allowed</text>
<text x="609.5" y="160" font-size="14" text-anchor="middle" fill="#1f2933">by</text>
<text x="453" y="329" font-size="14" text-anchor="start" fill="#1f2933">role needed</text>
<text x="1104" y="329" font-size="14" text-anchor="start" fill="#1f2933">role needed</text>
</svg>