<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 770" width="1200" height="770" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">Network design option 1: a Shared VPC network for each environment</title><desc id="d">An on-premises network in two locations connects through redundant Cloud Interconnect instances to two Shared VPC networks, one for production and one for development. Each Shared VPC network is in a host project, where firewall rules are managed. Service projects attached to each host project host the workloads. No traffic between environments by design.</desc>
