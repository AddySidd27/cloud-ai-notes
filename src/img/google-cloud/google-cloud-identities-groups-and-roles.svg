<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 640" width="1100" height="640" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">Federating Google Cloud sign-in with an external identity provider, and giving roles to groups</title><desc id="d">Option 2, federation, as in the blueprint example. Left, your identity provider: Active Directory, groups by job function whose membership is managed with the identity provider processes, Microsoft Entra ID and Ping Identity and Okta as other providers with setup guides, and multi-factor authentication enforced at the identity provider. Right, Google: Cloud Identity receives identities that Google Cloud Directory Sync provisions, and sign-in is redirected to the identity provider. IAM roles are granted to the groups. Super admin accounts authenticate directly to Cloud Identity with a password.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="6" y="6" width="1088" height="628" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
<rect x="24" y="24" width="400" height="592" rx="8" fill="#f4f8fd" stroke="#9bbbe0" stroke-width="1.8"/>
<text x="44" y="50" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Your identity provider</text>
<rect x="44" y="76" width="360" height="110" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="224.0" y="104" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Active Directory</text>
<text x="224.0" y="130" font-size="14" text-anchor="middle" fill="#1f2933">Used in the blueprint example</text>
<rect x="44" y="206" width="360" height="100" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="224.0" y="234" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Groups by job function</text>
<text x="224.0" y="260" font-size="14" text-anchor="middle" fill="#1f2933">Managed with identity provider processes</text>
<text x="224.0" y="282" font-size="14" text-anchor="middle" fill="#1f2933">Example: grp-gcp-network-viewer</text>
<rect x="44" y="326" width="360" height="70" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5" stroke-dasharray="8 5"/>
<text x="106" y="354" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Microsoft Entra ID</text>
<text x="106" y="380" font-size="14" text-anchor="start" fill="#1f2933">Setup guide listed in the blueprint</text>
<image x="58" y="340" width="34" height="34" href="data:image/svg+xml;base64,"/>
<rect x="44" y="416" width="360" height="70" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5" stroke-dasharray="8 5"/>
<text x="60" y="444" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Ping Identity and Okta</text>
<text x="60" y="470" font-size="14" text-anchor="start" fill="#1f2933">Setup guides listed in the blueprint</text>
<rect x="44" y="506" width="360" height="90" rx="8" fill="#ffffff" stroke="#7fbf8e" stroke-width="1.5"/>
<text x="224.0" y="534" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Multi-factor authentication</text>
<text x="224.0" y="560" font-size="14" text-anchor="middle" fill="#1f2933">Enforce it at the identity provider,</text>
<text x="224.0" y="582" font-size="14" text-anchor="middle" fill="#1f2933">with a phishing-resistant mechanism</text>
<rect x="676" y="24" width="400" height="482" rx="8" fill="#f4f8fd" stroke="#9bbbe0" stroke-width="1.8"/>
<text x="696" y="50" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Google</text>
<rect x="696" y="76" width="360" height="110" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="876.0" y="104" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Cloud Identity</text>
<text x="876.0" y="130" font-size="14" text-anchor="middle" fill="#1f2933">Receives the identities</text>
<text x="876.0" y="152" font-size="14" text-anchor="middle" fill="#1f2933">No passwords are synchronized</text>
<rect x="696" y="206" width="360" height="130" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="758" y="234" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">IAM</text>
<text x="758" y="260" font-size="14" text-anchor="start" fill="#1f2933">Roles are granted to groups,</text>
<text x="758" y="282" font-size="14" text-anchor="start" fill="#1f2933">not to individual users.</text>
<text x="758" y="304" font-size="14" text-anchor="start" fill="#1f2933">Predefined roles, not basic roles.</text>
<image x="710" y="220" width="34" height="34" href="data:image/svg+xml;base64,"/>
<rect x="696" y="356" width="360" height="130" rx="8" fill="#ffffff" stroke="#e0a96b" stroke-width="1.5"/>
<text x="876.0" y="384" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Super admin accounts</text>
<text x="876.0" y="410" font-size="14" text-anchor="middle" fill="#1f2933">authenticate directly to</text>
<text x="876.0" y="432" font-size="14" text-anchor="middle" fill="#1f2933">Cloud Identity,</text>
<text x="876.0" y="454" font-size="14" text-anchor="middle" fill="#1f2933">with a password</text>
<line x1="404" y1="116" x2="696" y2="116" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="550.0" y="56" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Identities are provisioned</text>
<text x="550.0" y="78" font-size="14" text-anchor="middle" fill="#1f2933">(Google Cloud Directory Sync)</text>
<line x1="696" y1="160" x2="404" y2="160" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="550.0" y="182" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Sign-in is redirected to</text>
<text x="550.0" y="204" font-size="14" text-anchor="middle" fill="#1f2933">the identity provider</text>
<line x1="696" y1="256" x2="404" y2="256" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="550.0" y="282" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">IAM roles are granted</text>
<text x="550.0" y="304" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">to these groups</text>
</svg>