<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 1190" width="1100" height="1190" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">The four core elements of a Google Cloud landing zone</title><desc id="d">Top to bottom: before you start, create an organization resource and a billing account. An existing identity provider synchronizes with Cloud Identity. The landing zone has four core elements. Identity provisioning: Cloud Identity and IAM. Resource hierarchy: organization, folders and projects (the organization resource itself is created before you start). Network: Shared VPC, service projects, firewall rules, Cloud NAT, Cloud Interconnect and Cloud DNS private zone. Security controls: organization policy, VPC Service Controls and Security Command Center. A dashed band lists additional elements. Below, the first application: build the landing zone before you deploy your first application. The contents of the landing zone are an example.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="6" y="6" width="1088" height="1178" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
<rect x="560" y="26" width="500" height="64" rx="8" fill="#ffffff" stroke="#e0a96b" stroke-width="1.5"/>
<text x="810" y="53" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Before you start</text><text x="810" y="76" font-size="14" text-anchor="middle" fill="#1f2933">Create an organization resource and a billing account</text>
<rect x="202" y="26" width="312" height="64" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="358" y="53" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Existing identity provider</text><text x="358" y="76" font-size="14" text-anchor="middle" fill="#1f2933">On premises, in the example</text>
<rect x="40" y="124" width="1020" height="938" rx="8" fill="#f7f8fa" stroke="#d5dae1" stroke-width="1.5"/>
<text x="550" y="147" font-size="17" font-weight="600" text-anchor="middle" fill="#1f2933">Landing zone (example)</text>
<line x1="810" y1="90" x2="810" y2="124" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="56" y="168" width="988" height="148" rx="8" fill="#ffffff" stroke="#d5dae1" stroke-width="1.5"/>
<text x="143.0" y="236.0" font-size="17" font-weight="600" text-anchor="middle" fill="#1f2933">Identity</text>
<text x="143.0" y="258.0" font-size="17" font-weight="600" text-anchor="middle" fill="#1f2933">provisioning</text>
<rect x="230" y="180" width="256" height="124" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="244" y="211" font-size="15" font-weight="600" fill="#1f2933">Cloud Identity</text>
<text x="244" y="244" font-size="14" fill="#1f2933">Users and group membership</text>
<text x="244" y="264" font-size="14" fill="#1f2933">are synchronized from your</text>
<text x="244" y="284" font-size="14" fill="#1f2933">existing identity provider</text>
<rect x="502" y="180" width="256" height="124" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<image x="514" y="190" width="30" height="30" href="data:image/svg+xml;base64,"/>
<text x="548" y="211" font-size="15" font-weight="600" fill="#1f2933">IAM</text>
<text x="516" y="244" font-size="14" fill="#1f2933">Granular access to</text>
<text x="516" y="264" font-size="14" fill="#1f2933">Google Cloud resources</text>
<line x1="358" y1="90" x2="358" y2="180" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="56" y="326" width="988" height="148" rx="8" fill="#ffffff" stroke="#d5dae1" stroke-width="1.5"/>
<text x="143.0" y="394.0" font-size="17" font-weight="600" text-anchor="middle" fill="#1f2933">Resource</text>
<text x="143.0" y="416.0" font-size="17" font-weight="600" text-anchor="middle" fill="#1f2933">hierarchy</text>
<rect x="230" y="338" width="250" height="124" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="244" y="369" font-size="15" font-weight="600" fill="#1f2933">Organization</text>
<text x="244" y="402" font-size="14" fill="#1f2933">Created before you start</text>
<text x="244" y="422" font-size="14" fill="#1f2933">The root node for managing</text>
<text x="244" y="442" font-size="14" fill="#1f2933">resources in Google Cloud</text>
<rect x="506" y="338" width="250" height="124" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="520" y="369" font-size="15" font-weight="600" fill="#1f2933">Folders</text>
<text x="520" y="402" font-size="14" fill="#1f2933">Group projects based on</text>
<text x="520" y="422" font-size="14" fill="#1f2933">their environment</text>
<rect x="782" y="338" width="250" height="124" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="796" y="369" font-size="15" font-weight="600" fill="#1f2933">Projects</text>
<text x="796" y="402" font-size="14" fill="#1f2933">Group resources based on their</text>
<text x="796" y="422" font-size="14" fill="#1f2933">functionality and intended</text>
<text x="796" y="442" font-size="14" fill="#1f2933">boundaries for access control</text>
<line x1="480" y1="400.0" x2="506" y2="400.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="756" y1="400.0" x2="782" y2="400.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="56" y="484" width="988" height="284" rx="8" fill="#ffffff" stroke="#d5dae1" stroke-width="1.5"/>
<text x="143.0" y="631.0" font-size="17" font-weight="600" text-anchor="middle" fill="#1f2933">Network</text>
<rect x="230" y="496" width="256" height="124" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<image x="242" y="506" width="30" height="30" href="data:image/svg+xml;base64,"/>
<text x="276" y="527" font-size="15" font-weight="600" fill="#1f2933">Shared VPC</text>
<text x="244" y="560" font-size="14" fill="#1f2933">One for each environment:</text>
<text x="244" y="580" font-size="14" fill="#1f2933">production, development</text>
<text x="244" y="600" font-size="14" fill="#1f2933">and testing</text>
<rect x="502" y="496" width="256" height="124" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="516" y="527" font-size="15" font-weight="600" fill="#1f2933">Service projects</text>
<text x="516" y="560" font-size="14" fill="#1f2933">Configured to use the</text>
<text x="516" y="580" font-size="14" fill="#1f2933">Shared VPC networks; host</text>
<text x="516" y="600" font-size="14" fill="#1f2933">your application resources</text>
<rect x="774" y="496" width="256" height="124" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<image x="786" y="506" width="30" height="30" href="data:image/svg+xml;base64,"/>
<text x="820" y="527" font-size="15" font-weight="600" fill="#1f2933">Firewall rules</text>
<text x="788" y="560" font-size="14" fill="#1f2933">Control connectivity to and</text>
<text x="788" y="580" font-size="14" fill="#1f2933">from workloads</text>
<rect x="230" y="632" width="256" height="124" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<image x="242" y="642" width="30" height="30" href="data:image/svg+xml;base64,"/>
<text x="276" y="663" font-size="15" font-weight="600" fill="#1f2933">Cloud NAT</text>
<text x="244" y="696" font-size="14" fill="#1f2933">Outbound connections to the</text>
<text x="244" y="716" font-size="14" fill="#1f2933">internet from resources in</text>
<text x="244" y="736" font-size="14" fill="#1f2933">these networks</text>
<rect x="502" y="632" width="256" height="124" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<image x="514" y="642" width="30" height="30" href="data:image/svg+xml;base64,"/>
<text x="548" y="663" font-size="15" font-weight="600" fill="#1f2933">Cloud Interconnect</text>
<text x="516" y="696" font-size="14" fill="#1f2933">Connects on-premises</text>
<text x="516" y="716" font-size="14" fill="#1f2933">applications and users</text>
<rect x="774" y="632" width="256" height="124" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<image x="786" y="642" width="30" height="30" href="data:image/svg+xml;base64,"/>
<text x="820" y="663" font-size="15" font-weight="600" fill="#1f2933">Cloud DNS private zone</text>
<text x="788" y="696" font-size="14" fill="#1f2933">Hosts DNS records for your</text>
<text x="788" y="716" font-size="14" fill="#1f2933">deployments in Google Cloud</text>
<rect x="56" y="778" width="988" height="168" rx="8" fill="#ffffff" stroke="#d5dae1" stroke-width="1.5"/>
<text x="143.0" y="856.0" font-size="17" font-weight="600" text-anchor="middle" fill="#1f2933">Security</text>
<text x="143.0" y="878.0" font-size="17" font-weight="600" text-anchor="middle" fill="#1f2933">controls</text>
<rect x="230" y="790" width="256" height="144" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="244" y="821" font-size="15" font-weight="600" fill="#1f2933">Organization policy</text>
<text x="244" y="854" font-size="14" fill="#1f2933">Constraints configured to</text>
<text x="244" y="874" font-size="14" fill="#1f2933">prevent various high-risk</text>
<text x="244" y="894" font-size="14" fill="#1f2933">configurations</text>
<rect x="502" y="790" width="256" height="144" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="516" y="821" font-size="15" font-weight="600" fill="#1f2933">VPC Service Controls</text>
<text x="516" y="854" font-size="14" fill="#1f2933">A perimeter isolates services</text>
<text x="516" y="874" font-size="14" fill="#1f2933">and resources, to mitigate data</text>
<text x="516" y="894" font-size="14" fill="#1f2933">leaving to Google Cloud</text>
<text x="516" y="914" font-size="14" fill="#1f2933">services outside the perimeter</text>
<rect x="774" y="790" width="256" height="144" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<image x="786" y="800" width="30" height="30" href="data:image/svg+xml;base64,"/>
<text x="820" y="821" font-size="15" font-weight="600" fill="#1f2933">Security Command Center</text>
<text x="788" y="854" font-size="14" fill="#1f2933">From the blueprint: threat</text>
<text x="788" y="874" font-size="14" fill="#1f2933">detection and monitoring</text>
<rect x="56" y="956" width="988" height="96" rx="8" fill="#ffffff" stroke="#b9c0ca" stroke-width="1.5" stroke-dasharray="8 5"/>
<text x="143.0" y="998.0" font-size="17" font-weight="600" text-anchor="middle" fill="#1f2933">Additional</text>
<text x="143.0" y="1020.0" font-size="17" font-weight="600" text-anchor="middle" fill="#1f2933">elements</text>
<text x="230" y="990" font-size="14" fill="#1f2933">Add as needed: monitoring and logging, backup and disaster recovery,</text><text x="230" y="1012" font-size="14" fill="#1f2933">compliance, cost efficiency and control, API management and</text><text x="230" y="1034" font-size="14" fill="#1f2933">cluster management</text>
<rect x="200" y="1092" width="700" height="72" rx="8" fill="#ffffff" stroke="#7fbf8e" stroke-width="1.5"/>
<text x="550" y="1120" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Your first application</text><text x="550" y="1144" font-size="14" text-anchor="middle" fill="#1f2933">Build the landing zone before you deploy your first application</text>
<line x1="550" y1="1062" x2="550" y2="1092" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
</svg>