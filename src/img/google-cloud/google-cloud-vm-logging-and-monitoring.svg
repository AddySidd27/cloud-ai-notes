<rect x="664" y="70" width="500" height="100" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="722" y="103.0" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Cloud Audit Logs</text>
<text x="722" y="127.0" font-size="14" text-anchor="start" fill="#1f2933">Answers: who did what, where and when</text>
<text x="722" y="149.0" font-size="14" text-anchor="start" fill="#1f2933">A user creating a VM is an Admin Activity event</text>
<image x="678" y="105.0" width="30" height="30" href="data:image/svg+xml;base64,"/>
<rect x="664" y="226" width="244" height="140" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="786.0" y="254" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">_Required bucket</text>
<text x="786.0" y="280" font-size="14" text-anchor="middle" fill="#1f2933">Admin Activity logs</text>
<text x="786.0" y="302" font-size="14" text-anchor="middle" fill="#1f2933">System Event logs</text>
<text x="786.0" y="324" font-size="14" text-anchor="middle" fill="#1f2933">Always written, stored in the</text>
<text x="786.0" y="346" font-size="14" text-anchor="middle" fill="#1f2933">project where generated</text>
<rect x="920" y="226" width="244" height="140" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="1042.0" y="254" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">_Default bucket</text>
<text x="1042.0" y="280" font-size="14" text-anchor="middle" fill="#1f2933">Policy Denied: generated</text>
<text x="1042.0" y="302" font-size="14" text-anchor="middle" fill="#1f2933">by default</text>
<text x="1042.0" y="324" font-size="14" text-anchor="middle" fill="#1f2933">Data Access: off by default,</text>
<text x="1042.0" y="346" font-size="14" text-anchor="middle" fill="#1f2933">except for BigQuery</text>
<line x1="786" y1="170" x2="786" y2="226" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="798" y="200" font-size="14" text-anchor="start" fill="#1f2933">stored in</text>
<line x1="1042" y1="170" x2="1042" y2="226" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="1054" y="200" font-size="14" text-anchor="start" fill="#1f2933">stored in</text>
<rect x="694" y="440" width="470" height="110" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="929.0" y="468" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">A different project as destination</text>
<text x="929.0" y="494" font-size="14" text-anchor="middle" fill="#1f2933">Admin Activity and System Event logs are stored</text>
<text x="929.0" y="516" font-size="14" text-anchor="middle" fill="#1f2933">there only if that project has its own log sink</text>
<polyline points="664,120 654,120 654,495 694,495" fill="none" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="662" y="200" font-size="14" text-anchor="start" fill="#1f2933">routed to</text>
</svg>