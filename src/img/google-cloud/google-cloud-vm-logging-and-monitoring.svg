<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1300 640" width="1300" height="640" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">How a VM sends logs and metrics, and how audit logs are stored and routed</title><desc id="d">Left: in a project, a VM instance runs the Ops Agent, which uses Fluent Bit for logs and the OpenTelemetry Collector for metrics and traces. The running agent requires access to logging.googleapis.com and monitoring.googleapis.com, shown as Cloud Logging and Cloud Monitoring outside the project box. The VM has an attached service account with the Logs Writer and Monitoring Metric Writer roles, and the agent uses its credentials. Right: Cloud Audit Logs answer who did what, where and when. Admin Activity and System Event logs are always written and stored in the _Required bucket of the project where they were generated. Policy Denied logs are generated by default and Data Access logs are off by default except for BigQuery; both are stored in the _Default bucket. Admin Activity and System Event logs routed to a different project are stored there only if that project has its own log sink.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="6" y="6" width="1288" height="628" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
<rect x="24" y="24" width="600" height="592" rx="8" fill="#f4f8fd" stroke="#9bbbe0" stroke-width="1.8"/>
<text x="44" y="50" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Logs and metrics from a VM</text>
<rect x="44" y="70" width="560" height="394" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.8" stroke-dasharray="8 5"/>
<text x="58" y="92" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Your project</text>
<rect x="58" y="112" width="532" height="120" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="324.0" y="140" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Service account</text>
<text x="324.0" y="166" font-size="14" text-anchor="middle" fill="#1f2933">Attached to the VM</text>
<text x="324.0" y="188" font-size="14" text-anchor="middle" fill="#1f2933">Role: Logs Writer</text>
<text x="324.0" y="210" font-size="14" text-anchor="middle" fill="#1f2933">Role: Monitoring Metric Writer</text>
<rect x="58" y="262" width="532" height="190" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.8"/>
<image x="74" y="270" width="30" height="30" href="data:image/svg+xml;base64,"/>
<text x="114" y="288" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">VM instance (Compute Engine)</text>
<rect x="74" y="316" width="500" height="120" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="324.0" y="344" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Ops Agent (runs on the VM)</text>
<text x="324.0" y="370" font-size="14" text-anchor="middle" fill="#1f2933">Fluent Bit for logs</text>
<text x="324.0" y="392" font-size="14" text-anchor="middle" fill="#1f2933">OpenTelemetry Collector for metrics and traces</text>
<text x="324.0" y="414" font-size="14" text-anchor="middle" fill="#1f2933">System logs and metrics with no configuration</text>
<line x1="530" y1="232" x2="530" y2="316" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="384" y="252" font-size="14" text-anchor="start" fill="#1f2933">credentials (ADC)</text>
<rect x="58" y="500" width="252" height="90" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="116" y="539.0" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Cloud Logging</text>
<text x="116" y="563.0" font-size="14" text-anchor="start" fill="#1f2933">logging.googleapis.com</text>
<image x="72" y="530.0" width="30" height="30" href="data:image/svg+xml;base64,"/>
<rect x="338" y="500" width="252" height="90" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="396" y="539.0" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Cloud Monitoring</text>
<text x="396" y="563.0" font-size="14" text-anchor="start" fill="#1f2933">monitoring.googleapis.com</text>
<image x="352" y="530.0" width="30" height="30" href="data:image/svg+xml;base64,"/>
<line x1="184" y1="436" x2="184" y2="500" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="196" y="490" font-size="14" text-anchor="start" fill="#1f2933">requires access to</text>
<line x1="464" y1="436" x2="464" y2="500" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="476" y="490" font-size="14" text-anchor="start" fill="#1f2933">requires access to</text>
<rect x="644" y="24" width="632" height="592" rx="8" fill="#f4f8fd" stroke="#9bbbe0" stroke-width="1.8"/>
