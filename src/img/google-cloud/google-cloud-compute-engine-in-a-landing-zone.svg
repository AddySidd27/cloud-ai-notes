<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 600" width="1100" height="600" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">Where a Compute Engine VM sits when the network is shared</title><desc id="d">An organization contains a host project and a service project. A Shared VPC Admin attaches the service project to the host project. The host project holds a Shared VPC network with a shared subnet. The service project holds the VM instance, which gets its internal IP address from the shared subnet, is subject to the firewall rules of the Shared VPC network, which are created in the host project, and runs as an attached service account. Three organization policy constraints apply: restrictSharedVpcHostProjects, restrictSharedVpcSubnetworks and iam.automaticIamGrantsForDefaultServiceAccounts.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="6" y="6" width="1088" height="588" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
<rect x="24" y="24" width="1052" height="552" rx="8" fill="#f4f8fd" stroke="#9bbbe0" stroke-width="1.8"/>
<text x="44" y="50" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Organization</text>
<rect x="44" y="70" width="1012" height="130" rx="8" fill="#ffffff" stroke="#e0a96b" stroke-width="1.5"/>
<text x="550.0" y="98" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Organization policy constraints</text>
<text x="550.0" y="124" font-size="14" text-anchor="middle" fill="#1f2933">compute.restrictSharedVpcHostProjects: which host projects a project can attach to</text>
<text x="550.0" y="146" font-size="14" text-anchor="middle" fill="#1f2933">compute.restrictSharedVpcSubnetworks: which shared subnets can be used</text>
<text x="550.0" y="168" font-size="14" text-anchor="middle" fill="#1f2933">iam.automaticIamGrantsForDefaultServiceAccounts: stops the automatic Editor grant</text>
<rect x="44" y="225" width="430" height="340" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.8" stroke-dasharray="8 5"/>
<text x="58" y="249" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Host project</text>
<rect x="58" y="270" width="402" height="160" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="116" y="300" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Shared VPC network</text>
<text x="116" y="322" font-size="14" text-anchor="start" fill="#1f2933">Lives in the host project</text>
<image x="72" y="284" width="30" height="30" href="data:image/svg+xml;base64,"/>
<rect x="76" y="335" width="366" height="75" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="92" y="368.5" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Shared subnet</text>
<text x="92" y="390.5" font-size="14" text-anchor="start" fill="#1f2933">Used by VMs in service projects</text>
<rect x="58" y="470" width="402" height="75" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="116" y="503.5" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Firewall rules</text>
<text x="116" y="525.5" font-size="14" text-anchor="start" fill="#1f2933">For the Shared VPC network: host project</text>
<image x="72" y="492.5" width="30" height="30" href="data:image/svg+xml;base64,"/>
<rect x="626" y="325" width="430" height="225" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.8" stroke-dasharray="8 5"/>
<text x="640" y="349" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Service project</text>
<rect x="640" y="225" width="402" height="70" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="656" y="256.0" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Service account</text>
<text x="656" y="278.0" font-size="14" text-anchor="start" fill="#1f2933">The account the VM runs as</text>
<rect x="640" y="370" width="402" height="75" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="698" y="403.5" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">VM instance</text>
<text x="698" y="425.5" font-size="14" text-anchor="start" fill="#1f2933">In the subnet&#x27;s region</text>
<image x="654" y="392.5" width="30" height="30" href="data:image/svg+xml;base64,"/>
<line x1="626" y1="350" x2="474" y2="350" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="550.0" y="289" font-size="14" text-anchor="middle" fill="#1f2933">attached by a</text>
<text x="550.0" y="307" font-size="14" text-anchor="middle" fill="#1f2933">Shared VPC</text>
<text x="550.0" y="325" font-size="14" text-anchor="middle" fill="#1f2933">Admin</text>
<line x1="640" y1="395" x2="442" y2="395" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="550.0" y="421" font-size="14" text-anchor="middle" fill="#1f2933">Uses subnet;</text>
<text x="550.0" y="439" font-size="14" text-anchor="middle" fill="#1f2933">internal IP</text>
<text x="550.0" y="457" font-size="14" text-anchor="middle" fill="#1f2933">comes from it</text>
<line x1="841" y1="370" x2="841" y2="295" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="853" y="352" font-size="14" text-anchor="start" fill="#1f2933">runs as</text>
<polyline points="460,507 841,507 841,445" fill="none" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="640" y="493" font-size="14" text-anchor="start" fill="#1f2933">allow or deny VM traffic</text>
</svg>