<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1464 971" width="1464" height="971" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">Example resource hierarchy from the enterprise foundations blueprint</title><desc id="d">An organization at the top with six folders below it: bootstrap, common, networking, production, nonproduction and development. An arrow runs from the organization to each folder, and from each folder to the projects it contains. Bootstrap holds two projects, common six, networking three, and each environment folder three.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
