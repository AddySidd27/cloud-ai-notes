<text x="137.0" y="264" font-size="14" text-anchor="middle" fill="#1f2933">foundation components</text>
<line x1="137.0" y1="124" x2="137.0" y2="198" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
