<text x="920.0" y="462" font-size="14" text-anchor="middle" fill="#1f2933">PC and VM must be in</text>
<text x="920.0" y="480" font-size="14" text-anchor="middle" fill="#1f2933">the same directory</text>
<image x="906.0" y="386" width="28" height="28" href="data:image/svg+xml;base64,"/>
<polyline points="920,380 920,302" fill="none" stroke="#5f6b7a" stroke-width="2.5" stroke-dasharray="6 4"/>
<polyline points="800,440 150,440 150,322" fill="none" stroke="#5f6b7a" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="480.0" y="462" font-size="14" text-anchor="middle" fill="#5f6b7a">same directory</text>
</svg>