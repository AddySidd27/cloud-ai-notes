<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 540" width="1100" height="540" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">Your PC and the ways to reach a Windows VM</title><desc id="d">Check your Windows PC first, with winver and dsregcmd /status, then pick a client. Remote Desktop Connection (mstsc) and Windows App can both reach a plain Windows virtual machine over RDP on TCP port 3389. The web browser client is crossed out because it only works for Azure Virtual Desktop, Windows 365 and Dev Box. The VM vm-azb-win01 is drawn dashed because you create it in the Windows VM lab. Microsoft Entra ID is shown below: your PC and the VM must be in the same directory, unless you use the web account setting.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="6" y="6" width="1088" height="528" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
<rect x="24" y="24" width="1052" height="492" rx="8" fill="#ffffff" stroke="#6c7a89" stroke-width="1.8"/>
<rect x="50" y="170" width="200" height="150" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="150.0" y="228" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Your Windows PC</text>
<text x="150.0" y="252" font-size="14" text-anchor="middle" fill="#1f2933">1 winver</text>
<text x="150.0" y="270" font-size="14" text-anchor="middle" fill="#1f2933">2 dsregcmd /status</text>
<text x="150.0" y="288" font-size="14" text-anchor="middle" fill="#1f2933">3 pick a client</text>
<image x="133.0" y="176" width="34" height="34" href="data:image/svg+xml;base64,"/>
<rect x="330" y="80" width="270" height="84" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="465.0" y="110" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Remote Desktop Connection</text>
<text x="465.0" y="136" font-size="14" text-anchor="middle" fill="#1f2933">mstsc.exe, built into Windows</text>
<rect x="330" y="205" width="270" height="84" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="465.0" y="235" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Windows App</text>
<text x="465.0" y="261" font-size="14" text-anchor="middle" fill="#1f2933">Computer name or IP address</text>
<rect x="330" y="330" width="270" height="84" rx="8" fill="#ffffff" stroke="#b4bcc7" stroke-width="1.5"/>
<text x="465.0" y="360" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Web browser client</text>
<text x="465.0" y="386" font-size="14" text-anchor="middle" fill="#1f2933">Only for AVD and Windows 365</text>
<line x1="252" y1="215" x2="328" y2="130" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="252" y1="245" x2="328" y2="247" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="252" y1="280" x2="328" y2="370" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="800" y="170" width="240" height="130" rx="8" fill="#ffffff" stroke="#b4bcc7" stroke-width="1.8" stroke-dasharray="8 5"/>
<image x="905.0" y="176" width="30" height="30" href="data:image/svg+xml;base64,"/>
<text x="920.0" y="228" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">vm-azb-win01</text>
<text x="920.0" y="252" font-size="14" text-anchor="middle" fill="#1f2933">You create it in the</text>
<text x="920.0" y="270" font-size="14" text-anchor="middle" fill="#1f2933">Windows VM lab</text>
<line x1="602" y1="122" x2="798" y2="205" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="715.0" y="144" font-size="14" text-anchor="middle" fill="#5f6b7a">RDP, TCP 3389</text>
<line x1="602" y1="247" x2="798" y2="247" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="715.0" y="238" font-size="14" text-anchor="middle" fill="#5f6b7a">RDP, TCP 3389</text>
