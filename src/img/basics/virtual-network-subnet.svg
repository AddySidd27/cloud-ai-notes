<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">A virtual network and a subnet</title><desc id="d">The resource group rg-azb-lab contains the virtual network vnet-azb with the address range 10.10.0.0/16, which is 10.10.0.0 to 10.10.255.255 and 65,536 addresses. Inside it is the subnet snet-vm with the range 10.10.1.0/24, which is 10.10.1.0 to 10.10.1.255 and 256 addresses, of which 251 are usable because Azure reserves 5. A virtual machine is added in a later lab and its first address is 10.10.1.4.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="6" y="6" width="1088" height="548" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
<rect x="24" y="24" width="1052" height="512" rx="8" fill="#ffffff" stroke="#6c7a89" stroke-width="1.8"/>
<image x="70" y="42" width="28" height="28" href="data:image/svg+xml;base64,"/>
<text x="106" y="61" font-size="15" font-weight="600" text-anchor="start" fill="#1f2933">Resource group rg-azb-lab</text>
<rect x="60" y="90" width="980" height="420" rx="8" fill="#f4f8fd" stroke="#9bbbe0" stroke-width="1.8" stroke-dasharray="8 5"/>
<image x="104" y="104" width="30" height="30" href="data:image/svg+xml;base64,"/>
<text x="144" y="122" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Virtual network vnet-azb, in your region</text>
<text x="144" y="146" font-size="14" text-anchor="start" fill="#1f2933">10.10.0.0/16 = 10.10.0.0 to 10.10.255.255 (65,536 addresses)</text>
<rect x="120" y="170" width="860" height="310" rx="8" fill="#ffffff" stroke="#e6b866" stroke-width="1.8" stroke-dasharray="8 5"/>
<image x="164" y="184" width="30" height="30" href="data:image/svg+xml;base64,"/>
<text x="204" y="202" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Subnet snet-vm</text>
<text x="204" y="226" font-size="14" text-anchor="start" fill="#1f2933">10.10.1.0/24 = 10.10.1.0 to 10.10.1.255 (256 addresses)</text>
<text x="204" y="250" font-size="14" text-anchor="start" fill="#1f2933">251 usable: Azure keeps the first four and the last address.</text>
<rect x="160" y="280" width="780" height="170" rx="8" fill="#ffffff" stroke="#b4bcc7" stroke-width="1.8" stroke-dasharray="8 5"/>
<text x="550.0" y="342" font-size="14" text-anchor="middle" fill="#5f6b7a">A virtual machine comes in a later lab</text>
<rect x="380" y="372" width="340" height="32" rx="16.0" fill="#f4f8fd" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="550.0" y="392.0" font-size="14" text-anchor="middle" fill="#1f2933">The first VM gets 10.10.1.4</text>
</svg>