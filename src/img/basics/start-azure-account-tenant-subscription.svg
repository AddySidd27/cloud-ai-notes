<text x="530.0" y="208" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Subscription</text>
<text x="530.0" y="232" font-size="13" text-anchor="middle" fill="#1f2933">Where resources and</text>
<text x="530.0" y="250" font-size="13" text-anchor="middle" fill="#1f2933">costs are tracked</text>
