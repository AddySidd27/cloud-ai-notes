<text x="198.0" y="250" font-size="13" text-anchor="middle" fill="#1f2933">Your test tenant</text>
<image x="181.0" y="156" width="34" height="34" href="data:image/svg+xml;base64,"/>
<text x="198.0" y="316" font-size="12" text-anchor="middle" fill="#5f6b7a">One tenant can trust many subscriptions</text>
