<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">Tenant, subscription, resource providers and region</title><desc id="d">A tenant holds the identities. One subscription trusts the tenant. Resource providers are registered in the subscription, and each resource is created in one region. The Microsoft.DesktopVirtualization provider is needed later for Azure Virtual Desktop.</desc>
