<rect x="24" y="24" width="1052" height="472" rx="8" fill="#ffffff" stroke="#6c7a89" stroke-width="1.8"/>
<rect x="48" y="70" width="300" height="380" rx="8" fill="#f4f8fd" stroke="#9bbbe0" stroke-width="1.8" stroke-dasharray="8 5"/>
<text x="198.0" y="96" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2933">Tenant (the directory)</text>
<rect x="88" y="150" width="220" height="120" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="198.0" y="208" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Microsoft Entra ID</text>
