<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 1140" width="1100" height="1140" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">Decision tree: a session host is missing from the host pool or never becomes Available</title><desc id="d">The first question is whether the VM deployment succeeded. If not, read the deployment error; if yes, the tree asks in order whether the host joined the domain, whether the agent and boot loader are installed, whether the registration token is valid, whether the VM name is unique, whether the host can reach the broker on port 443 and whether the side-by-side stack is listening, and ends with a full reinstall and re-register.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="6" y="6" width="1088" height="1128" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
<rect x="130" y="34" width="400" height="56" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="1.5"/>
<text x="330.0" y="56" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Host missing from the host pool,</text>
<text x="330.0" y="76" font-size="14" text-anchor="middle" fill="#1f2933">or it never becomes Available</text>
<line x1="330" y1="92" x2="330" y2="132" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<polygon points="330,134.0 490.0,180.0 330,226.0 170.0,180.0" fill="#eef5fc" stroke="#9bbbe0" stroke-width="1.8"/>
<text x="330" y="177.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Did the VM deployment</text>
<text x="330" y="195.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">succeed?</text>
<rect x="640" y="132.0" width="410" height="96" rx="8" fill="#ffffff" stroke="#e6b866" stroke-width="1.5"/>
<text x="845.0" y="163" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Read the deployment error</text>
<text x="845.0" y="184" font-size="14" text-anchor="middle" fill="#1f2933">Deployment operations first, then the Activity log.</text>
<text x="845.0" y="201" font-size="14" text-anchor="middle" fill="#1f2933">Match the error to the table in this article.</text>
<line x1="490.0" y1="180.0" x2="638" y2="180.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="516.0" y="172.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">No</text>
<line x1="330" y1="226.0" x2="330" y2="256.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="338" y="246.0" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Yes</text>
<polygon points="330,258.0 490.0,304.0 330,350.0 170.0,304.0" fill="#eef5fc" stroke="#9bbbe0" stroke-width="1.8"/>
<text x="330" y="301.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Is the host joined to</text>
<text x="330" y="319.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">the domain? (AD hosts)</text>
<rect x="640" y="256.0" width="410" height="96" rx="8" fill="#ffffff" stroke="#e6b866" stroke-width="1.5"/>
<text x="845.0" y="287" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Fix the domain join</text>
<text x="845.0" y="308" font-size="14" text-anchor="middle" fill="#1f2933">Check the credentials, MFA on the join account,</text>
<text x="845.0" y="325" font-size="14" text-anchor="middle" fill="#1f2933">permissions, and DNS or VNet peering.</text>
<line x1="490.0" y1="304.0" x2="638" y2="304.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="516.0" y="296.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">No</text>
<line x1="330" y1="350.0" x2="330" y2="380.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="338" y="370.0" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Yes</text>
<polygon points="330,382.0 490.0,428.0 330,474.0 170.0,428.0" fill="#eef5fc" stroke="#9bbbe0" stroke-width="1.8"/>
<text x="330" y="425.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Are the agent and boot</text>
<text x="330" y="443.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">loader installed?</text>
<rect x="640" y="380.0" width="410" height="96" rx="8" fill="#ffffff" stroke="#e6b866" stroke-width="1.5"/>
<text x="845.0" y="411" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Install the agent and boot loader</text>
<text x="845.0" y="432" font-size="14" text-anchor="middle" fill="#1f2933">No ScriptLog.log means the DSC never ran.</text>
<text x="845.0" y="449" font-size="14" text-anchor="middle" fill="#1f2933">Register with a valid registration key.</text>
<line x1="490.0" y1="428.0" x2="638" y2="428.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="516.0" y="420.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">No</text>
<line x1="330" y1="474.0" x2="330" y2="504.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="338" y="494.0" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Yes</text>
<polygon points="330,506.0 490.0,552.0 330,598.0 170.0,552.0" fill="#eef5fc" stroke="#9bbbe0" stroke-width="1.8"/>
<text x="330" y="549.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Is the registration</text>
<text x="330" y="567.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">token valid?</text>
<rect x="640" y="504.0" width="410" height="96" rx="8" fill="#ffffff" stroke="#e6b866" stroke-width="1.5"/>
<text x="845.0" y="535" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Replace the registration key</text>
<text x="845.0" y="556" font-size="14" text-anchor="middle" fill="#1f2933">Event 3277 INVALID_REGISTRATION_TOKEN or</text>
<text x="845.0" y="573" font-size="14" text-anchor="middle" fill="#1f2933">EXPIRED_MACHINE_TOKEN: new key, restart boot loader.</text>
<line x1="490.0" y1="552.0" x2="638" y2="552.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="516.0" y="544.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">No</text>
<line x1="330" y1="598.0" x2="330" y2="628.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="338" y="618.0" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Yes</text>
<polygon points="330,630.0 490.0,676.0 330,722.0 170.0,676.0" fill="#eef5fc" stroke="#9bbbe0" stroke-width="1.8"/>
<text x="330" y="673.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Is the VM name unique</text>
<text x="330" y="691.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">in the host pool?</text>
<rect x="640" y="628.0" width="410" height="96" rx="8" fill="#ffffff" stroke="#e6b866" stroke-width="1.5"/>
<text x="845.0" y="659" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Remove the duplicate entry</text>
<text x="845.0" y="680" font-size="14" text-anchor="middle" fill="#1f2933">NAME_ALREADY_REGISTERED: remove the old host from</text>
<text x="845.0" y="697" font-size="14" text-anchor="middle" fill="#1f2933">the pool, then register a VM with a unique name.</text>
<line x1="490.0" y1="676.0" x2="638" y2="676.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="516.0" y="668.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">No</text>
<line x1="330" y1="722.0" x2="330" y2="752.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="338" y="742.0" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Yes</text>
<polygon points="330,754.0 490.0,800.0 330,846.0 170.0,800.0" fill="#eef5fc" stroke="#9bbbe0" stroke-width="1.8"/>
<text x="330" y="797.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Can the host reach</text>
<text x="330" y="815.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">the broker on port 443?</text>
<rect x="640" y="752.0" width="410" height="96" rx="8" fill="#ffffff" stroke="#e6b866" stroke-width="1.5"/>
<text x="845.0" y="783" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Unblock the broker and required URLs</text>
<text x="845.0" y="804" font-size="14" text-anchor="middle" fill="#1f2933">INVALID_FORM, 3703 or 3019: test /api/health,</text>
<text x="845.0" y="821" font-size="14" text-anchor="middle" fill="#1f2933">run the URL tool, test port 443.</text>
<line x1="490.0" y1="800.0" x2="638" y2="800.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="516.0" y="792.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">No</text>
<line x1="330" y1="846.0" x2="330" y2="876.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="338" y="866.0" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Yes</text>
<polygon points="330,878.0 490.0,924.0 330,970.0 170.0,924.0" fill="#eef5fc" stroke="#9bbbe0" stroke-width="1.8"/>
<text x="330" y="921.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Is the stack listening</text>
<text x="330" y="939.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">(qwinsta shows Listen)?</text>
<rect x="640" y="876.0" width="410" height="96" rx="8" fill="#ffffff" stroke="#e6b866" stroke-width="1.5"/>
<text x="845.0" y="907" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Repair the side-by-side stack</text>
<text x="845.0" y="928" font-size="14" text-anchor="middle" fill="#1f2933">Reinstall the stack; check DisableRegistryTools.</text>
<line x1="490.0" y1="924.0" x2="638" y2="924.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="516.0" y="916.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">No</text>
<line x1="330" y1="970.0" x2="330" y2="1012.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="338" y="994.0" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Yes</text>
<rect x="100" y="1014.0" width="900" height="100" rx="8" fill="#ffffff" stroke="#3c9d5d" stroke-width="1.5"/>
<text x="550.0" y="1049" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Still not Available: uninstall, remove, re-register</text>
<text x="550.0" y="1073" font-size="14" text-anchor="middle" fill="#1f2933">Uninstall the four Remote Desktop components, remove the host from the pool, generate a new registration key,</text>
<text x="550.0" y="1091" font-size="14" text-anchor="middle" fill="#1f2933">then reinstall the agent and boot loader and restart the VM.</text>
<image x="142" y="42" width="40" height="40" href="data:image/svg+xml;base64,"/>
</svg>