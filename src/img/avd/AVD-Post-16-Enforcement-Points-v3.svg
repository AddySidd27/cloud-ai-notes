<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 810" width="1000" height="810" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">Where the network controls sit on the connectivity path</title>
  <desc id="d">Original drawing. At the top, the Microsoft-run Azure Virtual Desktop service reached on TCP 443 by name, with no IP address list to allow in place of names. On the left, a user device behind a firewall or proxy on the client network connects up to the service. On the right, a session host behind its subnet controls, which are network security group rules, a route table and a firewall or proxy, connects outbound to the service. At the bottom left, an optional Private Link panel lists the private endpoints and DNS zones. At the bottom right, a red panel says the Azure platform addresses 168.63.129.16 and 169.254.169.254 must not be proxied, intercepted or sent through VPN tunnels.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/></marker></defs>
  <rect x="6" y="6" width="988" height="798" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
  <text x="500" y="38" font-size="20" font-weight="600" text-anchor="middle" fill="#1f2933">Where the controls sit</text>
  <rect x="300" y="70" width="400" height="130" rx="8" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="1.8"/>
  <text x="500" y="108" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2933">Azure Virtual Desktop service (Microsoft-run)</text>
  <text x="500" y="134" font-size="14" text-anchor="middle" fill="#1f2933">Feed, gateway and broker, reached by name</text>
  <text x="500" y="158" font-size="14" text-anchor="middle" fill="#1f2933">on TCP 443. There is no IP list to use instead of names.</text>
  <text x="500" y="182" font-size="14" text-anchor="middle" fill="#1f2933">Use FQDNs, the FQDN tag or the service tag.</text>
  <rect x="30" y="310" width="190" height="130" rx="8" fill="#ffffff" stroke="#3c8d40" stroke-width="1.8"/>
  <image x="95" y="318" width="40" height="40" href="data:image/svg+xml;base64,"/>
  <text x="125" y="392" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">User device</text>
  <text x="125" y="414" font-size="14" text-anchor="middle" fill="#1f2933">(client app)</text>
  <rect x="30" y="230" width="190" height="60" rx="8" fill="#fff7e8" stroke="#c2570c" stroke-width="1.8"/>
  <text x="125" y="256" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Client network:</text>
  <text x="125" y="276" font-size="14" text-anchor="middle" fill="#1f2933">firewall or proxy</text>
  <line x1="125" y1="310" x2="125" y2="290" stroke="#5f6b7a" stroke-width="3"/>
  <line x1="220" y1="250" x2="300" y2="170" stroke="#c2570c" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="570" y="280" width="400" height="230" rx="8" fill="#ffffff" stroke="#3c8d40" stroke-width="1.8"/>
  <text x="770" y="306" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2933">Session host subnet</text>
  <image x="675" y="320" width="40" height="40" href="data:image/svg+xml;base64,"/>
  <text x="770" y="382" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Session host (your VM)</text>
  <rect x="590" y="402" width="360" height="88" rx="6" fill="#fff7e8" stroke="#c2570c" stroke-width="1.5"/>
  <text x="770" y="428" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Controls on the outbound path:</text>
  <text x="770" y="450" font-size="14" text-anchor="middle" fill="#1f2933">network security group rules,</text>
  <text x="770" y="472" font-size="14" text-anchor="middle" fill="#1f2933">route table, firewall or proxy</text>
  <line x1="770" y1="280" x2="650" y2="200" stroke="#3c8d40" stroke-width="3" marker-end="url(#arr)"/>
  <text x="790" y="250" font-size="14" text-anchor="start" fill="#1f2933">outbound only</text>
  <rect x="30" y="540" width="500" height="240" rx="8" fill="#f1ecf7" stroke="#6b4fa0" stroke-width="1.8"/>
  <image x="168" y="548" width="28" height="28" href="data:image/svg+xml;base64,"/>
  <text x="204" y="568" font-size="15" font-weight="600" text-anchor="start" fill="#6b4fa0">Optional: Private Link</text>
  <text x="50" y="600" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Private endpoints in your network:</text>
  <text x="50" y="624" font-size="14" text-anchor="start" fill="#1f2933">- global: one for the whole deployment</text>
  <text x="50" y="648" font-size="14" text-anchor="start" fill="#1f2933">- feed: one per workspace</text>
  <text x="50" y="672" font-size="14" text-anchor="start" fill="#1f2933">- connection: one per host pool</text>
  <text x="50" y="696" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Private DNS zones:</text>
  <text x="50" y="720" font-size="14" text-anchor="start" fill="#1f2933">privatelink-global.wvd.microsoft.com</text>
  <text x="50" y="744" font-size="14" text-anchor="start" fill="#1f2933">privatelink.wvd.microsoft.com</text>
  <rect x="560" y="540" width="410" height="240" rx="8" fill="#fdf0ec" stroke="#b42318" stroke-width="1.8"/>
  <text x="765" y="568" font-size="15" font-weight="600" text-anchor="middle" fill="#b42318">Azure platform addresses</text>
  <text x="765" y="606" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">169.254.169.254: instance metadata (IMDS)</text>
  <text x="765" y="632" font-size="14" text-anchor="middle" fill="#1f2933">168.63.129.16: platform health, DNS, DHCP</text>
  <text x="765" y="658" font-size="14" text-anchor="middle" fill="#1f2933">Must not be proxied, intercepted or</text>
  <text x="765" y="684" font-size="14" text-anchor="middle" fill="#1f2933">sent through VPN tunnels. Blocking them</text>
  <text x="765" y="710" font-size="14" text-anchor="middle" fill="#1f2933">causes provisioning and health problems.</text>
</svg>
