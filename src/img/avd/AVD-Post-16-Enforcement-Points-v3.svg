<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 810" width="1000" height="810" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">Where the network controls sit on the connectivity path</title>
  <desc id="d">Original drawing. At the top, the Microsoft-run Azure Virtual Desktop service (feed and gateway), reached on TCP 443 by name, with no IP address list to allow in place of names; use FQDNs, an FQDN tag or a service tag. On the left, the client network contains a firewall or proxy on the outbound path and the user device behind it; an orange arrow labelled outbound TCP 443, UDP 3478 for relay, goes from the firewall or proxy to the service. On the right, the session host subnet contains the controls on the outbound path (network security group rules, a route table and a firewall or proxy) and the session host behind them; a green arrow labelled outbound only goes to the service. At the bottom left, an optional Private Link panel lists the private endpoints and private DNS zones, with dashed lines to the client network and the session host subnet showing that private endpoints replace the public route. At the bottom right, a red panel says the Azure platform addresses 169.254.169.254 (Instance Metadata Service) and 168.63.129.16 must not be proxied, intercepted or sent through VPN tunnels or secure web gateways, with a dashed line to the session host subnet.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
  <rect x="6" y="6" width="988" height="798" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
  <text x="500" y="38" font-size="20" font-weight="600" text-anchor="middle" fill="#1f2933">Where the controls sit</text>
  <rect x="300" y="70" width="400" height="130" rx="8" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="1.8"/>
  <text x="500" y="108" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2933">Azure Virtual Desktop service (Microsoft-run)</text>
  <text x="500" y="134" font-size="14" text-anchor="middle" fill="#1f2933">Feed and gateway, reached by name</text>
  <text x="500" y="158" font-size="14" text-anchor="middle" fill="#1f2933">on TCP 443. There is no IP list to use instead of names.</text>
  <text x="500" y="182" font-size="14" text-anchor="middle" fill="#1f2933">Use FQDNs, an FQDN tag or a service tag.</text>
  <rect x="30" y="280" width="400" height="230" rx="8" fill="#ffffff" stroke="#3c8d40" stroke-width="1.8"/>
  <text x="50" y="306" font-size="15" font-weight="600" text-anchor="start" fill="#1f2933">Client network</text>
  <rect x="50" y="322" width="360" height="86" rx="6" fill="#fff7e8" stroke="#c2570c" stroke-width="1.5"/>
  <text x="230" y="356" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Controls on the outbound path:</text>
  <text x="230" y="380" font-size="14" text-anchor="middle" fill="#1f2933">firewall or proxy</text>
  <image x="210" y="418" width="40" height="40" href="data:image/svg+xml;base64,"/>
  <text x="230" y="482" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">User device (client app)</text>
  <rect x="570" y="280" width="400" height="230" rx="8" fill="#ffffff" stroke="#3c8d40" stroke-width="1.8"/>
  <text x="590" y="306" font-size="15" font-weight="600" text-anchor="start" fill="#1f2933">Session host subnet</text>
  <rect x="590" y="322" width="360" height="86" rx="6" fill="#fff7e8" stroke="#c2570c" stroke-width="1.5"/>
  <text x="770" y="346" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Controls on the outbound path:</text>
  <text x="770" y="368" font-size="14" text-anchor="middle" fill="#1f2933">network security group rules,</text>
  <text x="770" y="390" font-size="14" text-anchor="middle" fill="#1f2933">route table, firewall or proxy</text>
  <image x="750" y="418" width="40" height="40" href="data:image/svg+xml;base64,"/>
  <text x="770" y="482" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Session host (your VM)</text>
  <line x1="330" y1="322" x2="380" y2="200" stroke="#c2570c" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="342" y="246" font-size="14" text-anchor="end" fill="#1f2933">Outbound: TCP 443</text>
  <text x="342" y="266" font-size="14" text-anchor="end" fill="#1f2933">(UDP 3478 for relay)</text>
  <line x1="790" y1="322" x2="665" y2="200" stroke="#3c8d40" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="752" y="246" font-size="14" text-anchor="start" fill="#1f2933">outbound only</text>
  <rect x="30" y="570" width="500" height="220" rx="8" fill="#f1ecf7" stroke="#6b4fa0" stroke-width="1.8"/>
  <image x="168" y="578" width="28" height="28" href="data:image/svg+xml;base64,"/>
  <text x="204" y="598" font-size="15" font-weight="600" text-anchor="start" fill="#6b4fa0">Optional: Private Link</text>
  <text x="50" y="632" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Private endpoints in your network:</text>
  <text x="50" y="654" font-size="14" text-anchor="start" fill="#1f2933">- global: one for the whole deployment</text>
  <text x="50" y="676" font-size="14" text-anchor="start" fill="#1f2933">- feed: one per workspace</text>
  <text x="50" y="698" font-size="14" text-anchor="start" fill="#1f2933">- connection: one per host pool</text>
  <text x="50" y="722" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Private DNS zones:</text>
  <text x="50" y="744" font-size="14" text-anchor="start" fill="#1f2933">privatelink-global.wvd.microsoft.com</text>
  <text x="50" y="766" font-size="14" text-anchor="start" fill="#1f2933">privatelink.wvd.microsoft.com</text>
  <rect x="560" y="570" width="410" height="220" rx="8" fill="#fdf0ec" stroke="#b42318" stroke-width="1.8"/>
  <text x="765" y="598" font-size="15" font-weight="600" text-anchor="middle" fill="#b42318">Azure platform addresses</text>
  <text x="765" y="634" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">169.254.169.254: Instance Metadata Service (IMDS)</text>
  <text x="765" y="660" font-size="14" text-anchor="middle" fill="#1f2933">168.63.129.16: platform health, DNS, DHCP</text>
  <text x="765" y="686" font-size="14" text-anchor="middle" fill="#1f2933">Must not be proxied, intercepted or sent</text>
  <text x="765" y="710" font-size="14" text-anchor="middle" fill="#1f2933">through VPN tunnels or secure web gateways.</text>
  <text x="765" y="734" font-size="14" text-anchor="middle" fill="#1f2933">Blocking them causes provisioning</text>
  <text x="765" y="758" font-size="14" text-anchor="middle" fill="#1f2933">and health problems.</text>
  <line x1="230" y1="570" x2="230" y2="510" stroke="#6b4fa0" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="242" y="548" font-size="14" text-anchor="start" fill="#6b4fa0">private endpoints</text>
  <polyline points="500,570 500,540 650,540 650,510" fill="none" stroke="#6b4fa0" stroke-width="2.5" stroke-dasharray="7 5"/>
  <line x1="860" y1="570" x2="860" y2="510" stroke="#b42318" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="848" y="546" font-size="14" text-anchor="end" fill="#b42318">used by the session host</text>
</svg>
