<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 596" width="1000" height="596" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">Two routes to a golden image: build by hand, or use Azure Image Builder</title>
  <desc id="d">Draft drawing, own layout. Route 1: a clean build virtual machine, not registered to a host pool and not domain joined, is generalized with Sysprep and captured into an Azure Compute Gallery. Route 2: a source image and customizations go into the Azure Image Builder service, which builds the image, generalizes it for you and distributes it to the gallery. Both routes end as an image version in an image definition; the newest version is listed first. Each version is copied to replicas in target regions. Session hosts in a host pool are created from a version. A panel lists what must stay out of the image: a registered AVD agent and a domain join.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/></marker></defs>
  <rect x="6" y="6" width="988" height="584" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
  <text x="500" y="36" font-size="18" font-weight="600" text-anchor="middle" fill="#1f2933">Two routes lead to the same place: an image version in a gallery</text>
  <rect x="24" y="58" width="470" height="150" rx="8" fill="#f7f9fb" stroke="#5f6b7a" stroke-width="1.4"/>
  <text x="38" y="82" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Route 1: build by hand and capture</text>
  <rect x="38" y="96" width="200" height="100" rx="8" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="1.8"/>
  <g aria-hidden="true"><rect x="46.0" y="102.0" width="28.0" height="28.0" rx="4.2" fill="#EAF2FB" stroke="#3B6EA5" stroke-width="2"/><rect x="51.6" y="107.6" width="16.8" height="10.1" rx="2" fill="none" stroke="#3B6EA5" stroke-width="2"/><line x1="53.6" y1="122.4" x2="66.4" y2="122.4" stroke="#3B6EA5" stroke-width="2" stroke-linecap="round"/></g>
  <text x="80" y="122" font-size="13" font-weight="600" text-anchor="start" fill="#1f2933">Build virtual machine</text>
  <text x="50" y="148" font-size="13" text-anchor="start" fill="#1f2933">Apps and updates added</text>
  <text x="50" y="168" font-size="13" text-anchor="start" fill="#1f2933">Snapshots taken</text>
  <text x="50" y="188" font-size="13" text-anchor="start" fill="#1f2933">Not in a host pool</text>
  <rect x="282" y="96" width="198" height="100" rx="8" fill="#fff7e8" stroke="#c2570c" stroke-width="1.8"/>
  <text x="381" y="122" font-size="14" font-weight="600" text-anchor="middle" fill="#c2570c">Sysprep</text>
  <text x="381" y="148" font-size="13" text-anchor="middle" fill="#1f2933">Generalize and shut down.</text>
  <text x="381" y="168" font-size="13" text-anchor="middle" fill="#1f2933">Do not restart: it</text>
  <text x="381" y="188" font-size="13" text-anchor="middle" fill="#1f2933">cannot be undone.</text>
  <line x1="238" y1="146" x2="282" y2="146" stroke="#5f6b7a" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="24" y="222" width="470" height="216" rx="8" fill="#f7f9fb" stroke="#5f6b7a" stroke-width="1.4"/>
  <text x="38" y="246" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Route 2: describe the image, the service builds it</text>
  <rect x="38" y="262" width="196" height="72" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
  <text x="136.0" y="284.55" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2933">Source image</text>
  <text x="136.0" y="302.55" font-size="13" text-anchor="middle" fill="#1f2933">Marketplace or an</text>
  <text x="136.0" y="320.55" font-size="13" text-anchor="middle" fill="#1f2933">existing custom image</text>
  <rect x="38" y="348" width="196" height="78" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
  <text x="136.0" y="373.55" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2933">Customizations</text>
  <text x="136.0" y="391.55" font-size="13" text-anchor="middle" fill="#1f2933">Scripts, built-in</text>
  <text x="136.0" y="409.55" font-size="13" text-anchor="middle" fill="#1f2933">settings, updates</text>
  <rect x="282" y="262" width="198" height="164" rx="8" fill="#e6f4f2" stroke="#0f766e" stroke-width="1.8"/>
  <text x="381.0" y="294.55" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2933">Azure Image Builder</text>
  <text x="381.0" y="312.55" font-size="13" text-anchor="middle" fill="#1f2933">service</text>
  <text x="381.0" y="330.55" font-size="13" text-anchor="middle" fill="#1f2933"></text>
  <text x="381.0" y="348.55" font-size="13" text-anchor="middle" fill="#1f2933">Builds on a temporary</text>
  <text x="381.0" y="366.55" font-size="13" text-anchor="middle" fill="#1f2933">VM in your subscription.</text>
  <text x="381.0" y="384.55" font-size="13" text-anchor="middle" fill="#1f2933">Generalizes the image</text>
  <text x="381.0" y="402.55" font-size="13" text-anchor="middle" fill="#1f2933">for you.</text>
  <line x1="234" y1="298" x2="282" y2="322" stroke="#5f6b7a" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="234" y1="387" x2="282" y2="366" stroke="#5f6b7a" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="580" y="58" width="220" height="380" rx="8" fill="#eef6ee" stroke="#3c8d40" stroke-width="1.8"/>
  <g aria-hidden="true"><rect x="590.0" y="66.0" width="34.0" height="34.0" rx="5.1" fill="#EAF2FB" stroke="#3B6EA5" stroke-width="2"/><rect x="596.8" y="72.8" width="20.4" height="12.2" rx="2" fill="none" stroke="#3B6EA5" stroke-width="2"/><line x1="598.8" y1="91.2" x2="615.2" y2="91.2" stroke="#3B6EA5" stroke-width="2" stroke-linecap="round"/></g>
  <text x="630" y="88" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Azure Compute Gallery</text>
  <g aria-hidden="true"><rect x="594.0" y="114.0" width="30.0" height="30.0" rx="4.5" fill="#EAF2FB" stroke="#3B6EA5" stroke-width="2"/><rect x="600.0" y="120.0" width="18.0" height="10.8" rx="2" fill="none" stroke="#3B6EA5" stroke-width="2"/><line x1="602.0" y1="136.0" x2="616.0" y2="136.0" stroke="#3B6EA5" stroke-width="2" stroke-linecap="round"/></g>
  <text x="632" y="134" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Image definition</text>
  <g aria-hidden="true"><rect x="624.0" y="156.0" width="28.0" height="28.0" rx="4.2" fill="#EAF2FB" stroke="#3B6EA5" stroke-width="2"/><rect x="629.6" y="161.6" width="16.8" height="10.1" rx="2" fill="none" stroke="#3B6EA5" stroke-width="2"/><line x1="631.6" y1="176.4" x2="644.4" y2="176.4" stroke="#3B6EA5" stroke-width="2" stroke-linecap="round"/></g>
  <text x="660" y="175" font-size="13" text-anchor="start" fill="#1f2933">Version 1.1.0</text>
  <g aria-hidden="true"><rect x="624.0" y="192.0" width="28.0" height="28.0" rx="4.2" fill="#EAF2FB" stroke="#3B6EA5" stroke-width="2"/><rect x="629.6" y="197.6" width="16.8" height="10.1" rx="2" fill="none" stroke="#3B6EA5" stroke-width="2"/><line x1="631.6" y1="212.4" x2="644.4" y2="212.4" stroke="#3B6EA5" stroke-width="2" stroke-linecap="round"/></g>
  <text x="660" y="211" font-size="13" text-anchor="start" fill="#1f2933">Version 1.0.0</text>
  <text x="594" y="248" font-size="13" text-anchor="start" fill="#1f2933">Newest version listed first.</text>
  <text x="594" y="274" font-size="13" text-anchor="start" fill="#1f2933">latest = highest version</text>
  <text x="594" y="294" font-size="13" text-anchor="start" fill="#1f2933">not excluded from latest</text>
  <text x="594" y="330" font-size="13" font-weight="600" text-anchor="start" fill="#3c8d40">Both routes end as an</text>
  <text x="594" y="350" font-size="13" font-weight="600" text-anchor="start" fill="#3c8d40">image version here.</text>
  <line x1="480" y1="146" x2="580" y2="146" stroke="#5f6b7a" stroke-width="3" marker-end="url(#arr)"/>
  <text x="530" y="134" font-size="13" font-weight="600" text-anchor="middle" fill="#5f6b7a">capture</text>
  <line x1="480" y1="344" x2="580" y2="344" stroke="#5f6b7a" stroke-width="3" marker-end="url(#arr)"/>
  <text x="530" y="332" font-size="13" font-weight="600" text-anchor="middle" fill="#5f6b7a">distribute</text>
  <rect x="840" y="58" width="136" height="380" rx="8" fill="#f3effa" stroke="#6b4fa0" stroke-width="1.8"/>
  <text x="908" y="84" font-size="14" font-weight="600" text-anchor="middle" fill="#6b4fa0">Target regions</text>
  <rect x="852" y="104" width="112" height="62" rx="6" fill="#ffffff" stroke="#6b4fa0" stroke-width="1.2"/>
  <text x="908.0" y="130.55" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2933">Region 1</text>
  <text x="908.0" y="148.55" font-size="13" text-anchor="middle" fill="#1f2933">replicas</text>
  <line x1="800" y1="135" x2="852" y2="135" stroke="#5f6b7a" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="852" y="184" width="112" height="62" rx="6" fill="#ffffff" stroke="#6b4fa0" stroke-width="1.2"/>
  <text x="908.0" y="210.55" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2933">Region 2</text>
  <text x="908.0" y="228.55" font-size="13" text-anchor="middle" fill="#1f2933">replicas</text>
  <line x1="800" y1="215" x2="852" y2="215" stroke="#5f6b7a" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="852" y="264" width="112" height="62" rx="6" fill="#ffffff" stroke="#6b4fa0" stroke-width="1.2"/>
  <text x="908.0" y="290.55" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2933">Region 3</text>
  <text x="908.0" y="308.55" font-size="13" text-anchor="middle" fill="#1f2933">replicas</text>
  <line x1="800" y1="295" x2="852" y2="295" stroke="#5f6b7a" stroke-width="3" marker-end="url(#arr)"/>
  <text x="908" y="360" font-size="13" text-anchor="middle" fill="#1f2933">Copying can take</text>
  <text x="908" y="380" font-size="13" text-anchor="middle" fill="#1f2933">a few hours.</text>
  <text x="908" y="408" font-size="13" text-anchor="middle" fill="#1f2933">Status per region.</text>
  <line x1="908" y1="438" x2="908" y2="476" stroke="#5f6b7a" stroke-width="3" marker-end="url(#arr)"/>
  <text x="898" y="462" font-size="13" font-weight="600" text-anchor="end" fill="#5f6b7a">create from a version</text>
  <rect x="24" y="476" width="590" height="100" rx="8" fill="#fdecec" stroke="#b42318" stroke-width="1.8"/>
  <text x="40" y="504" font-size="14" font-weight="600" text-anchor="start" fill="#b42318">Must stay out of the image</text>
  <rect x="42" y="520" width="14" height="14" rx="3" fill="#b42318" stroke="#b42318" stroke-width="1"/>
  <text x="66" y="532" font-size="13" text-anchor="start" fill="#1f2933">The AVD agent registered to a host pool (its registration token expires)</text>
  <rect x="42" y="544" width="14" height="14" rx="3" fill="#b42318" stroke="#b42318" stroke-width="1"/>
  <text x="66" y="556" font-size="13" text-anchor="start" fill="#1f2933">A domain join (remove the machine from the domain before Sysprep)</text>
  <rect x="640" y="476" width="336" height="100" rx="8" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="1.8"/>
  <g aria-hidden="true"><rect x="650.0" y="482.0" width="34.0" height="34.0" rx="5.1" fill="#EAF2FB" stroke="#3B6EA5" stroke-width="2"/><rect x="656.8" y="488.8" width="20.4" height="12.2" rx="2" fill="none" stroke="#3B6EA5" stroke-width="2"/><line x1="658.8" y1="507.2" x2="675.2" y2="507.2" stroke="#3B6EA5" stroke-width="2" stroke-linecap="round"/></g>
  <text x="692" y="504" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Host pool</text>
  <text x="654" y="536" font-size="13" text-anchor="start" fill="#1f2933">Session hosts, all created from</text>
  <text x="654" y="556" font-size="13" text-anchor="start" fill="#1f2933">the same image version.</text>
</svg>
