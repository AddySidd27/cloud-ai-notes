<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="1000" height="860" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">The connection sequence, step by step</title>
  <desc id="d">Diagram using the numbered steps of the client connection sequence. Steps 1 and 2: the client signs in to Microsoft Entra ID and gets a token. Steps 3 to 6: the client passes the token to the feed service and receives a signed connection configuration. Step 7: the client opens a TLS connection to a gateway through Azure Front Door. Step 8: the gateway asks the broker to orchestrate. Step 9: the broker uses the persistent channel to tell the session host. Steps 10 and 11: the session host opens an outbound connection to the same gateway, which relays traffic. Step 12: the RDP handshake between client and session host starts. A dashed line shows the optional RDP Shortpath UDP path directly between client and session host. A panel lists where a connection stops for each step or group of steps.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
  <rect x="6" y="6" width="988" height="848" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
  <text x="500" y="36" font-size="19" font-weight="600" text-anchor="middle" fill="#1f2933">A connection, step by step</text>
  <rect x="30" y="230" width="180" height="120" rx="8" fill="#ffffff" stroke="#3c8d40" stroke-width="1.6"/>
  <text x="120" y="284.2" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">User device</text>
  <text x="120" y="304.2" font-size="14" text-anchor="middle" fill="#1f2933">(Windows App)</text>
  <rect x="330" y="64" width="190" height="90" rx="8" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="1.6"/>
  <image x="400" y="70" width="40" height="40" href="data:image/svg+xml;base64,"/>
  <text x="425" y="138" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Microsoft Entra ID</text>
  <rect x="650" y="64" width="200" height="90" rx="8" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="1.6"/>
  <text x="750" y="94" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Feed subscription</text>
  <text x="750" y="114" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">service</text>
  <text x="750" y="138" font-size="14" text-anchor="middle" fill="#1f2933">(Microsoft-managed)</text>
  <rect x="330" y="230" width="190" height="120" rx="8" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="1.6"/>
  <text x="425" y="266" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Gateway service</text>
  <text x="425" y="288" font-size="14" text-anchor="middle" fill="#1f2933">(entered through</text>
  <text x="425" y="306" font-size="14" text-anchor="middle" fill="#1f2933">Azure Front Door;</text>
  <text x="425" y="324" font-size="14" text-anchor="middle" fill="#1f2933">public cloud)</text>
  <rect x="650" y="230" width="200" height="120" rx="8" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="1.6"/>
  <text x="750" y="295" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Broker service</text>
  <rect x="650" y="430" width="200" height="110" rx="8" fill="#ffffff" stroke="#3c8d40" stroke-width="1.6"/>
  <image x="730" y="436" width="40" height="40" href="data:image/svg+xml;base64,"/>
  <text x="750" y="500" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Session host</text>
  <text x="750" y="520" font-size="14" text-anchor="middle" fill="#1f2933">(your VM)</text>
  <polyline points="90,230 90,109 330,109" fill="none" stroke="#c2570c" stroke-width="2.5" stroke-linejoin="round" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <rect x="71.45" y="161" width="37.1" height="28" rx="14" fill="#c2570c" stroke="#c2570c" stroke-width="1"/>
  <text x="90" y="180" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">1-2</text>
  <polyline points="150,230 150,192 750,192 750,154" fill="none" stroke="#c2570c" stroke-width="2.5" stroke-linejoin="round" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <rect x="431.45" y="178" width="37.1" height="28" rx="14" fill="#c2570c" stroke="#c2570c" stroke-width="1"/>
  <text x="450" y="197" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">3-6</text>
  <polyline points="210,290 330,290" fill="none" stroke="#c2570c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
  <rect x="255" y="248" width="30" height="28" rx="14" fill="#c2570c" stroke="#c2570c" stroke-width="1"/>
  <text x="270" y="267" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">7</text>
  <polyline points="520,290 650,290" fill="none" stroke="#3b6fb6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
  <rect x="570" y="248" width="30" height="28" rx="14" fill="#3b6fb6" stroke="#3b6fb6" stroke-width="1"/>
  <text x="585" y="267" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">8</text>
  <polyline points="750,350 750,430" fill="none" stroke="#3b6fb6" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <rect x="735" y="376" width="30" height="28" rx="14" fill="#3b6fb6" stroke="#3b6fb6" stroke-width="1"/>
  <text x="750" y="395" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">9</text>
  <text x="772" y="386" font-size="14" text-anchor="start" fill="#1f2933">persistent channel</text>
  <text x="772" y="404" font-size="14" text-anchor="start" fill="#1f2933">(opened by the agent)</text>
  <polyline points="650,470 425,470 425,350" fill="none" stroke="#3c8d40" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
  <rect x="398.75" y="401" width="52.5" height="28" rx="14" fill="#3c8d40" stroke="#3c8d40" stroke-width="1"/>
  <text x="425" y="420" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">10-11</text>
  <rect x="247" y="396" width="30" height="28" rx="14" fill="#3c8d40" stroke="#3c8d40" stroke-width="1"/>
  <text x="262" y="415" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">12</text>
  <text x="284" y="406" font-size="14" text-anchor="start" fill="#1f2933">RDP handshake,</text>
  <text x="284" y="424" font-size="14" text-anchor="start" fill="#1f2933">client and host</text>
  <polyline points="120,350 120,500 650,500" fill="none" stroke="#3c8d40" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="10 6" marker-end="url(#arr)"/>
  <text x="140" y="528" font-size="14" text-anchor="start" fill="#1f2933">Optional: RDP Shortpath, direct UDP between</text>
  <text x="140" y="548" font-size="14" text-anchor="start" fill="#1f2933">client and session host (dashed)</text>
  <rect x="24" y="590" width="952" height="224" rx="6" fill="#ffffff" stroke="#5f6b7a" stroke-width="1.2"/>
  <text x="40" y="620" font-size="15" font-weight="600" text-anchor="start" fill="#1f2933">Where a connection stops</text>
  <text x="40" y="650" font-size="14" font-weight="600" text-anchor="start" fill="#c2570c">1-2</text>
  <text x="120" y="650" font-size="14" text-anchor="start" fill="#1f2933">Sign-in is blocked or interrupted: wrong account, Conditional Access, or a blocked sign-in endpoint.</text>
  <text x="40" y="674" font-size="14" font-weight="600" text-anchor="start" fill="#c2570c">3-6</text>
  <text x="120" y="674" font-size="14" text-anchor="start" fill="#1f2933">An empty or partial feed: often an assignment, workspace or application group type problem.</text>
  <text x="40" y="698" font-size="14" font-weight="600" text-anchor="start" fill="#c2570c">7</text>
  <text x="120" y="698" font-size="14" text-anchor="start" fill="#1f2933">A proxy, firewall or inspection device on the client side breaks or rewrites the TLS connection.</text>
  <text x="40" y="722" font-size="14" font-weight="600" text-anchor="start" fill="#c2570c">8</text>
  <text x="120" y="722" font-size="14" text-anchor="start" fill="#1f2933">No available session host, or a host in the wrong status.</text>
  <text x="40" y="746" font-size="14" font-weight="600" text-anchor="start" fill="#c2570c">9</text>
  <text x="120" y="746" font-size="14" text-anchor="start" fill="#1f2933">The host is running but its agent has no channel. The portal status usually shows this.</text>
  <text x="40" y="770" font-size="14" font-weight="600" text-anchor="start" fill="#c2570c">10-11</text>
  <text x="120" y="770" font-size="14" text-anchor="start" fill="#1f2933">The host's outbound path is blocked. The user waits, then gets a generic error.</text>
  <text x="40" y="794" font-size="14" font-weight="600" text-anchor="start" fill="#c2570c">12</text>
  <text x="120" y="794" font-size="14" text-anchor="start" fill="#1f2933">Connection opens but sign-in to Windows is slow or fails: a Windows or profile problem.</text>
</svg>
