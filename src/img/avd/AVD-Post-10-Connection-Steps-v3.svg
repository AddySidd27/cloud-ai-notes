<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="1000" height="860" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">The connection sequence, step by step</title>
  <desc id="d">Original diagram using the numbered steps of the client connection sequence. Steps 1 and 2: the client signs in to Microsoft Entra ID and gets a token. Steps 3 to 6: the client passes the token to the feed service and receives a signed connection configuration. Step 7: the client opens a TLS connection to a gateway through Azure Front Door. Step 8: the gateway asks the broker to orchestrate. Step 9: the broker uses the persistent channel to tell the session host. Steps 10 and 11: the session host opens an outbound connection to the same gateway, which relays traffic. Step 12: the RDP handshake starts. A dashed line shows the optional RDP Shortpath UDP path directly between client and session host. A panel lists where a connection stops for each group of steps.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/></marker></defs>
  <rect x="6" y="6" width="988" height="848" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
  <text x="500" y="36" font-size="19" font-weight="600" text-anchor="middle" fill="#1f2933">A connection, step by step (numbers match the documented sequence)</text>
  <rect x="30" y="270" width="180" height="130" rx="8" fill="#ffffff" stroke="#3c8d40" stroke-width="1.6"/>
  <image x="100" y="278" width="40" height="40" href="data:image/svg+xml;base64,"/>
  <text x="120" y="342" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">User device</text>
  <text x="120" y="362" font-size="14" text-anchor="middle" fill="#1f2933">(Windows App)</text>
  <rect x="330" y="70" width="190" height="100" rx="8" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="1.6"/>
  <image x="400" y="76" width="40" height="40" href="data:image/svg+xml;base64,"/>
  <text x="425" y="140" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Microsoft Entra ID</text>
  <rect x="650" y="70" width="200" height="100" rx="8" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="1.6"/>
  <text x="750" y="100" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Feed subscription</text>
  <text x="750" y="120" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">service</text>
  <text x="750" y="145" font-size="13" text-anchor="middle" fill="#1f2933">(Microsoft-managed)</text>
  <rect x="330" y="270" width="190" height="130" rx="8" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="1.6"/>
  <text x="425" y="318" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Gateway service</text>
  <text x="425" y="340" font-size="14" text-anchor="middle" fill="#1f2933">(entered through</text>
  <text x="425" y="358" font-size="14" text-anchor="middle" fill="#1f2933">Azure Front Door;</text>
  <text x="425" y="376" font-size="14" text-anchor="middle" fill="#1f2933">public cloud)</text>
  <rect x="650" y="270" width="200" height="130" rx="8" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="1.6"/>
  <text x="750" y="340" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Broker service</text>
  <rect x="650" y="520" width="200" height="120" rx="8" fill="#ffffff" stroke="#3c8d40" stroke-width="1.6"/>
  <image x="730" y="526" width="40" height="40" href="data:image/svg+xml;base64,"/>
  <text x="750" y="590" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Session host</text>
  <text x="750" y="610" font-size="14" text-anchor="middle" fill="#1f2933">(your VM)</text>
  <line x1="210" y1="285" x2="330" y2="125" stroke="#c2570c" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="243.59765625" y="201" width="36.8046875" height="28" rx="14" fill="#c2570c" stroke="#c2570c" stroke-width="1"/>
  <text x="262" y="220" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">1-2</text>
  <line x1="210" y1="300" x2="650" y2="125" stroke="#c2570c" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="579.810546875" y="131" width="40.37890625" height="28" rx="14" fill="#c2570c" stroke="#c2570c" stroke-width="1"/>
  <text x="600" y="150" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">3-6</text>
  <line x1="210" y1="335" x2="330" y2="335" stroke="#c2570c" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="255.0" y="304" width="30" height="28" rx="14" fill="#c2570c" stroke="#c2570c" stroke-width="1"/>
  <text x="270" y="323" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">7</text>
  <line x1="520" y1="335" x2="650" y2="335" stroke="#3b6fb6" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="570.0" y="304" width="30" height="28" rx="14" fill="#3b6fb6" stroke="#3b6fb6" stroke-width="1"/>
  <text x="585" y="323" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">8</text>
  <line x1="750" y1="400" x2="750" y2="520" stroke="#3b6fb6" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arr)"/>
  <line x1="750" y1="520" x2="750" y2="400" stroke="#3b6fb6" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arr)"/>
  <rect x="735.0" y="446" width="30" height="28" rx="14" fill="#3b6fb6" stroke="#3b6fb6" stroke-width="1"/>
  <text x="750" y="465" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">9</text>
  <text x="766" y="495" font-size="14" text-anchor="start" fill="#1f2933">persistent channel</text>
  <text x="766" y="513" font-size="14" text-anchor="start" fill="#1f2933">(opened by the agent)</text>
  <line x1="650" y1="560" x2="480" y2="400" stroke="#3c8d40" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="540.2421875" y="466" width="49.515625" height="28" rx="14" fill="#3c8d40" stroke="#3c8d40" stroke-width="1"/>
  <text x="565" y="485" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">10-11</text>
  <rect x="264.677734375" y="431" width="30.64453125" height="28" rx="14" fill="#3c8d40" stroke="#3c8d40" stroke-width="1"/>
  <text x="280" y="450" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">12</text>
  <text x="306" y="450" font-size="14" text-anchor="start" fill="#1f2933">RDP handshake starts</text>
  <line x1="120" y1="400" x2="120" y2="580" stroke="#3c8d40" stroke-width="3" stroke-dasharray="10 6"/>
  <line x1="120" y1="580" x2="650" y2="580" stroke="#3c8d40" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arr)"/>
  <text x="140" y="610" font-size="14" text-anchor="start" fill="#1f2933">Optional: RDP Shortpath, direct UDP between</text>
  <text x="140" y="630" font-size="14" text-anchor="start" fill="#1f2933">client and session host (dashed)</text>
  <rect x="24" y="670" width="952" height="170" rx="6" fill="#ffffff" stroke="#5f6b7a" stroke-width="1.2"/>
  <text x="40" y="697" font-size="15" font-weight="600" text-anchor="start" fill="#1f2933">Where a connection stops (the author&#x27;s troubleshooting reading, not from Learn)</text>
  <text x="40" y="724" font-size="14" font-weight="600" text-anchor="start" fill="#c2570c">1-2</text>
  <text x="120" y="724" font-size="14" text-anchor="start" fill="#1f2933">Cannot sign in: wrong account, Conditional Access or a blocked sign-in endpoint.</text>
  <text x="40" y="746" font-size="14" font-weight="600" text-anchor="start" fill="#c2570c">3-6</text>
  <text x="120" y="746" font-size="14" text-anchor="start" fill="#1f2933">Signed in but the feed is empty or wrong: assignment, workspace or group type.</text>
  <text x="40" y="768" font-size="14" font-weight="600" text-anchor="start" fill="#c2570c">7-9</text>
  <text x="120" y="768" font-size="14" text-anchor="start" fill="#1f2933">Desktop listed but no host starts: no available host, gateway or broker path.</text>
  <text x="40" y="790" font-size="14" font-weight="600" text-anchor="start" fill="#c2570c">10-11</text>
  <text x="120" y="790" font-size="14" text-anchor="start" fill="#1f2933">Long wait, then a generic error: host outbound access, proxy or TLS inspection.</text>
  <text x="40" y="812" font-size="14" font-weight="600" text-anchor="start" fill="#c2570c">After 12</text>
  <text x="120" y="812" font-size="14" text-anchor="start" fill="#1f2933">Opens, then drops, is slow or choppy: Windows sign-in, profile, network or TCP fallback.</text>
</svg>
