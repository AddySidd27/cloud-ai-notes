<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 612" width="1000" height="612" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">How FSLogix Cloud Cache moves data between the session host and storage providers</title>
<desc id="d">Six numbered steps. 1: the user signs in to the session host. 2: a proxy file, which Windows sees as the profile disk, points to the local cache on the host. 3: the user works on the local cache. 4: when data is missing from the local cache, Cloud Cache reads it from the first healthy storage provider (hydrate). 5: every change is written from the local cache to all storage providers in the background (flush). 6: at sign-out, if a provider is behind, sign-out waits until the providers match, for as long as a timeout setting allows. If all providers are down, the user keeps working from the local cache, which grows up to the SizeInMBs limit, but data that is not in the cache cannot be read and the session can hang. Up to four providers can be listed in CCDLocations.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="6" y="6" width="988" height="600" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
<text x="500.0" y="30" font-size="22" font-weight="600" text-anchor="middle" fill="#1f2933">Cloud Cache: how data moves</text>
<text x="62.0" y="187" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2933">User</text>
<line x1="100" y1="182" x2="176" y2="182" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="100" y="166" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">1. Signs in</text>
<rect x="180" y="70" width="350" height="380" rx="8" fill="#f7f8fa" stroke="#d5dae1" stroke-width="1.5"/>
<image x="194" y="80" width="44" height="44" href="data:image/svg+xml;base64,"/>
<text x="246" y="106" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Session host</text>
<rect x="196" y="135" width="318" height="100" rx="8" fill="#eaf2fb" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="355.0" y="159" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2933">Proxy file</text>
<text x="355.0" y="183" font-size="14" text-anchor="middle" fill="#1f2933">Profile_%username%.vhd</text>
<text x="355.0" y="203" font-size="14" text-anchor="middle" fill="#1f2933">Windows sees it as the profile disk.</text>
<text x="355.0" y="223" font-size="14" text-anchor="middle" fill="#1f2933">It uses no disk space itself.</text>
<rect x="196" y="300" width="318" height="115" rx="8" fill="#e7f6ec" stroke="#8bcb9f" stroke-width="1.5"/>
<text x="355.0" y="324" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2933">Local cache</text>
<text x="355.0" y="348" font-size="14" text-anchor="middle" fill="#1f2933">The real working copy, in</text>
<text x="355.0" y="368" font-size="14" text-anchor="middle" fill="#1f2933">C:\ProgramData\FSLogix\Cache</text>
<text x="355.0" y="388" font-size="14" text-anchor="middle" fill="#1f2933">3. The user works here.</text>
<line x1="355" y1="237" x2="355" y2="298" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="366" y="262" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">2. Reads and writes</text>
<text x="366" y="280" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">go to the cache</text>
<rect x="690" y="70" width="290" height="380" rx="8" fill="#f7f8fa" stroke="#d5dae1" stroke-width="1.5"/>
<text x="704" y="94" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Storage providers</text>
<text x="704" y="116" font-size="14" text-anchor="start" fill="#5f6b7a">CCDLocations: up to 4, first = primary</text>
<path d="M710,138 a125.0,10 0 0 1 250,0 v88 a125.0,10 0 0 1 -250,0 z" fill="#f3eeff" stroke="#b9a6f0" stroke-width="1.5"/>
<path d="M710,138 a125.0,10 0 0 0 250,0" fill="none" stroke="#b9a6f0" stroke-width="1.5"/>
<text x="835.0" y="166" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Provider 1 (first)</text>
<text x="835.0" y="188" font-size="14" text-anchor="middle" fill="#1f2933">SMB file share or Azure page blob.</text>
<text x="835.0" y="207" font-size="14" text-anchor="middle" fill="#1f2933">Used for reads. Gets every write.</text>
<path d="M710,262 a125.0,10 0 0 1 250,0 v88 a125.0,10 0 0 1 -250,0 z" fill="#f3eeff" stroke="#b9a6f0" stroke-width="1.5"/>
<path d="M710,262 a125.0,10 0 0 0 250,0" fill="none" stroke="#b9a6f0" stroke-width="1.5"/>
<text x="835.0" y="290" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Provider 2</text>
<text x="835.0" y="312" font-size="14" text-anchor="middle" fill="#1f2933">SMB file share or Azure page blob.</text>
<text x="835.0" y="331" font-size="14" text-anchor="middle" fill="#1f2933">Gets every write.</text>
<rect x="710" y="378" width="250" height="52" rx="8" fill="#faf8ff" stroke="#b9a6f0" stroke-width="1.5" stroke-dasharray="6 4"/><text x="835" y="399" font-size="14" text-anchor="middle" fill="#5f6b7a">Provider 3 and 4 (optional)</text><text x="835" y="418" font-size="14" text-anchor="middle" fill="#5f6b7a">Each also gets every write</text>
<polyline points="708,170 610,170 610,335 516,335" fill="none" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="536" y="120" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">4. Read missing data</text>
<text x="536" y="138" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">(hydrate) from the</text>
<text x="536" y="156" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">first healthy provider</text>
<polyline points="516,365 640,365 640,200 708,200" fill="none" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<polyline points="516,395 660,395 660,306 708,306" fill="none" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="536" y="416" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">5. Write every change</text>
<text x="536" y="434" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">(flush) to all providers</text>
<text x="536" y="452" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">in the background</text>
<text x="682" y="192" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2933">5</text>
<text x="686" y="298" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2933">5</text>
<rect x="30" y="470" width="450" height="96" rx="8" fill="#f7f8fa" stroke="#d5dae1" stroke-width="1.5"/>
<text x="44" y="492" font-size="15" font-weight="600" text-anchor="start" fill="#1f2933">6. At sign-out, if a provider is behind</text>
<text x="44" y="516" font-size="14" text-anchor="start" fill="#1f2933">Sign-out waits until the providers match.</text>
<text x="44" y="537" font-size="14" text-anchor="start" fill="#1f2933">Limit: CcdUnregisterTimeout (default 0 = no limit).</text>
<rect x="500" y="470" width="470" height="96" rx="8" fill="#f7f8fa" stroke="#d5dae1" stroke-width="1.5"/>
<text x="514" y="492" font-size="15" font-weight="600" text-anchor="start" fill="#1f2933">If all providers are down</text>
<text x="514" y="516" font-size="14" text-anchor="start" fill="#1f2933">Work continues from the cache, up to SizeInMBs.</text>
<text x="514" y="537" font-size="14" text-anchor="start" fill="#1f2933">Data not in the cache cannot be read: hang or crash.</text>
<text x="500.0" y="590" font-size="14" text-anchor="middle" fill="#5f6b7a">Proxy file = a stand-in that Windows mounts as the profile disk. The real data is in the local cache.</text>
</svg>