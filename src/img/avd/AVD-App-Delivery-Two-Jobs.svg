<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1444" width="360" height="1444" role="img" aria-labelledby="t d" font-family="'Segoe UI', Arial, Helvetica, sans-serif" fill="#1f2933">
<title id="t">Two jobs: get the application onto session hosts, and decide what users see</title>
<desc id="d">Drawing by the article author, not an official Microsoft diagram. It reads from top to bottom. Job 1: three routes put an application on session hosts: In the image, Installed with Intune, and With App Attach. The App Attach application package is held on an SMB file share (Azure Files is recommended); the session hosts read from that share. Each route leads to a host pool that holds session hosts. Job 2: a workspace holds an application group, either a desktop application group or a RemoteApp application group. The application group is assigned to one host pool, and users are assigned to the application group. Users see their desktop or RemoteApp applications in Windows App. Note: for an App Attach application in a desktop session, assign the package to the host pool and to users, with no step in the desktop application group; as a RemoteApp, also add the application to a RemoteApp application group. Solid arrow: the tail delivers to, or is assigned to, the head. Dashed arrow: the tail reads from the head. A box inside a box: the outer box holds the inner one.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6c7a8b"/></marker></defs>
<rect x="8" y="8" width="344" height="50" rx="7" fill="#ffffff" stroke="#5f6b7a" stroke-width="1.5"/>
<text x="20" y="30.0" font-size="14" font-weight="700" text-anchor="start">Two jobs: get the application onto session</text><text x="20" y="47.0" font-size="14" font-weight="700" text-anchor="start">hosts, and decide what users see</text>
<text x="20" y="86.0" font-size="14" font-weight="700" text-anchor="start">Job 1: get the application onto the session</text><text x="20" y="103.0" font-size="14" font-weight="700" text-anchor="start">hosts</text>
<rect x="20" y="116" width="320" height="90" rx="7" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="2"/>
<text x="30" y="136.0" font-size="14" font-weight="700" text-anchor="start">In the image</text>
<text x="30" y="155.0" font-size="13" text-anchor="start">The application is installed in the image,</text><text x="30" y="172.0" font-size="13" text-anchor="start">so every session host built from that</text><text x="30" y="189.0" font-size="13" text-anchor="start">image has it.</text>
<rect x="20" y="214" width="320" height="107" rx="7" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="2"/>
<text x="30" y="234.0" font-size="14" font-weight="700" text-anchor="start">Installed with Intune</text>
<text x="30" y="253.0" font-size="13" text-anchor="start">On Windows Enterprise multi-session</text><text x="30" y="270.0" font-size="13" text-anchor="start">session hosts: system context, targeted to</text><text x="30" y="287.0" font-size="13" text-anchor="start">devices, Required or Uninstall intent. Not</text><text x="30" y="304.0" font-size="13" text-anchor="start">the Available intent.</text>
<rect x="20" y="329" width="320" height="235" rx="7" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="2"/>
<text x="30" y="349.0" font-size="14" font-weight="700" text-anchor="start">With App Attach</text>
<text x="30" y="368.0" font-size="13" text-anchor="start">The application is not installed on the</text><text x="30" y="385.0" font-size="13" text-anchor="start">session host or in the image. The</text><text x="30" y="402.0" font-size="13" text-anchor="start">application package is assigned to the</text><text x="30" y="419.0" font-size="13" text-anchor="start">host pool and to users.</text>
<rect x="32" y="442" width="296" height="110" rx="7" fill="#ffffff" stroke="#3b6fb6" stroke-width="1.8"/>
<text x="42" y="461.0" font-size="13.5" font-weight="700" text-anchor="start">SMB file share</text>
<text x="42" y="478.0" font-size="13" text-anchor="start">Azure Files is recommended.</text>
<rect x="44" y="494" width="272" height="50" rx="7" fill="#ffffff" stroke="#6c7a8b" stroke-width="1.5"/>
<text x="54" y="512.0" font-size="13" font-weight="700" text-anchor="start">Application package</text>
<text x="54" y="529.0" font-size="13" text-anchor="start">Disk image or App-V package</text>
<rect x="20" y="578" width="320" height="143" rx="7" fill="#eef6ee" stroke="#3c8d40" stroke-width="2"/>
<text x="30" y="598.0" font-size="14" font-weight="700" text-anchor="start">Host pool</text>
<text x="30" y="617.0" font-size="13" text-anchor="start">In a pooled host pool, several users can</text><text x="30" y="634.0" font-size="13" text-anchor="start">be on one session host.</text>
<rect x="32" y="659" width="296" height="52" rx="7" fill="#ffffff" stroke="#3c8d40" stroke-width="1.8"/>
<text x="42" y="678.0" font-size="13.5" font-weight="700" text-anchor="start">Session hosts</text>
<text x="42" y="695.0" font-size="13" text-anchor="start">(virtual machines)</text>
<path d="M340 161.0 H352" fill="none" stroke="#6c7a8b" stroke-width="1.8"/>
<path d="M340 267.5 H352" fill="none" stroke="#6c7a8b" stroke-width="1.8"/>
<path d="M340 446.5 H352" fill="none" stroke="#6c7a8b" stroke-width="1.8"/>
<path d="M352 161.0 V620.9 H340" fill="none" stroke="#6c7a8b" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M32 685.0 H9 V497.0 H32" fill="none" stroke="#6c7a8b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="20" y="751.0" font-size="14" font-weight="700" text-anchor="start">Job 2: decide what users see</text>
<rect x="20" y="766" width="320" height="246" rx="7" fill="#fff7e8" stroke="#c2570c" stroke-width="2"/>
<text x="30" y="786.0" font-size="14" font-weight="700" text-anchor="start">Workspace</text>
<rect x="32" y="807" width="296" height="175" rx="7" fill="#ffffff" stroke="#c2570c" stroke-width="1.8"/>
<text x="42" y="826.0" font-size="13.5" font-weight="700" text-anchor="start">Application group</text>
<text x="42" y="845.0" font-size="13" text-anchor="start">Each application group is a desktop</text><text x="42" y="862.0" font-size="13" text-anchor="start">application group (full desktop) or a</text><text x="42" y="879.0" font-size="13" text-anchor="start">RemoteApp application group (individual</text><text x="42" y="896.0" font-size="13" text-anchor="start">applications). An application group is</text><text x="42" y="913.0" font-size="13" text-anchor="start">assigned to one host pool. Users are</text><text x="42" y="930.0" font-size="13" text-anchor="start">assigned to the application group. App</text><text x="42" y="947.0" font-size="13" text-anchor="start">Attach is the exception: the package is</text><text x="42" y="964.0" font-size="13" text-anchor="start">also assigned to users.</text>
<rect x="20" y="1042" width="320" height="73" rx="7" fill="#f3f0fa" stroke="#6b4fa0" stroke-width="2"/>
<text x="30" y="1062.0" font-size="14" font-weight="700" text-anchor="start">Users</text>
<text x="30" y="1081.0" font-size="13" text-anchor="start">See their desktop or RemoteApp</text><text x="30" y="1098.0" font-size="13" text-anchor="start">applications in Windows App.</text>
<path d="M180.0 1040.0 V982.0" fill="none" stroke="#6c7a8b" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M328 894.5 H352 V678.1 H340" fill="none" stroke="#6c7a8b" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="20" y="1131" width="320" height="124" rx="7" fill="#f3f0fa" stroke="#6b4fa0" stroke-width="2"/>
<text x="30" y="1151.0" font-size="14" font-weight="700" text-anchor="start">App Attach and the application groups</text>
<text x="30" y="1170.0" font-size="13" text-anchor="start">In a desktop session, assign the package</text><text x="30" y="1187.0" font-size="13" text-anchor="start">to the host pool and to users. There is no</text><text x="30" y="1204.0" font-size="13" text-anchor="start">step in the desktop application group. As</text><text x="30" y="1221.0" font-size="13" text-anchor="start">a RemoteApp, also add the application to a</text><text x="30" y="1238.0" font-size="13" text-anchor="start">RemoteApp application group.</text>
<rect x="20" y="1271" width="320" height="163" rx="7" fill="#ffffff" stroke="#5f6b7a" stroke-width="1.5"/>
<text x="30" y="1291.0" font-size="14" font-weight="700" text-anchor="start">How to read the arrows</text>
<path d="M30 1310 H60" fill="none" stroke="#6c7a8b" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="72" y="1311.0" font-size="13" text-anchor="start">Solid arrow: the tail delivers to,</text><text x="72" y="1328.0" font-size="13" text-anchor="start">or is assigned to, the head.</text>
<path d="M30 1352 H60" fill="none" stroke="#6c7a8b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="72" y="1353.0" font-size="13" text-anchor="start">Dashed arrow: the tail reads from</text><text x="72" y="1370.0" font-size="13" text-anchor="start">the head.</text>
<rect x="30" y="1385" width="30" height="16" rx="3" fill="#ffffff" stroke="#6c7a8b" stroke-width="1.2"/>
<rect x="36" y="1389" width="18" height="8" rx="2" fill="#ffffff" stroke="#6c7a8b" stroke-width="1"/>
<text x="72" y="1395.0" font-size="13" text-anchor="start">Box inside a box: the outer box</text><text x="72" y="1412.0" font-size="13" text-anchor="start">holds the inner one.</text>
</svg>
