<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 610" width="960" height="610" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">Where a slow session can come from, and where to look</title>
<desc id="d">A chain from the user's device to the session host, drawn with Azure icons, with a network path between them. Inside the path are two checks: how long it is (round-trip time) and how full it is (bandwidth, packet loss and jitter). A third check, how busy the host is (CPU, memory and input delay), points at the session host. Below are four places to look: the Connection Information dialog on the client, the connection network data table and the connection graphics data table (preview) in Log Analytics, and Azure Virtual Desktop Insights. A note says QoS and the throttle rate apply only to the RDP Shortpath for managed networks path.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3c8d40"/></marker></defs>
<rect x="6" y="6" width="948" height="598" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
<text x="480.0" y="38" font-size="20" font-weight="600" text-anchor="middle" fill="#1f2933">A slow session: three places to check</text>
<line x1="136" y1="115" x2="186" y2="115" stroke="#5f6b7a" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="714" y1="115" x2="796" y2="115" stroke="#5f6b7a" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
<rect x="190" y="50" width="520" height="130" rx="8" fill="#f7f8fa" stroke="#d5dae1" stroke-width="1.5"/><text x="206" y="72" font-size="15" font-weight="600" fill="#1f2933">The network path, both directions</text>
<rect x="30" y="330" width="900" height="190" rx="8" fill="#f7f8fa" stroke="#d5dae1" stroke-width="1.5"/><text x="46" y="352" font-size="15" font-weight="600" fill="#1f2933">Where to look</text>
<rect x="200" y="90" width="240" height="76" rx="8" fill="#fff0e5" stroke="#f0b48a" stroke-width="1.5"/>
<text x="320.0" y="112" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">1. How long is it?</text><text x="320.0" y="134" font-size="14" text-anchor="middle" fill="#1f2933">Round-trip time</text><text x="320.0" y="154" font-size="12" text-anchor="middle" fill="#5f6b7a">distance, VPN, proxy, firewall</text>
<rect x="460" y="90" width="240" height="76" rx="8" fill="#fff0e5" stroke="#f0b48a" stroke-width="1.5"/>
<text x="580.0" y="112" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">2. How full is it?</text><text x="580.0" y="134" font-size="14" text-anchor="middle" fill="#1f2933">Bandwidth, packet loss, jitter</text><text x="580.0" y="154" font-size="12" text-anchor="middle" fill="#5f6b7a">video, large prints, shared links</text>
<rect x="750" y="210" width="190" height="96" rx="8" fill="#e7f6ec" stroke="#8bcb9f" stroke-width="1.5"/>
<text x="845.0" y="232" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">3. How busy is the host?</text><text x="845.0" y="254" font-size="14" text-anchor="middle" fill="#1f2933">CPU, memory, input delay</text><text x="845.0" y="274" font-size="12" text-anchor="middle" fill="#5f6b7a">size and storage</text>
<line x1="832" y1="210" x2="832" y2="196" stroke="#3c8d40" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#g)"/>
<image x="58" y="83" width="64" height="64" href="data:image/svg+xml;base64,"/>
<text x="90.0" y="169" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">User&#x27;s device</text>
<text x="90.0" y="188" font-size="12" text-anchor="middle" fill="#5f6b7a">client and local network</text>
<image x="800" y="83" width="64" height="64" href="data:image/svg+xml;base64,"/>
<text x="832.0" y="169" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Session host</text>
<text x="832.0" y="188" font-size="12" text-anchor="middle" fill="#5f6b7a">virtual machine in Azure</text>
<image x="112" y="368" width="56" height="56" href="data:image/svg+xml;base64,"/>
<text x="140.0" y="446" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Connection Information</text>
<text x="140.0" y="465" font-size="12" text-anchor="middle" fill="#5f6b7a">on the client:</text>
<text x="140.0" y="481" font-size="12" text-anchor="middle" fill="#5f6b7a">which transport is in use</text>
<image x="342" y="368" width="56" height="56" href="data:image/svg+xml;base64,"/>
<text x="370.0" y="446" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Connection network data</text>
<text x="370.0" y="465" font-size="12" text-anchor="middle" fill="#5f6b7a">Log Analytics, every 2 min:</text>
<text x="370.0" y="481" font-size="12" text-anchor="middle" fill="#5f6b7a">bandwidth, round-trip time</text>
<image x="572" y="368" width="56" height="56" href="data:image/svg+xml;base64,"/>
<text x="600.0" y="446" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Connection graphics data</text>
<text x="600.0" y="465" font-size="12" text-anchor="middle" fill="#5f6b7a">Log Analytics (preview):</text>
<text x="600.0" y="481" font-size="12" text-anchor="middle" fill="#5f6b7a">written only when quality drops</text>
<image x="802" y="368" width="56" height="56" href="data:image/svg+xml;base64,"/>
<text x="830.0" y="446" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">AVD Insights</text>
<text x="830.0" y="465" font-size="12" text-anchor="middle" fill="#5f6b7a">round-trip time by gateway</text>
<text x="830.0" y="481" font-size="12" text-anchor="middle" fill="#5f6b7a">region, input delay by host</text>
<rect x="180" y="536" width="600" height="38" rx="8" fill="#f3eeff" stroke="#b9a6f0" stroke-width="1.5"/><text x="480" y="560" font-size="14" text-anchor="middle" fill="#1f2933">QoS and the throttle rate apply only to the RDP Shortpath for managed networks path.</text>
<text x="480.0" y="598" font-size="12" text-anchor="middle" fill="#5f6b7a">Drawn by the author from Microsoft Learn pages, with Azure icons. Not an official Microsoft diagram.</text></svg>