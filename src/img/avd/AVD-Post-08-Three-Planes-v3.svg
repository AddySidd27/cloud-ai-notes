<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">Management, control and data planes in Azure Virtual Desktop</title>
  <desc id="d">Original diagram with three horizontal bands. Management plane: you or your automation use Azure Resource Manager to create host pools, application groups and workspaces. If it fails, you cannot change settings and users are usually unaffected. Control plane: the Microsoft-run web service, broker service and gateway service, plus the resource directory and the geographical or regional database. If it fails, the feed or new connections fail. Data plane: the user device connects over RDP, over TCP through the gateway or over UDP with RDP Shortpath, to the session host, which uses profile storage and an identity service. If it fails, sessions are slow, freeze or drop.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/></marker></defs>
  <rect x="6" y="6" width="988" height="788" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
  <text x="500" y="36" font-size="20" font-weight="600" text-anchor="middle" fill="#1f2933">Three planes (the author&#x27;s framing) and what a problem in each affects</text>
  <rect x="20" y="54" width="960" height="176" rx="8" fill="#fdf6ec" stroke="#c2570c" stroke-width="1.5"/>
  <text x="36" y="80" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Management plane</text>
  <text x="36" y="100" font-size="14" text-anchor="start" fill="#1f2933">How you create and change AVD objects</text>
  <rect x="36" y="118" width="170" height="80" rx="6" fill="#ffffff" stroke="#c2570c" stroke-width="1.2"/>
  <text x="121.0" y="153.4" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">You or your</text>
  <text x="121.0" y="172.4" font-size="14" text-anchor="middle" fill="#1f2933">automation</text>
  <rect x="256" y="118" width="190" height="80" rx="6" fill="#ffffff" stroke="#c2570c" stroke-width="1.2"/>
  <text x="351.0" y="153.4" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Azure Resource</text>
  <text x="351.0" y="172.4" font-size="14" text-anchor="middle" fill="#1f2933">Manager</text>
  <rect x="496" y="118" width="190" height="80" rx="6" fill="#ffffff" stroke="#c2570c" stroke-width="1.2"/>
  <text x="591.0" y="153.4" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Host pools, app</text>
  <text x="591.0" y="172.4" font-size="14" text-anchor="middle" fill="#1f2933">groups, workspaces</text>
  <line x1="206" y1="158" x2="256" y2="158" stroke="#c2570c" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="446" y1="158" x2="496" y2="158" stroke="#c2570c" stroke-width="3" marker-end="url(#arr)"/>
  <text x="716" y="124" font-size="14" font-weight="600" text-anchor="start" fill="#c2570c">If it has a problem:</text>
  <text x="716" y="144" font-size="14" text-anchor="start" fill="#1f2933">you cannot change settings.</text>
  <text x="716" y="164" font-size="14" text-anchor="start" fill="#1f2933">Users are usually unaffected.</text>
  <text x="716" y="184" font-size="14" text-anchor="start" fill="#1f2933">(Author&#x27;s view.)</text>
  <rect x="20" y="246" width="960" height="250" rx="8" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="1.5"/>
  <text x="36" y="272" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Control plane</text>
  <text x="36" y="292" font-size="14" text-anchor="start" fill="#1f2933">The Microsoft-run services that connect users</text>
  <rect x="36" y="306" width="150" height="66" rx="6" fill="#ffffff" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="111.0" y="343.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Web service</text>
  <rect x="226" y="306" width="150" height="66" rx="6" fill="#ffffff" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="301.0" y="343.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Broker service</text>
  <rect x="416" y="306" width="150" height="66" rx="6" fill="#ffffff" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="491.0" y="343.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Gateway service</text>
  <rect x="36" y="416" width="150" height="66" rx="6" fill="#ffffff" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="111.0" y="444.4" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Resource</text>
  <text x="111.0" y="463.4" font-size="14" text-anchor="middle" fill="#1f2933">directory</text>
  <rect x="226" y="416" width="340" height="66" rx="6" fill="#ffffff" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="396.0" y="444.4" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Geographical or</text>
  <text x="396.0" y="463.4" font-size="14" text-anchor="middle" fill="#1f2933">regional database</text>
  <line x1="186" y1="339" x2="226" y2="339" stroke="#3b6fb6" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="226" y1="339" x2="186" y2="339" stroke="#3b6fb6" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="416" y1="339" x2="376" y2="339" stroke="#3b6fb6" stroke-width="3" stroke-dasharray="3,4" marker-end="url(#arr)"/>
  <line x1="376" y1="339" x2="416" y2="339" stroke="#3b6fb6" stroke-width="3" stroke-dasharray="3,4" marker-end="url(#arr)"/>
  <line x1="255" y1="372" x2="150" y2="416" stroke="#3b6fb6" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="301" y1="372" x2="301" y2="416" stroke="#3b6fb6" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="301" y1="416" x2="301" y2="372" stroke="#3b6fb6" stroke-width="3" marker-end="url(#arr)"/>
  <text x="596" y="312" font-size="14" font-weight="600" text-anchor="start" fill="#3b6fb6">If it has a problem:</text>
  <text x="596" y="332" font-size="14" text-anchor="start" fill="#1f2933">the feed or new connections</text>
  <text x="596" y="352" font-size="14" text-anchor="start" fill="#1f2933">fail. Documented: a database</text>
  <text x="596" y="372" font-size="14" text-anchor="start" fill="#1f2933">failover briefly fails new</text>
  <text x="596" y="392" font-size="14" text-anchor="start" fill="#1f2933">connections, and a failed</text>
  <text x="596" y="412" font-size="14" text-anchor="start" fill="#1f2933">gateway instance drops the</text>
  <text x="596" y="432" font-size="14" text-anchor="start" fill="#1f2933">connections it relays.</text>
  <rect x="20" y="512" width="960" height="272" rx="8" fill="#eef6ee" stroke="#3c8d40" stroke-width="1.5"/>
  <text x="36" y="538" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Data plane</text>
  <text x="36" y="558" font-size="14" text-anchor="start" fill="#1f2933">The remote session itself</text>
  <rect x="36" y="570" width="150" height="110" rx="6" fill="#ffffff" stroke="#3c8d40" stroke-width="1.2"/>
  <image x="91" y="576" width="40" height="40" href="data:image/svg+xml;base64,"/>
  <text x="111" y="640" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">User device</text>
  <text x="111" y="659" font-size="14" text-anchor="middle" fill="#1f2933">(client)</text>
  <rect x="346" y="570" width="170" height="110" rx="6" fill="#ffffff" stroke="#3c8d40" stroke-width="1.2"/>
  <image x="411" y="576" width="40" height="40" href="data:image/svg+xml;base64,"/>
  <text x="431" y="640" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Session host</text>
  <text x="431" y="659" font-size="14" text-anchor="middle" fill="#1f2933">(your VM)</text>
  <line x1="186" y1="625" x2="346" y2="625" stroke="#3c8d40" stroke-width="3" marker-end="url(#arr)"/>
  <text x="266" y="586" font-size="14" text-anchor="middle" fill="#1f2933">RDP over TCP via</text>
  <text x="266" y="604" font-size="14" text-anchor="middle" fill="#1f2933">the gateway, or UDP</text>
  <rect x="246" y="700" width="180" height="70" rx="6" fill="#ffffff" stroke="#3c8d40" stroke-width="1.2"/>
  <image x="254" y="712" width="34" height="34" href="data:image/svg+xml;base64,"/>
  <text x="358" y="730" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Azure Files</text>
  <text x="358" y="750" font-size="14" text-anchor="middle" fill="#1f2933">(profile storage)</text>
  <rect x="476" y="700" width="190" height="70" rx="6" fill="#ffffff" stroke="#3c8d40" stroke-width="1.2"/>
  <image x="484" y="712" width="34" height="34" href="data:image/svg+xml;base64,"/>
  <text x="590" y="730" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Microsoft Entra ID</text>
  <text x="590" y="750" font-size="14" text-anchor="middle" fill="#1f2933">(or AD DS)</text>
  <line x1="380" y1="680" x2="380" y2="700" stroke="#3c8d40" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="500" y1="680" x2="500" y2="700" stroke="#3c8d40" stroke-width="3" marker-end="url(#arr)"/>
  <text x="716" y="580" font-size="14" font-weight="600" text-anchor="start" fill="#3c8d40">If it has a problem:</text>
  <text x="716" y="600" font-size="14" text-anchor="start" fill="#1f2933">sessions are slow, freeze</text>
  <text x="716" y="620" font-size="14" text-anchor="start" fill="#1f2933">or drop. Sign-in is slow</text>
  <text x="716" y="640" font-size="14" text-anchor="start" fill="#1f2933">or fails. A temporary</text>
  <text x="716" y="660" font-size="14" text-anchor="start" fill="#1f2933">profile can appear.</text>
  <text x="716" y="680" font-size="14" text-anchor="start" fill="#1f2933">(Author&#x27;s view.)</text>
</svg>
