<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">Management, control and data planes in Azure Virtual Desktop</title>
  <desc id="d">Diagram with three horizontal bands. Management plane: you or your automation use Azure Resource Manager to create host pools, application groups and workspaces. If it fails, you cannot change settings and users are usually unaffected. Control plane: the Microsoft-run web service, broker service, resource directory and geographical or regional database. The web service asks the resource directory which database holds a user's information and gets feed data from the broker, and the broker reads the database. The gateway service sits on the boundary between the control plane and the data plane. If the control plane fails, the feed or new connections fail. A database failover briefly fails new connections, and a failed gateway instance drops the connections it relays. Data plane: the user device connects with RDP over TCP through the gateway, or directly over UDP with RDP Shortpath, to the session host, which connects outward to the gateway and uses profile storage and an identity service. If it fails, sessions are slow, freeze or drop.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
  <rect x="6" y="6" width="988" height="788" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
  <text x="500" y="36" font-size="20" font-weight="600" text-anchor="middle" fill="#1f2933">Three planes and what a problem in each affects</text>
  <rect x="20" y="54" width="960" height="152" rx="8" fill="#fdf6ec" stroke="#c2570c" stroke-width="1.5"/>
  <text x="36" y="80" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Management plane</text>
  <text x="36" y="100" font-size="14" text-anchor="start" fill="#1f2933">How you create and change AVD objects</text>
  <rect x="36" y="114" width="170" height="70" rx="6" fill="#ffffff" stroke="#c2570c" stroke-width="1.2"/>
  <text x="121" y="144" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">You or your</text>
  <text x="121" y="163" font-size="14" text-anchor="middle" fill="#1f2933">automation</text>
  <rect x="256" y="114" width="190" height="70" rx="6" fill="#ffffff" stroke="#c2570c" stroke-width="1.2"/>
  <text x="351" y="144" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Azure Resource</text>
  <text x="351" y="163" font-size="14" text-anchor="middle" fill="#1f2933">Manager</text>
  <rect x="496" y="114" width="190" height="70" rx="6" fill="#ffffff" stroke="#c2570c" stroke-width="1.2"/>
  <text x="591" y="144" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Host pools, app</text>
  <text x="591" y="163" font-size="14" text-anchor="middle" fill="#1f2933">groups, workspaces</text>
  <polyline points="206,149 256,149" fill="none" stroke="#c2570c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
  <polyline points="446,149 496,149" fill="none" stroke="#c2570c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
  <text x="716" y="124" font-size="14" font-weight="600" text-anchor="start" fill="#c2570c">If it has a problem:</text>
  <text x="716" y="144" font-size="14" text-anchor="start" fill="#1f2933">you cannot change settings.</text>
  <text x="716" y="164" font-size="14" text-anchor="start" fill="#1f2933">Users are usually unaffected.</text>
  <rect x="20" y="222" width="960" height="250" rx="8" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="1.5"/>
  <text x="36" y="248" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Control plane</text>
  <text x="36" y="268" font-size="14" text-anchor="start" fill="#1f2933">The Microsoft-run services that connect users</text>
  <rect x="36" y="282" width="150" height="66" rx="6" fill="#ffffff" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="111" y="320" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Web service</text>
  <rect x="286" y="282" width="150" height="66" rx="6" fill="#ffffff" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="361" y="320" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Broker service</text>
  <rect x="36" y="398" width="150" height="66" rx="6" fill="#ffffff" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="111" y="428" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Resource</text>
  <text x="111" y="447" font-size="14" text-anchor="middle" fill="#1f2933">directory</text>
  <rect x="286" y="398" width="150" height="66" rx="6" fill="#ffffff" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="361" y="428" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Geographical or</text>
  <text x="361" y="447" font-size="14" text-anchor="middle" fill="#1f2933">regional database</text>
  <polyline points="186,315 286,315" fill="none" stroke="#3b6fb6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
  <text x="236" y="287" font-size="14" text-anchor="middle" fill="#1f2933">gets feed</text>
<text x="236" y="303" font-size="14" text-anchor="middle" fill="#1f2933">data</text>
  <polyline points="111,348 111,398" fill="none" stroke="#3b6fb6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
  <text x="121" y="378" font-size="14" text-anchor="start" fill="#1f2933">which database?</text>
  <polyline points="186,431 286,431" fill="none" stroke="#3b6fb6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
  <text x="236" y="422" font-size="14" text-anchor="middle" fill="#1f2933">points to</text>
  <polyline points="361,348 361,398" fill="none" stroke="#3b6fb6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
  <text x="371" y="378" font-size="14" text-anchor="start" fill="#1f2933">reads connection files</text>
  <text x="760" y="262" font-size="14" font-weight="600" text-anchor="start" fill="#3b6fb6">If it has a problem:</text>
  <text x="760" y="282" font-size="14" text-anchor="start" fill="#1f2933">the feed or new connections</text>
  <text x="760" y="302" font-size="14" text-anchor="start" fill="#1f2933">fail. A database failover</text>
  <text x="760" y="322" font-size="14" text-anchor="start" fill="#1f2933">briefly fails new connections,</text>
  <text x="760" y="342" font-size="14" text-anchor="start" fill="#1f2933">and a failed gateway instance</text>
  <text x="760" y="362" font-size="14" text-anchor="start" fill="#1f2933">drops the connections it</text>
  <text x="760" y="382" font-size="14" text-anchor="start" fill="#1f2933">relays.</text>
  <rect x="20" y="488" width="960" height="296" rx="8" fill="#eef6ee" stroke="#3c8d40" stroke-width="1.5"/>
  <text x="36" y="514" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Data plane</text>
  <text x="36" y="534" font-size="14" text-anchor="start" fill="#1f2933">The remote session itself</text>
  <rect x="536" y="364" width="170" height="92" rx="6" fill="#ffffff" stroke="#3b6fb6" stroke-width="1.8"/>
  <text x="621" y="404" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Gateway service</text>
  <text x="621" y="423" font-size="14" text-anchor="middle" fill="#1f2933">(relays RDP over TCP)</text>
  <polyline points="621,364 621,315 436,315" fill="none" stroke="#3b6fb6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
  <text x="528" y="306" font-size="14" text-anchor="middle" fill="#1f2933">asks the broker</text>
  <rect x="36" y="580" width="150" height="100" rx="6" fill="#ffffff" stroke="#3c8d40" stroke-width="1.2"/>
  <text x="111" y="624.7" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">User device</text>
  <text x="111" y="643.7" font-size="14" text-anchor="middle" fill="#1f2933">(client)</text>
  <rect x="536" y="580" width="170" height="100" rx="6" fill="#ffffff" stroke="#3c8d40" stroke-width="1.2"/>
  <image x="601" y="586" width="40" height="40" href="data:image/svg+xml;base64,"/>
  <text x="621" y="646" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Session host</text>
  <text x="621" y="665" font-size="14" text-anchor="middle" fill="#1f2933">(your VM)</text>
  <polyline points="186,610 480,610 480,430 536,430" fill="none" stroke="#3c8d40" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
  <text x="196" y="574" font-size="14" text-anchor="start" fill="#1f2933">RDP over TCP</text>
  <text x="196" y="591" font-size="14" text-anchor="start" fill="#1f2933">via the gateway</text>
  <polyline points="186,650 536,650" fill="none" stroke="#3c8d40" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="10 6" marker-end="url(#arr)"/>
  <text x="361" y="642" font-size="14" text-anchor="middle" fill="#1f2933">or direct UDP (RDP Shortpath)</text>
  <polyline points="621,580 621,458" fill="none" stroke="#3c8d40" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
  <text x="611" y="525" font-size="14" text-anchor="end" fill="#1f2933">host connects out</text>
  <rect x="456" y="724" width="170" height="52" rx="6" fill="#ffffff" stroke="#3c8d40" stroke-width="1.2"/>
  <image x="462" y="731" width="38" height="38" href="data:image/svg+xml;base64,"/>
  <text x="563" y="746" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Azure Files</text>
  <text x="563" y="764" font-size="14" text-anchor="middle" fill="#1f2933">(profile storage)</text>
  <rect x="636" y="724" width="200" height="52" rx="6" fill="#ffffff" stroke="#3c8d40" stroke-width="1.2"/>
  <image x="642" y="731" width="38" height="38" href="data:image/svg+xml;base64,"/>
  <text x="758" y="746" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Microsoft Entra ID</text>
  <text x="758" y="764" font-size="14" text-anchor="middle" fill="#1f2933">(or AD DS)</text>
  <polyline points="580,680 580,724" fill="none" stroke="#3c8d40" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
  <text x="588" y="708" font-size="14" text-anchor="start" fill="#1f2933">profile</text>
  <polyline points="670,680 670,724" fill="none" stroke="#3c8d40" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
  <text x="678" y="708" font-size="14" text-anchor="start" fill="#1f2933">sign-in</text>
  <text x="760" y="586" font-size="14" font-weight="600" text-anchor="start" fill="#3c8d40">If it has a problem:</text>
  <text x="760" y="606" font-size="14" text-anchor="start" fill="#1f2933">sessions are slow, freeze</text>
  <text x="760" y="626" font-size="14" text-anchor="start" fill="#1f2933">or drop. Sign-in is slow</text>
  <text x="760" y="646" font-size="14" text-anchor="start" fill="#1f2933">or fails. A temporary</text>
  <text x="760" y="666" font-size="14" text-anchor="start" fill="#1f2933">profile can appear.</text>
<!--fx:threep1-->
</svg>
