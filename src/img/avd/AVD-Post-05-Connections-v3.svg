  <text x="555.0" y="379.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">RD Web</text>
  <rect x="350" y="465" width="130" height="60" rx="6" fill="#ffffff" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="415.0" y="499.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">RD Gateway</text>
  <rect x="640" y="465" width="130" height="60" rx="6" fill="#ffffff" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="705.0" y="499.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">RD Broker</text>
  <rect x="330" y="650" width="230" height="80" rx="8" fill="#ffffff" stroke="#6b4fa0" stroke-width="1.8"/>
  <image x="342" y="670" width="40" height="40" href="data:image/svg+xml;base64,"/>
  <text x="392" y="697" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Microsoft Entra ID</text>
