  <text x="100" y="811" font-size="13" text-anchor="start" fill="#1f2933">Feed subscription (TCP 443)</text>
  <line x1="48" y1="828" x2="88" y2="828" stroke="#6b4fa0" stroke-width="3"/>
  <text x="100" y="833" font-size="13" text-anchor="start" fill="#1f2933">Microsoft Entra authentication (TCP 443)</text>
  <line x1="48" y1="850" x2="88" y2="850" stroke="#3c8d40" stroke-width="3"/>
  <text x="100" y="855" font-size="13" text-anchor="start" fill="#1f2933">RD Agent communication (TCP 443)</text>
  <line x1="518" y1="784" x2="558" y2="784" stroke="#3c8d40" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="570" y="789" font-size="13" text-anchor="start" fill="#1f2933">Active Directory connectivity</text>
  <line x1="518" y1="806" x2="558" y2="806" stroke="#7bb27d" stroke-width="3" stroke-dasharray="10,5"/>
  <text x="570" y="811" font-size="13" text-anchor="start" fill="#1f2933">Microsoft Entra Connect sync (TCP 443)</text>
  <line x1="518" y1="828" x2="558" y2="828" stroke="#d4a017" stroke-width="3" stroke-dasharray="3,4"/>
  <text x="570" y="833" font-size="13" text-anchor="start" fill="#1f2933">Internal service traffic</text>
  <rect x="30" y="890" width="940" height="58" rx="6" fill="#ffffff" stroke="#c2570c" stroke-width="1.4"/>
  <text x="44" y="912" font-size="13" text-anchor="start" fill="#1f2933">Flagged: Learn&#x27;s arrowheads and the page text differ. The sync line has its arrowhead at AD DS here, as in Learn,</text>
  <text x="44" y="932" font-size="13" text-anchor="start" fill="#1f2933">while Learn text describes Microsoft Entra Connect syncing from AD DS to Entra ID. Page text: both ends connect outward.</text>
</svg>
