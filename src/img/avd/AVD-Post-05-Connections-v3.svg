  <line x1="700" y1="465" x2="590" y2="405" stroke="#d4a017" stroke-width="3" stroke-dasharray="3,4" marker-end="url(#arr)"/>
  <line x1="560" y1="690" x2="895" y2="690" stroke="#7bb27d" stroke-width="3" stroke-dasharray="10,5"/>
  <line x1="895" y1="690" x2="895" y2="200" stroke="#7bb27d" stroke-width="3" stroke-dasharray="10,5" marker-end="url(#arr)"/>
  <rect x="30" y="760" width="940" height="118" rx="6" fill="#ffffff" stroke="#5f6b7a" stroke-width="1.2"/>
  <line x1="48" y1="784" x2="88" y2="784" stroke="#1f8ad1" stroke-width="4"/>
  <text x="100" y="789" font-size="13" text-anchor="start" fill="#1f2933">Reverse connect transport (TCP 443)</text>
