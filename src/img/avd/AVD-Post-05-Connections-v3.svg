  <image x="485" y="110" width="40" height="40" href="data:image/svg+xml;base64,"/>
  <text x="505" y="178" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Session host</text>
  <rect x="820" y="100" width="150" height="100" rx="6" fill="#ffffff" stroke="#c2570c" stroke-width="1.2"/>
  <text x="895.0" y="154.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">AD DS</text>
  <rect x="30" y="330" width="140" height="90" rx="40" fill="#eaf2fb" stroke="#5f6b7a" stroke-width="1.8"/>
  <text x="100" y="380" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Public internet</text>
  <rect x="330" y="320" width="450" height="270" rx="8" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="1.8"/>
  <text x="555" y="575" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Azure Virtual Desktop Infrastructure</text>
