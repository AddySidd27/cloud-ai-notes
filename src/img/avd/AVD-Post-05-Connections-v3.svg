<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 960" width="1000" height="960" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">Azure Virtual Desktop network connections, redrawn from Learn</title>
  <desc id="d">Not an official Microsoft diagram. It follows the Learn network connections diagram. A client, a session host and AD DS sit at the top. A public internet cloud sits at left. A box named Azure Virtual Desktop Infrastructure holds RD Web, RD Gateway and RD Broker, joined by internal service traffic. Microsoft Entra ID sits below the box. The client has a reverse connect transport line through the internet to RD Gateway, a feed subscription line through the internet to RD Web and an authentication line to Microsoft Entra ID. RD Gateway has a reverse connect line to the session host. The session host has an RD Agent communication line to RD Broker and an Active Directory connectivity line to AD DS. A Microsoft Entra Connect sync line joins Microsoft Entra ID and AD DS with its arrowhead at AD DS as Learn draws it. Session host authentication to Entra ID is not drawn in the Learn diagram.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/></marker></defs>
  <rect x="6" y="6" width="988" height="948" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
  <text x="500" y="36" font-size="20" font-weight="600" text-anchor="middle" fill="#1f2933">Azure Virtual Desktop network connections</text>
  <text x="500" y="60" font-size="14" text-anchor="middle" fill="#1f2933">Redrawn from the Learn diagram, using its names and arrowheads. Arrow ends are as Learn draws them.</text>
