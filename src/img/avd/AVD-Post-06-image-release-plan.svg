="575.0" y="136" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#17324d">Candidate image version</text><rect x="805" y="45" width="320" height="110" rx="10" fill="#edf5fc" stroke="#7e9ab0" stroke-width="1.5"/><text x="965.0" y="80" text-anchor="middle" font-family="DejaVu Sans" font-size="21" font-weight="600" fill="#17324d">3. Validate</text><text x="965.0" y="108" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#17324d">Representative session hosts</text><text x="965.0" y="136" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#17324d">Apps, sign-in and profiles</text><rect x="805" y="325" width="320" height="110" rx="10" fill="#eaf5ee" stroke="#7e9ab0" stroke-width="1.5"/><text x="965.0" y="360" text-anchor="middle" font-family="DejaVu Sans" font-size="21" font-weight="600" fill="#17324d">4. Approve release</text><text x="965.0" y="388" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#17324d">Production image version</text><text x="965.0" y="416" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#17324d">Replicate to target region</text><rect x="415" y="325" width="320" height="110" rx="10" fill="#eaf5ee" stroke="#7e9ab0" stroke-width="1.5"/><text x="575.0" y="360" text-anchor="middle" font-family="DejaVu Sans" font-size="21" font-weight="600" fill="#17324d">5. Roll out in waves</text><text x="575.0" y="388" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#17324d">Replace pooled session hosts</text><text x="575.0" y="416" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#17324d">Retain previous version</text><text x="575" y="485" text-anchor="middle" font-family="DejaVu Sans" font-size="18" fill="#536c83">The release process is an illustrative operating plan for our pooled workloads.</text></svg>