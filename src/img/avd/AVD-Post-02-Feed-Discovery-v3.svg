  <text x="690.0" y="424.4" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">broker</text>
  <rect x="815" y="370" width="150" height="80" rx="6" fill="#ffffff" stroke="#3b6fb6" stroke-width="1.2"/>
  <image x="823" y="392" width="36" height="36" href="data:image/svg+xml;base64,"/>
  <text x="865" y="405" font-size="13" font-weight="600" text-anchor="start" fill="#1f2933">Regional</text>
  <text x="865" y="423" font-size="13" font-weight="600" text-anchor="start" fill="#1f2933">database</text>
  <line x1="760" y1="410" x2="815" y2="410" stroke="#1f2933" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="815" y1="410" x2="760" y2="410" stroke="#1f2933" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="840" y1="215" x2="840" y2="280" stroke="#3b6fb6" stroke-width="2.5"/>
  <line x1="840" y1="280" x2="290" y2="280" stroke="#3b6fb6" stroke-width="2.5"/>
  <line x1="290" y1="280" x2="290" y2="370" stroke="#3b6fb6" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="690" y1="280" x2="690" y2="370" stroke="#3b6fb6" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="15" y="545" width="970" height="105" rx="6" fill="#ffffff" stroke="#c2570c" stroke-width="1.4"/>
  <text x="30" y="568" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Flagged difference inside Learn, not resolved here</text>
  <text x="30" y="590" font-size="13" text-anchor="start" fill="#1f2933">The picture joins the web service to the resource directory and the resource directory to the brokers.</text>
  <text x="30" y="610" font-size="13" text-anchor="start" fill="#1f2933">The page text says the web service connects to the broker service, and the broker connects to the resource</text>
  <text x="30" y="630" font-size="13" text-anchor="start" fill="#1f2933">directory and the database. The component interconnection diagram on the same page shows the broker doing that.</text>
</svg>
