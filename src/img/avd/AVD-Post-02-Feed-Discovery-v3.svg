  <line x1="415" y1="410" x2="360" y2="410" stroke="#1f2933" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="600" y="300" width="375" height="230" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="1.6"/>
