<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">Feed discovery in one Azure region, as drawn on Learn</title>
  <desc id="d">Not an official Microsoft diagram. It follows the Learn feed discovery diagram for a host pool in a single Azure region. A client and the web service are joined by a two-way arrow, and the web service and the resource directory are joined by a two-way arrow, all inside a box labelled Region 1. A dashed two-way link joins the client and Azure Traffic Manager. Below, a geographical deployment scope box and a regional deployment scope box each hold a broker joined by a two-way arrow to its database. One line leaves the resource directory and splits to the geographical broker and to the regional broker. The page text describes the flow differently: the web service connects to the broker service, which connects to the resource directory and the database.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/></marker></defs>
  <rect x="6" y="6" width="988" height="648" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
  <text x="500" y="36" font-size="20" font-weight="600" text-anchor="middle" fill="#1f2933">Feed discovery in one Azure region</text>
  <text x="500" y="58" font-size="14" text-anchor="middle" fill="#1f2933">Redrawn from the Learn picture. The page text describes it differently, see the note below.</text>
  <rect x="24" y="110" width="130" height="100" rx="6" fill="#ffffff" stroke="#3c8d40" stroke-width="1.2"/>
  <text x="89.0" y="155.4" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933"></text>
  <text x="89.0" y="174.4" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Client</text>
  <image x="69" y="122" width="40" height="40" href="data:image/svg+xml;base64,"/>
  <rect x="24" y="330" width="130" height="110" rx="6" fill="#ffffff" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="89.0" y="370.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933"></text>
  <text x="89.0" y="389.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Azure Traffic</text>
  <text x="89.0" y="408.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Manager</text>
  <image x="69" y="340" width="40" height="40" href="data:image/svg+xml;base64,"/>
  <line x1="89" y1="210" x2="89" y2="330" stroke="#5f6b7a" stroke-width="2.5" stroke-dasharray="3,4" marker-end="url(#arr)"/>
  <line x1="89" y1="330" x2="89" y2="210" stroke="#5f6b7a" stroke-width="2.5" stroke-dasharray="3,4" marker-end="url(#arr)"/>
  <rect x="200" y="80" width="775" height="180" rx="8" fill="#f3f7fc" stroke="#5f6b7a" stroke-width="1.6"/>
  <text x="587" y="102" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Region 1</text>
  <rect x="330" y="125" width="140" height="90" rx="6" fill="#ffffff" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="400.0" y="174.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Web service</text>
  <rect x="760" y="125" width="160" height="90" rx="6" fill="#ffffff" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="840.0" y="174.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Resource directory</text>
  <line x1="154" y1="170" x2="330" y2="170" stroke="#1f2933" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="330" y1="170" x2="154" y2="170" stroke="#1f2933" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="470" y1="170" x2="760" y2="170" stroke="#1f2933" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="760" y1="170" x2="470" y2="170" stroke="#1f2933" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="200" y="300" width="385" height="230" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="1.6"/>
  <text x="392.5" y="515" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Geographical deployment scope</text>
  <rect x="220" y="370" width="140" height="80" rx="6" fill="#ffffff" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="290.0" y="405.4" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Geographical</text>
  <text x="290.0" y="424.4" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">broker</text>
