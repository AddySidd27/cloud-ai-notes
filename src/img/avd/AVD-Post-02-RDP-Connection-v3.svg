<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">The RDP connection, redrawn from Learn</title>
  <desc id="d">Not an official Microsoft diagram. It follows the Learn RDP connection diagram. A client has a two-way link to Azure Front Door, and Azure Front Door has a two-way TCP link to the gateway service. Inside a box labelled Region 1 are the gateway service, the broker service and the session host, with dotted two-way links from gateway to broker and from broker to session host, and a two-way TCP link between the gateway service and the session host. Two RDP Shortpath boxes, one for managed networks and one for public networks, also sit inside Region 1. Purple UDP lines run from the client to both Shortpath boxes and to the session host, and from the session host to both Shortpath boxes.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/></marker></defs>
  <rect x="6" y="6" width="988" height="628" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
  <text x="500" y="36" font-size="20" font-weight="600" text-anchor="middle" fill="#1f2933">The RDP connection: TCP through the gateway, and UDP RDP Shortpath</text>
  <rect x="330" y="80" width="640" height="470" rx="8" fill="#f7f9fc" stroke="#5f6b7a" stroke-width="1.6"/>
  <text x="650" y="104" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Region 1</text>
  <rect x="24" y="270" width="130" height="90" rx="6" fill="#ffffff" stroke="#3c8d40" stroke-width="1.2"/>
  <text x="89.0" y="310.4" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933"></text>
  <text x="89.0" y="329.4" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Client</text>
  <image x="69" y="282" width="40" height="40" href="data:image/svg+xml;base64,"/>
  <rect x="190" y="255" width="120" height="110" rx="6" fill="#ffffff" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="250.0" y="295.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933"></text>
  <text x="250.0" y="314.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Azure Front</text>
  <text x="250.0" y="333.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Door</text>
  <image x="230" y="265" width="40" height="40" href="data:image/svg+xml;base64,"/>
  <line x1="154" y1="315" x2="190" y2="315" stroke="#1f2933" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="190" y1="315" x2="154" y2="315" stroke="#1f2933" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="390" y="430" width="120" height="80" rx="6" fill="#ffffff" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="450.0" y="465.4" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Gateway</text>
  <text x="450.0" y="484.4" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">service</text>
  <rect x="560" y="430" width="130" height="80" rx="6" fill="#ffffff" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="625.0" y="474.9" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Broker service</text>
  <rect x="800" y="430" width="140" height="80" rx="8" fill="#ffffff" stroke="#3c8d40" stroke-width="1.6"/>
  <image x="808" y="440" width="28" height="28" href="data:image/svg+xml;base64,"/>
  <text x="870" y="485" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Session host</text>
  <line x1="310" y1="315" x2="330" y2="315" stroke="#1f2933" stroke-width="2.5"/>
  <line x1="330" y1="315" x2="330" y2="470" stroke="#1f2933" stroke-width="2.5"/>
  <line x1="330" y1="470" x2="390" y2="470" stroke="#1f2933" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="390" y1="470" x2="330" y2="470" stroke="#1f2933" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="320" y="390" font-size="13" font-weight="600" text-anchor="end" fill="#1f2933">TCP</text>
  <line x1="510" y1="470" x2="560" y2="470" stroke="#1f2933" stroke-width="2.5" stroke-dasharray="3,4" marker-end="url(#arr)"/>
  <line x1="560" y1="470" x2="510" y2="470" stroke="#1f2933" stroke-width="2.5" stroke-dasharray="3,4" marker-end="url(#arr)"/>
  <line x1="690" y1="470" x2="800" y2="470" stroke="#1f2933" stroke-width="2.5" stroke-dasharray="3,4" marker-end="url(#arr)"/>
  <line x1="800" y1="470" x2="690" y2="470" stroke="#1f2933" stroke-width="2.5" stroke-dasharray="3,4" marker-end="url(#arr)"/>
  <line x1="450" y1="430" x2="450" y2="395" stroke="#1f2933" stroke-width="2.5"/>
  <line x1="450" y1="395" x2="870" y2="395" stroke="#1f2933" stroke-width="2.5"/>
  <line x1="870" y1="395" x2="870" y2="430" stroke="#1f2933" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="450" y1="395" x2="450" y2="430" stroke="#1f2933" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="640" y="385" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2933">TCP</text>
  <rect x="540" y="130" width="200" height="80" rx="8" fill="#ffffff" stroke="#7a3fa0" stroke-width="1.6"/>
  <text x="640" y="165" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">RDP Shortpath</text>
  <text x="640" y="185" font-size="13" text-anchor="middle" fill="#1f2933">managed networks</text>
  <rect x="540" y="255" width="200" height="80" rx="8" fill="#ffffff" stroke="#7a3fa0" stroke-width="1.6"/>
  <text x="640" y="290" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">RDP Shortpath</text>
  <text x="640" y="310" font-size="13" text-anchor="middle" fill="#1f2933">public networks</text>
  <line x1="89" y1="270" x2="89" y2="170" stroke="#7a3fa0" stroke-width="3"/>
  <line x1="89" y1="170" x2="540" y2="170" stroke="#7a3fa0" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="440" y1="170" x2="440" y2="295" stroke="#7a3fa0" stroke-width="3"/>
  <line x1="440" y1="295" x2="540" y2="295" stroke="#7a3fa0" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="89" y1="170" x2="89" y2="270" stroke="#7a3fa0" stroke-width="3" marker-end="url(#arr)"/>
  <text x="110" y="158" font-size="13" font-weight="600" text-anchor="start" fill="#7a3fa0">UDP</text>
  <line x1="870" y1="430" x2="870" y2="232" stroke="#7a3fa0" stroke-width="3"/>
  <line x1="870" y1="232" x2="740" y2="170" stroke="#7a3fa0" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="870" y1="232" x2="740" y2="295" stroke="#7a3fa0" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="870" y1="395" x2="870" y2="430" stroke="#7a3fa0" stroke-width="3" marker-end="url(#arr)"/>
  <text x="880" y="330" font-size="13" font-weight="600" text-anchor="start" fill="#7a3fa0">UDP</text>
  <rect x="15" y="565" width="970" height="62" rx="6" fill="#ffffff" stroke="#c2570c" stroke-width="1.4"/>
  <text x="28" y="586" font-size="13" text-anchor="start" fill="#1f2933">Flagged: Learn draws the client UDP line toward the Shortpath boxes and the session host, with no direct client-to-host</text>
  <text x="28" y="606" font-size="13" text-anchor="start" fill="#1f2933">line, while its text says Shortpath is a direct UDP transport that bypasses the gateway service. Not resolved here.</text>
</svg>
