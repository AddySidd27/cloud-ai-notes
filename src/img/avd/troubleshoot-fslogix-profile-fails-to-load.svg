<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 852" width="1100" height="852" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">Decision tree: FSLogix profile does not load or is temporary</title><desc id="d">The first question is whether FSLogix profile containers are enabled and VHDLocations is set; if not, turn them on. If yes, the tree asks in turn about Access is denied in the profile log, a locked container, reaching the share over SMB, a full container or storage, and an empty profile that is not a temporary one, and ends with collecting logs for a support case.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="6" y="6" width="1088" height="840" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
<rect x="50" y="40" width="420" height="64" rx="8" fill="#eaf2fb" stroke="#5b8fc9" stroke-width="1.5"/>
<text x="260.0" y="67" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">FSLogix enabled and VHDLocations set?</text>
<text x="260.0" y="87" font-size="12" text-anchor="middle" fill="#1f2933">Registry: Enabled = 1, location present</text>
<rect x="620" y="30" width="430" height="84" rx="8" fill="#ffffff" stroke="#e6b866" stroke-width="1.5"/>
<text x="835.0" y="54" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Turn it on and set the location</text>
<text x="835.0" y="76" font-size="12" text-anchor="middle" fill="#1f2933">Enabled = 1; VHDLocations or CCDLocations</text>
<text x="835.0" y="94" font-size="12" text-anchor="middle" fill="#1f2933">Source: Old, temporary or local profiles</text>
<line x1="472" y1="72.0" x2="618" y2="72.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="545.0" y="64.0" font-size="13" font-weight="600" text-anchor="middle" fill="#b02a2a">No</text>
<line x1="260.0" y1="106" x2="260.0" y2="156" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="268.0" y="128" font-size="13" font-weight="600" text-anchor="start" fill="#3c7a50">Yes</text>
<rect x="50" y="158" width="420" height="64" rx="8" fill="#eaf2fb" stroke="#5b8fc9" stroke-width="1.5"/>
<text x="260.0" y="185" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Profile log: Access is denied (error 5)?</text>
<text x="260.0" y="205" font-size="12" text-anchor="middle" fill="#1f2933">[ERROR:00000005] on the LoadProfile line</text>
<rect x="620" y="148" width="430" height="84" rx="8" fill="#ffffff" stroke="#e6b866" stroke-width="1.5"/>
<text x="835.0" y="172" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Fix storage permissions</text>
<text x="835.0" y="194" font-size="12" text-anchor="middle" fill="#1f2933">NTFS ACLs, share-level permissions, Azure RBAC</text>
<text x="835.0" y="212" font-size="12" text-anchor="middle" fill="#1f2933">Source: Configure SMB storage permissions</text>
<line x1="472" y1="190.0" x2="618" y2="190.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="545.0" y="182.0" font-size="13" font-weight="600" text-anchor="middle" fill="#3c7a50">Yes</text>
<line x1="260.0" y1="224" x2="260.0" y2="274" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="268.0" y="246" font-size="13" font-weight="600" text-anchor="start" fill="#b02a2a">No</text>
<rect x="50" y="276" width="420" height="64" rx="8" fill="#eaf2fb" stroke="#5b8fc9" stroke-width="1.5"/>
<text x="260.0" y="303" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Profile log: container locked (a7, error 33)?</text>
<text x="260.0" y="323" font-size="12" text-anchor="middle" fill="#1f2933">Another session holds the container</text>
<rect x="620" y="266" width="430" height="84" rx="8" fill="#ffffff" stroke="#e6b866" stroke-width="1.5"/>
<text x="835.0" y="290" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Sign out the other session or choose the lock behavior</text>
<text x="835.0" y="312" font-size="12" text-anchor="middle" fill="#1f2933">PreventLoginWithTempProfile or concurrent connections</text>
<text x="835.0" y="330" font-size="12" text-anchor="middle" fill="#1f2933">Source: Old, temporary or local profiles</text>
<line x1="472" y1="308.0" x2="618" y2="308.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="545.0" y="300.0" font-size="13" font-weight="600" text-anchor="middle" fill="#3c7a50">Yes</text>
<line x1="260.0" y1="342" x2="260.0" y2="392" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="268.0" y="364" font-size="13" font-weight="600" text-anchor="start" fill="#b02a2a">No</text>
<rect x="50" y="394" width="420" height="64" rx="8" fill="#eaf2fb" stroke="#5b8fc9" stroke-width="1.5"/>
<text x="260.0" y="421" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Can the host reach the share on SMB?</text>
<text x="260.0" y="441" font-size="12" text-anchor="middle" fill="#1f2933">Test-NetConnection -CommonTCPPort SMB</text>
<rect x="620" y="384" width="430" height="84" rx="8" fill="#ffffff" stroke="#e6b866" stroke-width="1.5"/>
<text x="835.0" y="408" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Fix name resolution, network or firewall</text>
<text x="835.0" y="430" font-size="12" text-anchor="middle" fill="#1f2933">Also check IPS and antivirus exclusions</text>
<text x="835.0" y="448" font-size="12" text-anchor="middle" fill="#1f2933">Source: Container attach or detach</text>
<line x1="472" y1="426.0" x2="618" y2="426.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="545.0" y="418.0" font-size="13" font-weight="600" text-anchor="middle" fill="#b02a2a">No</text>
<line x1="260.0" y1="460" x2="260.0" y2="510" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="268.0" y="482" font-size="13" font-weight="600" text-anchor="start" fill="#3c7a50">Yes</text>
<rect x="50" y="512" width="420" height="64" rx="8" fill="#eaf2fb" stroke="#5b8fc9" stroke-width="1.5"/>
<text x="260.0" y="539" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Is the container or the storage full?</text>
<text x="260.0" y="559" font-size="12" text-anchor="middle" fill="#1f2933">Needs more than 200 MB free to attach</text>
<rect x="620" y="502" width="430" height="84" rx="8" fill="#ffffff" stroke="#e6b866" stroke-width="1.5"/>
<text x="835.0" y="526" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Raise SizeInMBs or add storage capacity</text>
<text x="835.0" y="548" font-size="12" text-anchor="middle" fill="#1f2933">You can raise SizeInMBs but not lower it</text>
<text x="835.0" y="566" font-size="12" text-anchor="middle" fill="#1f2933">Source: Container attach or detach</text>
<line x1="472" y1="544.0" x2="618" y2="544.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="545.0" y="536.0" font-size="13" font-weight="600" text-anchor="middle" fill="#3c7a50">Yes</text>
<line x1="260.0" y1="578" x2="260.0" y2="628" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="268.0" y="600" font-size="13" font-weight="600" text-anchor="start" fill="#b02a2a">No</text>
<rect x="50" y="630" width="420" height="64" rx="8" fill="#eaf2fb" stroke="#5b8fc9" stroke-width="1.5"/>
<text x="260.0" y="657" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Empty profile, but not a temporary one?</text>
<text x="260.0" y="677" font-size="12" text-anchor="middle" fill="#1f2933">Folder under C:\Users has the normal name</text>
<rect x="620" y="620" width="430" height="84" rx="8" fill="#ffffff" stroke="#e6b866" stroke-width="1.5"/>
<text x="835.0" y="644" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Check for an old local profile or a changed name setting</text>
<text x="835.0" y="666" font-size="12" text-anchor="middle" fill="#1f2933">DeleteLocalProfileWhenVHDShouldApply, folder-name settings</text>
<text x="835.0" y="684" font-size="12" text-anchor="middle" fill="#1f2933">Source: Old, temporary or local profiles</text>
<line x1="472" y1="662.0" x2="618" y2="662.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="545.0" y="654.0" font-size="13" font-weight="600" text-anchor="middle" fill="#3c7a50">Yes</text>
<line x1="260.0" y1="696" x2="260.0" y2="736" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="268.0" y="718" font-size="13" font-weight="600" text-anchor="start" fill="#b02a2a">No</text>
<rect x="50" y="738" width="420" height="84" rx="8" fill="#ffffff" stroke="#e6b866" stroke-width="1.5"/>
<text x="260.0" y="762" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Still failing: collect logs, open a support case</text>
<text x="260.0" y="784" font-size="12" text-anchor="middle" fill="#1f2933">Use the FSLogix Support Tool to gather the logs</text>
<text x="260.0" y="802" font-size="12" text-anchor="middle" fill="#1f2933">Source: Logging and diagnostics</text>
</svg>