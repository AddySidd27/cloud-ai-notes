<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 980 630" width="980" height="630" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">Migration plan from another virtual desktop platform to Azure Virtual Desktop</title><desc id="d">A source platform, on premises or in another cloud, feeds an assessment step. Then five steps in order: plan migration, prepare workloads, execute migration, optimize in cloud, decommission source. The rollback plan is defined in the planning step, before the first move. The five steps lead to Azure Virtual Desktop.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="6" y="6" width="968" height="618" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
<rect x="30" y="40" width="200" height="88" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="130.0" y="68" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Source platform</text>
<text x="130.0" y="92" font-size="14" text-anchor="middle" fill="#1f2933">On premises or</text>
<text x="130.0" y="112" font-size="14" text-anchor="middle" fill="#1f2933">other cloud</text>
<rect x="280" y="40" width="400" height="88" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="480.0" y="68" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Assess first</text>
<text x="480.0" y="92" font-size="14" text-anchor="middle" fill="#1f2933">Inventory workloads and dependencies.</text>
<text x="480.0" y="112" font-size="14" text-anchor="middle" fill="#1f2933">Record baseline metrics and risks.</text>
<rect x="280" y="144" width="400" height="88" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="480.0" y="172" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">1  Plan migration</text>
<text x="480.0" y="196" font-size="14" text-anchor="middle" fill="#1f2933">Order the waves, choose the method.</text>
<text x="480.0" y="216" font-size="14" text-anchor="middle" fill="#1f2933">Define rollback. Get approval.</text>
<rect x="280" y="248" width="400" height="88" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="480.0" y="276" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">2  Prepare workloads</text>
<text x="480.0" y="300" font-size="14" text-anchor="middle" fill="#1f2933">Fix blockers from the assessment.</text>
<rect x="280" y="352" width="400" height="56" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="480.0" y="386" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">3  Execute migration</text>
<rect x="280" y="432" width="400" height="56" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="480.0" y="466" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">4  Optimize in cloud</text>
<rect x="280" y="512" width="400" height="56" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="480.0" y="546" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">5  Decommission source</text>
<line x1="230" y1="84" x2="280" y2="84" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="480.0" y1="128" x2="480.0" y2="144" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="480.0" y1="232" x2="480.0" y2="248" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="480.0" y1="336" x2="480.0" y2="352" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="480.0" y1="408" x2="480.0" y2="432" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="480.0" y1="488" x2="480.0" y2="512" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="30" y="230" width="200" height="124" rx="8" fill="#fff7ec" stroke="#e0a458" stroke-width="1.5"/>
<text x="130.0" y="258" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Rollback plan</text>
<text x="130.0" y="282" font-size="14" text-anchor="middle" fill="#1f2933">Failed deployment defined</text>
<text x="130.0" y="302" font-size="14" text-anchor="middle" fill="#1f2933">Trigger conditions set</text>
<text x="130.0" y="322" font-size="14" text-anchor="middle" fill="#1f2933">Steps tested</text>
<polyline points="280,188 130,188 130,230" fill="none" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="740" y="485" width="210" height="110" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="845.0" y="553" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Azure Virtual Desktop</text>
<text x="845.0" y="577" font-size="14" text-anchor="middle" fill="#1f2933">Target platform</text>
<image x="829" y="495" width="32" height="32" href="data:image/svg+xml;base64,"/>
<line x1="680" y1="540" x2="740" y2="540" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
</svg>