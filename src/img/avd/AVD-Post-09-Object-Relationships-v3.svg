<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="1000" height="820" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">How host pools, application groups and workspaces relate</title>
  <desc id="d">Original diagram. A workspace at the top lists three application groups: one desktop application group and two RemoteApp application groups. Each application group belongs to exactly one host pool, and here all three belong to one pooled host pool, which contains session hosts. Users and groups from Microsoft Entra ID are assigned to the application groups through the Desktop Virtualization User role. A panel at the bottom lists the rules: an application group has one host pool and one workspace; a host pool has at most one desktop application group and several RemoteApp application groups; RemoteApp application groups need a pooled host pool; objects in a workspace share a deployment scope and location.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/></marker></defs>
  <rect x="6" y="6" width="988" height="808" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
  <text x="500" y="36" font-size="20" font-weight="600" text-anchor="middle" fill="#1f2933">Relationships between the AVD objects</text>
  <rect x="24" y="230" width="190" height="150" rx="8" fill="#f5f5f5" stroke="#5f6b7a" stroke-width="1.5"/>
  <image x="97" y="240" width="44" height="44" href="data:image/svg+xml;base64,"/>
  <text x="119" y="306" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Microsoft Entra ID</text>
  <text x="119" y="326" font-size="14" text-anchor="middle" fill="#1f2933">users and user groups</text>
  <rect x="300" y="70" width="560" height="90" rx="8" fill="#fdf6ec" stroke="#c2570c" stroke-width="1.8"/>
  <text x="580" y="105" font-size="17" font-weight="600" text-anchor="middle" fill="#1f2933">Workspace</text>
  <text x="580" y="133" font-size="14" text-anchor="middle" fill="#1f2933">What users see in their client: a list of application groups</text>
  <rect x="300" y="250" width="170" height="76" rx="6" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="385.0" y="283.4" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Desktop</text>
  <text x="385.0" y="302.4" font-size="14" text-anchor="middle" fill="#1f2933">application group</text>
  <line x1="385" y1="160" x2="385" y2="250" stroke="#c2570c" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="480" y="250" width="170" height="76" rx="6" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="565.0" y="283.4" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">RemoteApp</text>
  <text x="565.0" y="302.4" font-size="14" text-anchor="middle" fill="#1f2933">application group A</text>
  <line x1="565" y1="160" x2="565" y2="250" stroke="#c2570c" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="660" y="250" width="170" height="76" rx="6" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="745.0" y="283.4" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">RemoteApp</text>
  <text x="745.0" y="302.4" font-size="14" text-anchor="middle" fill="#1f2933">application group B</text>
  <line x1="745" y1="160" x2="745" y2="250" stroke="#c2570c" stroke-width="3" marker-end="url(#arr)"/>
  <text x="398" y="207" font-size="14" text-anchor="start" fill="#c2570c">listed in one workspace</text>
  <line x1="214" y1="288" x2="300" y2="288" stroke="#6b4fa0" stroke-width="3" marker-end="url(#arr)"/>
  <text x="257" y="270" font-size="14" font-weight="600" text-anchor="middle" fill="#6b4fa0">Assigned</text>
  <text x="24" y="405" font-size="14" text-anchor="start" fill="#1f2933">Assignment is on each application group,</text>
  <text x="24" y="424" font-size="14" text-anchor="start" fill="#1f2933">not on the host pool. Role: Desktop</text>
  <text x="24" y="443" font-size="14" text-anchor="start" fill="#1f2933">Virtualization User.</text>
  <rect x="300" y="400" width="530" height="84" rx="8" fill="#eef6ee" stroke="#3c8d40" stroke-width="1.8"/>
  <text x="565" y="435" font-size="17" font-weight="600" text-anchor="middle" fill="#1f2933">Host pool (pooled)</text>
  <text x="565" y="462" font-size="14" text-anchor="middle" fill="#1f2933">A collection of session hosts that should share one image</text>
  <line x1="385" y1="326" x2="385" y2="400" stroke="#3c8d40" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="565" y1="326" x2="565" y2="400" stroke="#3c8d40" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="745" y1="326" x2="745" y2="400" stroke="#3c8d40" stroke-width="3" marker-end="url(#arr)"/>
  <text x="397" y="356" font-size="14" text-anchor="start" fill="#3c8d40">one host pool per</text>
  <text x="397" y="375" font-size="14" text-anchor="start" fill="#3c8d40">application group</text>
  <image x="410" y="520" width="40" height="40" href="data:image/svg+xml;base64,"/>
  <text x="430" y="584" font-size="14" text-anchor="middle" fill="#1f2933">Session host</text>
  <line x1="430" y1="484" x2="430" y2="518" stroke="#3c8d40" stroke-width="3" marker-end="url(#arr)"/>
  <image x="560" y="520" width="40" height="40" href="data:image/svg+xml;base64,"/>
  <text x="580" y="584" font-size="14" text-anchor="middle" fill="#1f2933">Session host</text>
  <line x1="580" y1="484" x2="580" y2="518" stroke="#3c8d40" stroke-width="3" marker-end="url(#arr)"/>
  <image x="710" y="520" width="40" height="40" href="data:image/svg+xml;base64,"/>
  <text x="730" y="584" font-size="14" text-anchor="middle" fill="#1f2933">Session host</text>
  <line x1="730" y1="484" x2="730" y2="518" stroke="#3c8d40" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="24" y="620" width="952" height="180" rx="6" fill="#ffffff" stroke="#5f6b7a" stroke-width="1.2"/>
  <text x="40" y="648" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Rules</text>
  <rect x="40" y="662" width="26" height="26" rx="13" fill="#3b6fb6" stroke="#3b6fb6" stroke-width="1"/>
  <text x="53" y="681" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">1</text>
  <text x="76" y="681" font-size="14" text-anchor="start" fill="#1f2933">An application group belongs to one host pool and can be in one workspace.</text>
  <rect x="40" y="695" width="26" height="26" rx="13" fill="#3b6fb6" stroke="#3b6fb6" stroke-width="1"/>
  <text x="53" y="714" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">2</text>
  <text x="76" y="714" font-size="14" text-anchor="start" fill="#1f2933">A pooled host pool has one desktop application group and can have several RemoteApp application groups.</text>
  <rect x="40" y="728" width="26" height="26" rx="13" fill="#3b6fb6" stroke="#3b6fb6" stroke-width="1"/>
  <text x="53" y="747" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">3</text>
  <text x="76" y="747" font-size="14" text-anchor="start" fill="#1f2933">RemoteApp application groups need a pooled host pool. Desktop groups work with pooled or personal.</text>
  <rect x="40" y="761" width="26" height="26" rx="13" fill="#3b6fb6" stroke="#3b6fb6" stroke-width="1"/>
  <text x="53" y="780" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">4</text>
  <text x="76" y="780" font-size="14" text-anchor="start" fill="#1f2933">A workspace only holds application groups with the same deployment scope and the same location.</text>
</svg>
