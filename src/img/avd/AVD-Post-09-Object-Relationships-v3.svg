<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="1000" height="820" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">How host pools, application groups and workspaces relate</title>
  <desc id="d">Diagram. A workspace at the top lists three application groups: one desktop application group and two RemoteApp application groups. Each application group belongs to exactly one host pool, and here all three belong to one pooled host pool, which contains session hosts. Users and groups from Microsoft Entra ID are assigned to each application group through the Desktop Virtualization User role. A panel at the bottom lists the rules: an application group has one host pool and one workspace; a host pool has at most one desktop application group and several RemoteApp application groups; RemoteApp application groups need a pooled host pool; a workspace only holds application groups with the same deployment scope and location.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
  <rect x="6" y="6" width="988" height="808" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
  <text x="500" y="36" font-size="20" font-weight="600" text-anchor="middle" fill="#1f2933">Relationships between the AVD objects</text>
  <rect x="340" y="70" width="560" height="90" rx="8" fill="#fdf6ec" stroke="#c2570c" stroke-width="1.8"/>
  <text x="620" y="105" font-size="17" font-weight="600" text-anchor="middle" fill="#1f2933">Workspace</text>
  <text x="620" y="133" font-size="14" text-anchor="middle" fill="#1f2933">What users see in their client: a list of application groups</text>
  <rect x="330" y="240" width="550" height="96" rx="8" fill="none" stroke="#6b4fa0" stroke-width="2" stroke-dasharray="8 5"/>
  <rect x="340" y="250" width="170" height="76" rx="6" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="425" y="283.4" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Desktop</text>
  <text x="425" y="302.4" font-size="14" text-anchor="middle" fill="#1f2933">application group</text>
  <polyline points="425,160 425,250" fill="none" stroke="#c2570c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
  <polyline points="425,326 425,400" fill="none" stroke="#3c8d40" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
  <rect x="520" y="250" width="170" height="76" rx="6" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="605" y="283.4" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">RemoteApp</text>
  <text x="605" y="302.4" font-size="14" text-anchor="middle" fill="#1f2933">application group A</text>
  <polyline points="605,160 605,250" fill="none" stroke="#c2570c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
  <polyline points="605,326 605,400" fill="none" stroke="#3c8d40" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
  <rect x="700" y="250" width="170" height="76" rx="6" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="1.2"/>
  <text x="785" y="283.4" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">RemoteApp</text>
  <text x="785" y="302.4" font-size="14" text-anchor="middle" fill="#1f2933">application group B</text>
  <polyline points="785,160 785,250" fill="none" stroke="#c2570c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
  <polyline points="785,326 785,400" fill="none" stroke="#3c8d40" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
  <text x="515" y="207" font-size="14" text-anchor="middle" fill="#c2570c">listed in one workspace</text>
  <text x="515" y="359" font-size="14" text-anchor="middle" fill="#3c8d40">one host pool per</text>
  <text x="515" y="378" font-size="14" text-anchor="middle" fill="#3c8d40">application group</text>
  <rect x="24" y="186" width="160" height="214" rx="8" fill="#f5f5f5" stroke="#5f6b7a" stroke-width="1.5"/>
  <image x="82" y="196" width="44" height="44" href="data:image/svg+xml;base64,"/>
  <text x="104" y="264" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Microsoft Entra ID</text>
  <text x="104" y="284" font-size="14" text-anchor="middle" fill="#1f2933">users and user groups</text>
  <text x="104" y="316" font-size="14" text-anchor="middle" fill="#1f2933">Assignment is on each</text>
  <text x="104" y="333" font-size="14" text-anchor="middle" fill="#1f2933">application group, not</text>
  <text x="104" y="350" font-size="14" text-anchor="middle" fill="#1f2933">on the host pool.</text>
  <text x="104" y="367" font-size="14" text-anchor="middle" fill="#1f2933">Role: Desktop</text>
  <text x="104" y="384" font-size="14" text-anchor="middle" fill="#1f2933">Virtualization User.</text>
  <polyline points="184,288 330,288" fill="none" stroke="#6b4fa0" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
  <text x="257" y="254" font-size="14" font-weight="600" text-anchor="middle" fill="#6b4fa0">Assigned to each</text>
  <text x="257" y="271" font-size="14" font-weight="600" text-anchor="middle" fill="#6b4fa0">application group</text>
  <rect x="340" y="400" width="530" height="84" rx="8" fill="#eef6ee" stroke="#3c8d40" stroke-width="1.8"/>
  <text x="605" y="435" font-size="17" font-weight="600" text-anchor="middle" fill="#1f2933">Host pool (pooled)</text>
  <text x="605" y="462" font-size="14" text-anchor="middle" fill="#1f2933">A collection of session hosts that should share one image</text>
  <image x="450" y="520" width="40" height="40" href="data:image/svg+xml;base64,"/>
  <text x="470" y="584" font-size="14" text-anchor="middle" fill="#1f2933">Session host</text>
  <polyline points="470,484 470,518" fill="none" stroke="#3c8d40" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
  <image x="600" y="520" width="40" height="40" href="data:image/svg+xml;base64,"/>
  <text x="620" y="584" font-size="14" text-anchor="middle" fill="#1f2933">Session host</text>
  <polyline points="620,484 620,518" fill="none" stroke="#3c8d40" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
  <image x="750" y="520" width="40" height="40" href="data:image/svg+xml;base64,"/>
  <text x="770" y="584" font-size="14" text-anchor="middle" fill="#1f2933">Session host</text>
  <polyline points="770,484 770,518" fill="none" stroke="#3c8d40" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arr)"/>
  <rect x="24" y="620" width="952" height="180" rx="6" fill="#ffffff" stroke="#5f6b7a" stroke-width="1.2"/>
  <text x="40" y="648" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Rules</text>
  <rect x="40" y="662" width="26" height="26" rx="13" fill="#3b6fb6" stroke="#3b6fb6" stroke-width="1"/>
  <text x="53" y="681" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">1</text>
  <text x="76" y="681" font-size="14" text-anchor="start" fill="#1f2933">Each application group belongs to one host pool and is listed in one workspace.</text>
  <rect x="40" y="695" width="26" height="26" rx="13" fill="#3b6fb6" stroke="#3b6fb6" stroke-width="1"/>
  <text x="53" y="714" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">2</text>
  <text x="76" y="714" font-size="14" text-anchor="start" fill="#1f2933">A pooled host pool has one desktop application group and can have several RemoteApp application groups.</text>
  <rect x="40" y="728" width="26" height="26" rx="13" fill="#3b6fb6" stroke="#3b6fb6" stroke-width="1"/>
  <text x="53" y="747" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">3</text>
  <text x="76" y="747" font-size="14" text-anchor="start" fill="#1f2933">RemoteApp application groups need a pooled host pool. Desktop groups work with pooled or personal.</text>
  <rect x="40" y="761" width="26" height="26" rx="13" fill="#3b6fb6" stroke="#3b6fb6" stroke-width="1"/>
  <text x="53" y="780" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">4</text>
  <text x="76" y="780" font-size="14" text-anchor="start" fill="#1f2933">A workspace only holds application groups with the same deployment scope and location as the workspace.</text>
</svg>
