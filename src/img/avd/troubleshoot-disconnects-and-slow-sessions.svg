<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 1125" width="1100" height="1125" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">Decision tree for AVD disconnects and slow sessions</title><desc id="d">The first question is whether the problem affects one user or many users. If many, check Azure Service Health and group the data in Insights; if one, ask in turn whether it happens only at sign-in, whether round-trip time is high, whether the host is busy, whether the session is on TCP when UDP was expected, and whether errors name a Shortpath, client or server disconnect, and each yes leads to one action.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="6" y="6" width="1088" height="1113" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
<rect x="24" y="24" width="1052" height="1077" rx="8" fill="#ffffff" stroke="#6c7a89" stroke-width="1.8"/>
<rect x="100.0" y="44" width="340" height="46" rx="8" fill="#e8f0fa" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="270.0" y="72.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Session drops, lags or is slow</text>
<line x1="270" y1="90" x2="270" y2="117.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<polygon points="270,119.0 450.0,168 270,217.0 90.0,168" fill="#eef4fb" stroke="#9bbbe0" stroke-width="1.8"/>
<text x="270" y="163.5" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1f2933">Does it affect one user</text>
<text x="270" y="182.5" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1f2933">or many users?</text>
<line x1="452.0" y1="168" x2="518" y2="168" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="485.0" y="160" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2933">Many</text>
<rect x="520" y="129.0" width="520" height="78" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="780.0" y="155.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1f2933">Check Azure status and Service Health first</text>
<text x="780.0" y="177.0" font-size="12.5" text-anchor="middle" fill="#1f2933">Then group by gateway region, host and client in Insights</text>
<text x="780.0" y="227.0" font-size="11" text-anchor="middle" fill="#5f6b7a">Source: Troubleshooting overview; Insights use cases</text>
<line x1="270" y1="219.0" x2="270" y2="257.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="323.0" y="237.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2933">One</text>
<polygon points="270,259.0 450.0,308 270,357.0 90.0,308" fill="#eef4fb" stroke="#9bbbe0" stroke-width="1.8"/>
<text x="270" y="303.5" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1f2933">Does it happen only</text>
<text x="270" y="322.5" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1f2933">while signing in?</text>
<line x1="452.0" y1="308" x2="518" y2="308" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="485.0" y="300" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2933">Yes</text>
<rect x="520" y="269.0" width="520" height="78" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="780.0" y="295.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1f2933">Slow sign-in: read the time to connect parts</text>
<text x="780.0" y="317.0" font-size="12.5" text-anchor="middle" fill="#1f2933">Route, stack connected, logon (profile, policies, FSLogix), shell</text>
<text x="780.0" y="367.0" font-size="11" text-anchor="middle" fill="#5f6b7a">Source: Insights glossary</text>
<line x1="270" y1="359.0" x2="270" y2="397.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="323.0" y="377.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2933">No</text>
<polygon points="270,399.0 450.0,448 270,497.0 90.0,448" fill="#eef4fb" stroke="#9bbbe0" stroke-width="1.8"/>
<text x="270" y="453.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1f2933">Is round-trip time high?</text>
<line x1="452.0" y1="448" x2="518" y2="448" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="485.0" y="440" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2933">Yes</text>
<rect x="520" y="409.0" width="520" height="78" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="780.0" y="435.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1f2933">Network path: move hosts closer, check the path</text>
<text x="780.0" y="457.0" font-size="12.5" text-anchor="middle" fill="#1f2933">Firewall, ExpressRoute, proxy, SSL inspection, saturated link</text>
<text x="780.0" y="507.0" font-size="11" text-anchor="middle" fill="#5f6b7a">Source: Troubleshoot connection quality; Proxy server guidelines</text>
<line x1="270" y1="499.0" x2="270" y2="537.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="323.0" y="517.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2933">No</text>
<polygon points="270,539.0 450.0,588 270,637.0 90.0,588" fill="#eef4fb" stroke="#9bbbe0" stroke-width="1.8"/>
<text x="270" y="583.5" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1f2933">Is input delay, CPU or memory</text>
<text x="270" y="602.5" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1f2933">high on the session host?</text>
<line x1="452.0" y1="588" x2="518" y2="588" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="485.0" y="580" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2933">Yes</text>
<rect x="520" y="549.0" width="520" height="78" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="780.0" y="575.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1f2933">Host is too busy: fewer sessions or a larger VM</text>
<text x="780.0" y="597.0" font-size="12.5" text-anchor="middle" fill="#1f2933">Look at CPU, memory, disk and input delay for the same period</text>
<text x="780.0" y="647.0" font-size="11" text-anchor="middle" fill="#5f6b7a">Source: Insights use cases; Troubleshoot connection quality</text>
<line x1="270" y1="639.0" x2="270" y2="677.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="323.0" y="657.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2933">No</text>
<polygon points="270,679.0 450.0,728 270,777.0 90.0,728" fill="#eef4fb" stroke="#9bbbe0" stroke-width="1.8"/>
<text x="270" y="723.5" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1f2933">Is the session on TCP when</text>
<text x="270" y="742.5" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1f2933">UDP was expected?</text>
<line x1="452.0" y1="728" x2="518" y2="728" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="485.0" y="720" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2933">Yes</text>
<rect x="520" y="689.0" width="520" height="78" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="780.0" y="715.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1f2933">Run avdnettest.exe, then allow UDP</text>
<text x="780.0" y="737.0" font-size="12.5" text-anchor="middle" fill="#1f2933">Avoid force tunnel, double NAT, TCP-based VPN, packet inspection</text>
<text x="780.0" y="787.0" font-size="11" text-anchor="middle" fill="#5f6b7a">Source: Troubleshoot RDP Shortpath; RDP Shortpath</text>
<line x1="270" y1="779.0" x2="270" y2="817.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="323.0" y="797.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2933">No</text>
<polygon points="270,819.0 450.0,868 270,917.0 90.0,868" fill="#eef4fb" stroke="#9bbbe0" stroke-width="1.8"/>
<text x="270" y="863.5" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1f2933">Do errors name a Shortpath,</text>
<text x="270" y="882.5" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1f2933">client or server disconnect?</text>
<line x1="452.0" y1="868" x2="518" y2="868" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="485.0" y="860" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2933">Yes</text>
<rect x="520" y="829.0" width="520" height="78" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="780.0" y="855.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1f2933">Shortpath names: the UDP path dropped</text>
<text x="780.0" y="877.0" font-size="12.5" text-anchor="middle" fill="#1f2933">Client or server disconnect names: usually a TCP reset</text>
<text x="780.0" y="927.0" font-size="11" text-anchor="middle" fill="#5f6b7a">Source: Troubleshoot RDP Shortpath</text>
<line x1="270" y1="919.0" x2="270" y2="964" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="323.0" y="937.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2933">No</text>
<rect x="40" y="967.0" width="460" height="78" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="270.0" y="993.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1f2933">Collect the CorrelationId, open a support request</text>
<text x="270.0" y="1015.0" font-size="12.5" text-anchor="middle" fill="#1f2933">ServiceError true: escalate with the CorrelationId</text>
<text x="270.0" y="1065.0" font-size="11" text-anchor="middle" fill="#5f6b7a">Source: Log Analytics diagnostics; Troubleshooting overview</text>
</svg>