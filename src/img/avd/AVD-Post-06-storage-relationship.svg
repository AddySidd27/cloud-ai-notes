<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430"><rect width="1000" height="430" fill="white"/><style>text{font-family:DejaVu Sans, sans-serif;fill:#17324d;font-size:20px}.label{font-size:17px}</style><rect x="25" y="45" width="390" height="310" rx="12" fill="#edf5fc" stroke="#0078d4" stroke-width="2"/><text x="55" y="88">Session-host VM</text><rect x="55" y="125" width="330" height="115" rx="8" fill="white" stroke="#6b8eac"/><text x="80" y="160">Managed OS disk</text><text class="label" x="80" y="195">Windows + installed applications</text><text class="label" x="55" y="290">User signs in to Windows</text><text class="label" x="55" y="320">FSLogix attaches their profile</text><path d="M415 290 H535" fill="none" stroke="#0078d4" stroke-width="3"/><path d="M525 280 L540 290 L525 300" fill="none" stroke="#0078d4" stroke-width="3"/><rect x="550" y="125" width="425" height="230" rx="12" fill="#eef8f5" stroke="#287b66" stroke-width="2"/><text x="580" y="165">Shared profile storage</text><text class="label" x="580" y="200">Azure Files or Azure NetApp Files</text><rect x="580" y="225" width="365" height="90" rx="8" fill="white" stroke="#6c9c8e"/><text class="label" x="605" y="260">User's FSLogix container</text><text class="label" x="605" y="290">Profile settings and user data</text><text class="label" x="25" y="405">The shared profile location is separate from the VM's OS disk.</text></svg>