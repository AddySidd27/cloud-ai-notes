<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 925" width="1000" height="925" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">Azure Files with Microsoft Entra Kerberos: hybrid users</title>
  <desc id="d">Not an official Microsoft diagram. Domain controllers in on-premises Active Directory synchronize identities to Microsoft Entra ID. Numbered setup steps: 1 enable Microsoft Entra Kerberos on the storage account, 2 assign a share-level role, 3 set folder and file permissions from a device with connectivity to AD DS, 4 enable cloud Kerberos ticket retrieval on the session hosts. At sign-in, lettered steps: A the session host retrieves a cloud Kerberos ticket from Microsoft Entra ID, B the session host uses Kerberos tickets from Microsoft Entra ID to access the share over SMB. A final note says to exclude the storage account&#x27;s Entra app from MFA Conditional Access policies.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/></marker></defs>
  <rect x="6" y="6" width="988" height="913" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
  <text x="500" y="38" font-size="20" font-weight="600" text-anchor="middle" fill="#1f2933">Azure Files with Microsoft Entra Kerberos: hybrid users</text>
  <rect x="30" y="100" width="220" height="110" rx="8" fill="#f5f5f5" stroke="#5f6b7a" stroke-width="1.5"/>
  <text x="140" y="148" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Domain controllers</text>
  <text x="140" y="168" font-size="14" text-anchor="middle" fill="#1f2933">(on-premises AD DS)</text>
  <rect x="380" y="100" width="200" height="120" rx="8" fill="#e8f1fb" stroke="#3b6fb6" stroke-width="1.5"/>
  <image x="455" y="108" width="50" height="50" href="data:image/svg+xml;base64,"/>
  <text x="480" y="182" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Microsoft</text>
  <text x="480" y="201" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Entra ID</text>
  <line x1="250" y1="155" x2="380" y2="155" stroke="#5f6b7a" stroke-width="2.5" stroke-dasharray="3 4" marker-end="url(#arr)"/>
  <text x="315" y="118" font-size="14" text-anchor="middle" fill="#1f2933">Identity</text>
  <text x="315" y="135" font-size="14" text-anchor="middle" fill="#1f2933">sync</text>
  <rect x="730" y="400" width="240" height="130" rx="8" fill="#eef6ee" stroke="#3c8d40" stroke-width="1.5"/>
  <image x="830" y="408" width="44" height="44" href="data:image/svg+xml;base64,"/>
  <text x="850" y="478" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Azure Files share</text>
  <text x="850" y="497" font-size="14" text-anchor="middle" fill="#1f2933">(storage account)</text>
  <rect x="740" y="410" width="26" height="26" rx="13" fill="#3c8d40" stroke="#3c8d40" stroke-width="1"/>
  <text x="753" y="429" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">1</text>
  <rect x="740" y="442" width="26" height="26" rx="13" fill="#3c8d40" stroke="#3c8d40" stroke-width="1"/>
  <text x="753" y="461" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">2</text>
  <rect x="380" y="400" width="200" height="130" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="1.5"/>
  <image x="460" y="408" width="40" height="40" href="data:image/svg+xml;base64,"/>
  <text x="480" y="474" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Session hosts</text>
  <text x="480" y="493" font-size="14" text-anchor="middle" fill="#1f2933">(hybrid users)</text>
  <text x="480" y="512" font-size="13" text-anchor="middle" fill="#1f2933">Entra joined or hybrid joined</text>
  <rect x="390" y="410" width="26" height="26" rx="13" fill="#3b6fb6" stroke="#3b6fb6" stroke-width="1"/>
  <text x="403" y="429" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">4</text>
  <line x1="480" y1="400" x2="480" y2="220" stroke="#c2570c" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="494" y="290" width="26" height="26" rx="13" fill="#c2570c" stroke="#c2570c" stroke-width="1"/>
  <text x="507" y="309" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">A</text>
  <text x="528" y="303" font-size="14" text-anchor="start" fill="#1f2933">Gets a cloud Kerberos</text>
  <text x="528" y="321" font-size="14" text-anchor="start" fill="#1f2933">ticket at sign-in</text>
  <line x1="580" y1="465" x2="730" y2="465" stroke="#c2570c" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="595" y="420" width="26" height="26" rx="13" fill="#c2570c" stroke="#c2570c" stroke-width="1"/>
  <text x="608" y="439" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">B</text>
  <text x="594" y="495" font-size="14" text-anchor="start" fill="#1f2933">Uses the tickets</text>
  <text x="594" y="512" font-size="14" text-anchor="start" fill="#1f2933">to reach the share</text>
  <text x="594" y="529" font-size="14" text-anchor="start" fill="#1f2933">over SMB</text>
  <text x="480" y="560" font-size="14" text-anchor="middle" fill="#1f2933">Session hosts need no line of sight to AD DS</text>
  <rect x="30" y="590" width="220" height="110" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="1.5"/>
  <image x="120" y="596" width="36" height="36" href="data:image/svg+xml;base64,"/>
  <text x="140" y="656" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">Device used to set</text>
  <text x="140" y="675" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2933">folder permissions</text>
  <line x1="250" y1="645" x2="850" y2="645" stroke="#3b6fb6" stroke-width="3"/>
  <line x1="850" y1="645" x2="850" y2="532" stroke="#3b6fb6" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="262" y="604" width="26" height="26" rx="13" fill="#3b6fb6" stroke="#3b6fb6" stroke-width="1"/>
  <text x="275" y="623" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">3</text>
  <text x="298" y="622" font-size="14" text-anchor="start" fill="#1f2933">Sets folder and file permissions (ACLs)</text>
  <line x1="140" y1="590" x2="140" y2="212" stroke="#5f6b7a" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arr)"/>
  <text x="152" y="300" font-size="14" text-anchor="start" fill="#1f2933">Needs unimpeded network</text>
  <text x="152" y="318" font-size="14" text-anchor="start" fill="#1f2933">connectivity to AD DS</text>
  <rect x="20" y="720" width="960" height="190" rx="6" fill="#ffffff" stroke="#5f6b7a" stroke-width="1"/>
  <text x="36" y="746" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Setup steps (once) and sign-in steps (each time)</text>
  <text x="40" y="774" font-size="14" font-weight="600" text-anchor="start" fill="#3c8d40">1</text>
  <text x="64" y="774" font-size="14" text-anchor="start" fill="#1f2933">Enable Microsoft Entra Kerberos on the storage account and grant admin consent to the app it creates.</text>
  <text x="40" y="794" font-size="14" font-weight="600" text-anchor="start" fill="#3c8d40">2</text>
  <text x="64" y="794" font-size="14" text-anchor="start" fill="#1f2933">Assign a share-level Azure role to the synced user or group.</text>
  <text x="40" y="814" font-size="14" font-weight="600" text-anchor="start" fill="#3b6fb6">3</text>
  <text x="64" y="814" font-size="14" text-anchor="start" fill="#1f2933">Set folder and file permissions (ACLs) from a device that can reach AD DS.</text>
  <text x="40" y="834" font-size="14" font-weight="600" text-anchor="start" fill="#3b6fb6">4</text>
  <text x="64" y="834" font-size="14" text-anchor="start" fill="#1f2933">Turn on cloud Kerberos ticket retrieval on the session hosts (CloudKerberosTicketRetrievalEnabled).</text>
  <text x="40" y="854" font-size="14" font-weight="600" text-anchor="start" fill="#c2570c">A</text>
  <text x="64" y="854" font-size="14" text-anchor="start" fill="#1f2933">At sign-in, the session host retrieves a cloud Kerberos ticket from Microsoft Entra ID.</text>
  <text x="40" y="874" font-size="14" font-weight="600" text-anchor="start" fill="#c2570c">B</text>
  <text x="64" y="874" font-size="14" text-anchor="start" fill="#1f2933">The session host uses Kerberos tickets from Microsoft Entra ID to access the share over SMB.</text>
  <text x="40" y="894" font-size="14" font-weight="600" text-anchor="start" fill="#b42318">!</text>
  <text x="64" y="894" font-size="14" text-anchor="start" fill="#1f2933">Exclude the storage account&#x27;s Entra app from Conditional Access policies that require MFA for all apps.</text>
</svg>
