<text x="50" y="414" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Windows 365 Flex: licenses are pooled for the tenant</text>
<rect x="50" y="436" width="660" height="92" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="380.0" y="464" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Tenant license pool</text>
<text x="380.0" y="492" font-size="16" text-anchor="middle" fill="#1f2933">Not assigned to users</text>
<text x="380.0" y="514" font-size="16" text-anchor="middle" fill="#1f2933">Microsoft 365 admin center shows 0 users</text>
