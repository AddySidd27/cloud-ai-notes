<rect x="390" y="590" width="320" height="130" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="550.0" y="618" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Shared mode</text>
<text x="550.0" y="646" font-size="16" text-anchor="middle" fill="#1f2933">1 Cloud PC per license</text>
<text x="550.0" y="668" font-size="16" text-anchor="middle" fill="#1f2933">Shared by a group of users</text>
<text x="550.0" y="690" font-size="16" text-anchor="middle" fill="#1f2933">1 active session per license</text>
<line x1="210" y1="528" x2="210" y2="590" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="550" y1="528" x2="550" y2="590" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="162" y="743" font-size="16" text-anchor="start" fill="#5f6b7a">assigned in the</text>
<text x="162" y="763" font-size="16" text-anchor="start" fill="#5f6b7a">provisioning policy</text>
<text x="502" y="743" font-size="16" text-anchor="start" fill="#5f6b7a">assigned in the</text>
<text x="502" y="763" font-size="16" text-anchor="start" fill="#5f6b7a">provisioning policy</text>
<rect x="50" y="790" width="660" height="76" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="380.0" y="818" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Microsoft Entra security group</text>
<text x="380.0" y="846" font-size="16" text-anchor="middle" fill="#1f2933">Named in the provisioning policy. Users must be in it.</text>
