<text x="615.0" y="125" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Microsoft Entra ID P1</text>
<text x="260.0" y="116" font-size="24" font-weight="600" text-anchor="middle" fill="#1f2933">+</text>
<text x="495.0" y="116" font-size="24" font-weight="600" text-anchor="middle" fill="#1f2933">+</text>
<rect x="30" y="200" width="700" height="170" rx="8" fill="#f4f8fd" stroke="#9bbbe0" stroke-width="1.8" stroke-dasharray="8 5"/>
<text x="50" y="224" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Windows 365 Enterprise: one more license per user</text>
<rect x="50" y="250" width="300" height="100" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="200.0" y="278" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">User</text>
<text x="200.0" y="306" font-size="16" text-anchor="middle" fill="#1f2933">Has a Windows 365 license</text>
<text x="200.0" y="328" font-size="16" text-anchor="middle" fill="#1f2933">and the three licenses above</text>
<image x="62" y="258" width="30" height="30" href="data:image/svg+xml;base64,"/>
<rect x="410" y="250" width="300" height="100" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="560.0" y="278" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Cloud PC</text>
<text x="560.0" y="306" font-size="16" text-anchor="middle" fill="#1f2933">Used by the licensed user</text>
<line x1="350" y1="300" x2="410" y2="300" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="380.0" y="286" font-size="16" text-anchor="middle" fill="#5f6b7a">uses</text>
