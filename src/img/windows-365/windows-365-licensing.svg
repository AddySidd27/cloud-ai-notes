<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 910" width="760" height="910" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">Windows 365 licensing for Enterprise and Flex</title><desc id="d">Every Enterprise and Flex user needs Windows Enterprise, Microsoft Intune and Microsoft Entra ID P1 licenses. In Enterprise, the user also has a Windows 365 license and uses their Cloud PC. In Flex, licenses are pooled for the tenant and apply to Dedicated and Shared mode. Dedicated mode gives up to three Cloud PCs per license, each for one user, with one active session per license. Shared mode gives one Cloud PC per license, shared by a group, with one active session per license. Users must be in the Microsoft Entra security group named in the provisioning policy.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="6" y="6" width="748" height="898" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
<rect x="30" y="30" width="700" height="150" rx="8" fill="#f4f8fd" stroke="#9bbbe0" stroke-width="1.8" stroke-dasharray="8 5"/>
<text x="50" y="54" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Every user needs these three licenses (Enterprise and Flex)</text>
