<rect x="50" y="590" width="320" height="130" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="210.0" y="618" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Dedicated mode</text>
