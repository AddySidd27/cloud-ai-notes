<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 840 580" width="840" height="580" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">The life of a Cloud PC</title><desc id="d">A Cloud PC with the status Provisioned can follow three paths. An administrator can resize it in Intune: RAM and vCPU can go up or down, disk only up, a license of the new size is needed, and user and disk data are kept. An administrator can reprovision it when its status is Failed or Provisioned: the user is signed out, all data and apps are deleted and a new Cloud PC is built from the current policy. If the old license is removed and no new one is assigned, the Cloud PC goes into a grace period and keeps working for seven days. After seven days, or when the administrator selects Deprovision now, the operating system and data are deleted.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="6" y="6" width="828" height="568" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
<rect x="24" y="24" width="792" height="532" rx="8" fill="#ffffff" stroke="#6c7a89" stroke-width="1.8"/>
<rect x="310" y="44" width="220" height="84" rx="8" fill="#ffffff" stroke="#6c7a89" stroke-width="1.8"/>
<text x="420.0" y="74" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2933">Cloud PC</text>
<text x="420.0" y="102" font-size="15" text-anchor="middle" fill="#1f2933">Status: Provisioned</text>
<line x1="420" y1="128" x2="420" y2="222" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<polyline points="420,160 186,160 186,222" fill="none" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<polyline points="420,160 654,160 654,222" fill="none" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="194" y="184" font-size="14" text-anchor="start" fill="#5f6b7a">Admin: Resize</text>
<text x="428" y="184" font-size="14" text-anchor="start" fill="#5f6b7a">Admin: Reprovision</text>
<text x="662" y="182" font-size="14" text-anchor="start" fill="#5f6b7a">Old license removed,</text>
<text x="662" y="202" font-size="14" text-anchor="start" fill="#5f6b7a">no new one assigned</text>
<rect x="74" y="222" width="224" height="150" rx="8" fill="#ffffff" stroke="#2f7fd0" stroke-width="1.8"/>
<text x="186.0" y="252" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2933">Resize</text>
<text x="186.0" y="280" font-size="15" text-anchor="middle" fill="#1f2933">Status: Provisioned</text>
<text x="186.0" y="302" font-size="15" text-anchor="middle" fill="#1f2933">RAM, vCPU: up or down</text>
<text x="186.0" y="324" font-size="15" text-anchor="middle" fill="#1f2933">Disk: up only</text>
<text x="186.0" y="346" font-size="15" text-anchor="middle" fill="#1f2933">License of new size needed</text>
<rect x="308" y="222" width="224" height="150" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.8"/>
<text x="420.0" y="252" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2933">Reprovision</text>
<text x="420.0" y="280" font-size="15" text-anchor="middle" fill="#1f2933">Status: Failed or</text>
<text x="420.0" y="302" font-size="15" text-anchor="middle" fill="#1f2933">Provisioned</text>
<text x="420.0" y="324" font-size="15" text-anchor="middle" fill="#1f2933">User is signed out</text>
<text x="420.0" y="346" font-size="15" text-anchor="middle" fill="#1f2933">Unavailable during rebuild</text>
<rect x="542" y="222" width="224" height="150" rx="8" fill="#ffffff" stroke="#c9a227" stroke-width="1.8" stroke-dasharray="8 5"/>
<text x="654.0" y="252" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2933">In grace period</text>
<text x="654.0" y="280" font-size="15" text-anchor="middle" fill="#1f2933">User keeps using the</text>
<text x="654.0" y="302" font-size="15" text-anchor="middle" fill="#1f2933">Cloud PC for 7 days</text>
<line x1="186.0" y1="372" x2="186.0" y2="432" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="420.0" y1="372" x2="420.0" y2="432" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="654.0" y1="372" x2="654.0" y2="432" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="194.0" y="408" font-size="14" text-anchor="start" fill="#5f6b7a">Resize runs</text>
<text x="428.0" y="408" font-size="14" text-anchor="start" fill="#5f6b7a">Rebuild runs</text>
<text x="662.0" y="408" font-size="14" text-anchor="start" fill="#5f6b7a">Grace ends</text>
<rect x="74" y="432" width="224" height="100" rx="8" fill="#eef7f0" stroke="#3f9b63" stroke-width="1.8"/>
<text x="186.0" y="462" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2933">Same Cloud PC, new size</text>
<text x="186.0" y="490" font-size="15" text-anchor="middle" fill="#1f2933">User and disk data kept</text>
<rect x="308" y="432" width="224" height="100" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="1.8"/>
<text x="420.0" y="462" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2933">A new Cloud PC</text>
<text x="420.0" y="490" font-size="15" text-anchor="middle" fill="#1f2933">All data and apps deleted</text>
<text x="420.0" y="512" font-size="15" text-anchor="middle" fill="#1f2933">Built from current policy</text>
<rect x="542" y="432" width="224" height="100" rx="8" fill="#ffffff" stroke="#6c7a89" stroke-width="1.8"/>
<text x="654.0" y="462" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2933">Deprovisioned</text>
<text x="654.0" y="490" font-size="15" text-anchor="middle" fill="#1f2933">After 7 days, or Deprovision</text>
<text x="654.0" y="512" font-size="15" text-anchor="middle" fill="#1f2933">now. OS and data deleted</text>
</svg>