<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 1110" width="760" height="1110" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">Windows 365 Flex concurrency limit and concurrency buffer</title><desc id="d">The maximum concurrency limit is set by the number of Windows 365 Flex licenses purchased. In Dedicated mode the concurrency buffer lets a tenant go over it up to four times per day for up to one hour each. It does not apply to Shared mode or GPU-enabled Cloud PCs. Using the buffer for more than one hour on four or more occasions in 24 hours blocks the buffer for 48 hours, and more than two such blocks in seven days block it permanently. While blocked, Flex Cloud PCs can still be used up to the limit. The Connected Windows 365 Flex Cloud PCs report, the connection hourly report, the concurrency alert and License and utilization (preview) show usage.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="6" y="6" width="748" height="1098" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
<rect x="30" y="30" width="700" height="670" rx="8" fill="#f4f8fd" stroke="#9bbbe0" stroke-width="1.8" stroke-dasharray="8 5"/>
<text x="50" y="54" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">The limit, the concurrency buffer and the blocks</text>
<rect x="50" y="80" width="320" height="140" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="210.0" y="108" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Maximum concurrency limit</text>
<text x="210.0" y="136" font-size="16" text-anchor="middle" fill="#1f2933">Set by the Flex licenses you bought</text>
<text x="210.0" y="158" font-size="16" text-anchor="middle" fill="#1f2933">(per Cloud PC license size)</text>
<text x="210.0" y="180" font-size="16" text-anchor="middle" fill="#1f2933">At the limit, others cannot connect</text>
<rect x="390" y="80" width="320" height="140" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="550.0" y="108" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Concurrency buffer</text>
<text x="550.0" y="136" font-size="16" text-anchor="middle" fill="#1f2933">Used when over the limit</text>
<text x="550.0" y="158" font-size="16" text-anchor="middle" fill="#1f2933">Dedicated mode only</text>
<text x="550.0" y="180" font-size="16" text-anchor="middle" fill="#1f2933">Not for Shared mode</text>
<text x="550.0" y="202" font-size="16" text-anchor="middle" fill="#1f2933">Not for GPU-enabled Cloud PCs</text>
<rect x="50" y="260" width="660" height="120" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="380.0" y="288" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Buffer limits</text>
<text x="380.0" y="316" font-size="16" text-anchor="middle" fill="#1f2933">Up to four times per day</text>
<text x="380.0" y="338" font-size="16" text-anchor="middle" fill="#1f2933">Up to one hour each time</text>
<text x="380.0" y="360" font-size="16" text-anchor="middle" fill="#1f2933">The hour starts when the limit is exceeded</text>
<rect x="50" y="420" width="320" height="150" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="210.0" y="448" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Temporary block of the buffer</text>
<text x="210.0" y="476" font-size="16" text-anchor="middle" fill="#1f2933">48 hours. Caused by using the</text>
<text x="210.0" y="498" font-size="16" text-anchor="middle" fill="#1f2933">buffer for more than one hour,</text>
<text x="210.0" y="520" font-size="16" text-anchor="middle" fill="#1f2933">four or more times in 24 hours</text>
<rect x="390" y="420" width="320" height="150" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="550.0" y="448" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Permanent block of the buffer</text>
<text x="550.0" y="476" font-size="16" text-anchor="middle" fill="#1f2933">Temporarily blocked more than</text>
<text x="550.0" y="498" font-size="16" text-anchor="middle" fill="#1f2933">two times in a seven day period</text>
<text x="550.0" y="520" font-size="16" text-anchor="middle" fill="#1f2933">Unblock: open a ticket with support</text>
<rect x="50" y="600" width="660" height="76" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="380.0" y="628" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">While blocked, you can still use Flex Cloud PCs</text>
<text x="380.0" y="650" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">up to the maximum concurrency limit</text>
