<text x="50" y="754" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Where to see buffer use and license use</text>
<rect x="50" y="780" width="320" height="120" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="210.0" y="808" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Connected Windows 365 Flex</text>
<text x="210.0" y="830" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Cloud PCs report (preview)</text>
<text x="210.0" y="858" font-size="16" text-anchor="middle" fill="#1f2933">Connections now, limit, 28 days</text>
<text x="210.0" y="880" font-size="16" text-anchor="middle" fill="#1f2933">Users now using the buffer</text>
<rect x="390" y="780" width="320" height="120" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="550.0" y="808" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Windows 365 Flex</text>
<text x="550.0" y="830" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">connection hourly report</text>
<text x="550.0" y="858" font-size="16" text-anchor="middle" fill="#1f2933">Shows buffer use</text>
<rect x="50" y="920" width="320" height="140" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="210.0" y="948" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Windows 365 Flex</text>
<text x="210.0" y="970" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">concurrency alert</text>
<text x="210.0" y="998" font-size="16" text-anchor="middle" fill="#1f2933">An alert each time the buffer</text>
<text x="210.0" y="1020" font-size="16" text-anchor="middle" fill="#1f2933">is activated</text>
<rect x="390" y="920" width="320" height="140" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="550.0" y="948" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">License and utilization</text>
<text x="550.0" y="970" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">(preview)</text>
<text x="550.0" y="998" font-size="16" text-anchor="middle" fill="#1f2933">Licenses by type and SKU</text>
<text x="550.0" y="1020" font-size="16" text-anchor="middle" fill="#1f2933">Peak connections, total hours</text>
<text x="550.0" y="1042" font-size="16" text-anchor="middle" fill="#1f2933">Kept 180 days</text>
