<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 844" width="760" height="844" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">Windows 365 editions compared</title><desc id="d">Business, Enterprise, and Flex (formerly called Frontline) in Dedicated and Shared modes. Business: smaller organizations up to 300 users, a Cloud PC for each licensed user from a standard image. Enterprise: Intune provisioning policy for an Entra group, gallery or custom image. Flex Dedicated: up to 3 Cloud PCs per license, 1 active at a time, data persists. Flex Shared: 1 Cloud PC per license shared by a group, data on the Cloud PC deleted at sign-out (User Experience Sync can keep app data and Windows settings in the cloud). All connect with Windows App or the web client.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="6" y="6" width="748" height="832" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
<rect x="20" y="20" width="720" height="144" rx="8" fill="#f4f8fd" stroke="#9bbbe0" stroke-width="1.8"/>
<text x="32" y="48" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Windows 365</text>
<text x="32" y="68" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Business</text>
<text x="170" y="46" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">For</text>
<text x="270" y="46" font-size="14" text-anchor="start" fill="#1f2933">Smaller organizations, up to 300 users</text>
<text x="170" y="72" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Cloud PCs</text>
<text x="270" y="72" font-size="14" text-anchor="start" fill="#1f2933">A Cloud PC for each licensed user</text>
<text x="170" y="98" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Setup</text>
<text x="270" y="98" font-size="14" text-anchor="start" fill="#1f2933">Assign a license; the Cloud PC is built from a</text>
<text x="270" y="118" font-size="14" text-anchor="start" fill="#1f2933">standard image. Limited management.</text>
<text x="170" y="144" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Connect</text>
<text x="270" y="144" font-size="14" text-anchor="start" fill="#1f2933">Windows App or web client</text>
<rect x="20" y="174" width="720" height="164" rx="8" fill="#f4f8fd" stroke="#9bbbe0" stroke-width="1.8"/>
<text x="32" y="202" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Windows 365</text>
<text x="32" y="222" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Enterprise</text>
<text x="170" y="200" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">For</text>
<text x="270" y="200" font-size="14" text-anchor="start" fill="#1f2933">Organizations that manage Cloud PCs with Intune;</text>
<text x="270" y="220" font-size="14" text-anchor="start" fill="#1f2933">no user limit</text>
<text x="170" y="246" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Cloud PCs</text>
<text x="270" y="246" font-size="14" text-anchor="start" fill="#1f2933">A Cloud PC for each licensed user</text>
<text x="170" y="272" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Setup</text>
<text x="270" y="272" font-size="14" text-anchor="start" fill="#1f2933">Provisioning policy for an Entra group;</text>
<text x="270" y="292" font-size="14" text-anchor="start" fill="#1f2933">gallery or custom image</text>
<text x="170" y="318" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Connect</text>
<text x="270" y="318" font-size="14" text-anchor="start" fill="#1f2933">Windows App or web client</text>
<rect x="20" y="348" width="720" height="476" rx="8" fill="#ffffff" stroke="#7fbf95" stroke-width="1.8"/>
<text x="32" y="374" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Windows 365 Flex (formerly Frontline)</text>
<rect x="32" y="392" width="696" height="184" rx="8" fill="#eef7f0" stroke="#7fbf95" stroke-width="1.8"/>
<text x="44" y="420" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Dedicated</text>
<text x="44" y="440" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">mode</text>
<text x="182" y="418" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">For</text>
<text x="282" y="418" font-size="14" text-anchor="start" fill="#1f2933">Workers who need their own Cloud PC but not 24/7</text>
<text x="282" y="438" font-size="14" text-anchor="start" fill="#1f2933">(rotation, part-time)</text>
<text x="182" y="464" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Cloud PCs</text>
<text x="282" y="464" font-size="14" text-anchor="start" fill="#1f2933">Up to 3 per license, each for one user. Only 1</text>
<text x="282" y="484" font-size="14" text-anchor="start" fill="#1f2933">can be active at a time. Data persists.</text>
<text x="182" y="510" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Setup</text>
<text x="282" y="510" font-size="14" text-anchor="start" fill="#1f2933">Provisioning policy for an Entra group;</text>
<text x="282" y="530" font-size="14" text-anchor="start" fill="#1f2933">licenses are pooled for the tenant</text>
<text x="182" y="556" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Connect</text>
<text x="282" y="556" font-size="14" text-anchor="start" fill="#1f2933">Windows App or web client</text>
<rect x="32" y="586" width="696" height="224" rx="8" fill="#eef7f0" stroke="#7fbf95" stroke-width="1.8"/>
<text x="44" y="614" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Shared</text>
<text x="44" y="634" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">mode</text>
<text x="182" y="612" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">For</text>
<text x="282" y="612" font-size="14" text-anchor="start" fill="#1f2933">Short tasks that need no data to persist</text>
<text x="282" y="632" font-size="14" text-anchor="start" fill="#1f2933">(customer-facing workers, external contractors)</text>
<text x="182" y="658" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Cloud PCs</text>
<text x="282" y="658" font-size="14" text-anchor="start" fill="#1f2933">1 per license, shared by a group, one user at a</text>
<text x="282" y="678" font-size="14" text-anchor="start" fill="#1f2933">time. Data on the Cloud PC is deleted at sign-out.</text>
<text x="282" y="698" font-size="14" text-anchor="start" fill="#1f2933">User Experience Sync can keep app data and</text>
<text x="282" y="718" font-size="14" text-anchor="start" fill="#1f2933">Windows settings in the cloud.</text>
<text x="182" y="744" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Setup</text>
<text x="282" y="744" font-size="14" text-anchor="start" fill="#1f2933">Provisioning policy for an Entra group; can offer</text>
<text x="282" y="764" font-size="14" text-anchor="start" fill="#1f2933">Cloud Apps instead of the full desktop</text>
<text x="182" y="790" font-size="14" font-weight="600" text-anchor="start" fill="#1f2933">Connect</text>
<text x="282" y="790" font-size="14" text-anchor="start" fill="#1f2933">Windows App or web client</text>
</svg>