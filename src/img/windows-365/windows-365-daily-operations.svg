<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1300 660" width="1300" height="660" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">Windows 365 Enterprise remediation ladder</title><desc id="d">Intune Remediations detect and fix common support issues on Cloud PCs before users notice. When a problem is reported, five steps escalate from triage to reprovision, each more disruptive. Most remote actions support bulk, up to 5,000 Cloud PCs per operation.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="6" y="6" width="1288" height="648" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
<rect x="30" y="30" width="1240" height="140" rx="8" fill="#f4f8fd" stroke="#9bbbe0" stroke-width="1.8" stroke-dasharray="8 5"/>
<text x="50" y="54" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Before users notice a problem (Windows 365 Enterprise)</text>
<rect x="50" y="76" width="400" height="76" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="108" y="110.0" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Intune Remediations</text>
<text x="108" y="132.0" font-size="16" text-anchor="start" fill="#1f2933">Script packages</text>
<image x="64" y="99.0" width="30" height="30" href="data:image/svg+xml;base64,"/>
<rect x="800" y="76" width="320" height="76" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="858" y="110.0" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Cloud PCs</text>
<text x="858" y="132.0" font-size="16" text-anchor="start" fill="#1f2933">Windows 365 Enterprise</text>
<image x="814" y="99.0" width="30" height="30" href="data:image/svg+xml;base64,"/>
<line x1="450" y1="114" x2="800" y2="114" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="630.0" y="100" font-size="16" text-anchor="middle" fill="#5f6b7a">detect and fix common support issues</text>
<rect x="30" y="190" width="1240" height="300" rx="8" fill="#f4f8fd" stroke="#9bbbe0" stroke-width="1.8" stroke-dasharray="8 5"/>
<text x="50" y="214" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">When a problem is reported: work in order and stop when it is solved. Each step is more disruptive than the one before.</text>
<rect x="45" y="240" width="218" height="150" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="154.0" y="268" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2933">1. Triage</text>
<text x="154.0" y="296" font-size="14" text-anchor="middle" fill="#1f2933">Alert, Admin Insights item</text>
<text x="154.0" y="316" font-size="14" text-anchor="middle" fill="#1f2933">or user report: triage</text>
<text x="154.0" y="336" font-size="14" text-anchor="middle" fill="#1f2933">severity and find the</text>
<text x="154.0" y="356" font-size="14" text-anchor="middle" fill="#1f2933">affected Cloud PCs</text>
<rect x="293" y="240" width="218" height="150" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="402.0" y="268" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2933">2. Users cannot connect</text>
<text x="402.0" y="296" font-size="14" text-anchor="middle" fill="#1f2933">Describe the issue to</text>
<text x="402.0" y="316" font-size="14" text-anchor="middle" fill="#1f2933">Windows 365 admin assistant</text>
<text x="402.0" y="336" font-size="14" text-anchor="middle" fill="#1f2933">(preview). Run Troubleshoot,</text>
<text x="402.0" y="356" font-size="14" text-anchor="middle" fill="#1f2933">review the health checks</text>
<rect x="541" y="240" width="218" height="150" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="650.0" y="268" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2933">3. Cloud PCs are slow</text>
<text x="650.0" y="296" font-size="14" text-anchor="middle" fill="#1f2933">Check the Resource</text>
<text x="650.0" y="316" font-size="14" text-anchor="middle" fill="#1f2933">performance report. If</text>
<text x="650.0" y="336" font-size="14" text-anchor="middle" fill="#1f2933">constrained, use Resize</text>
<text x="650.0" y="356" font-size="14" text-anchor="middle" fill="#1f2933">(Enterprise)</text>
<rect x="789" y="240" width="218" height="150" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="898.0" y="268" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2933">4. The issue persists</text>
<text x="898.0" y="296" font-size="14" text-anchor="middle" fill="#1f2933">Create a manual restore</text>
<text x="898.0" y="316" font-size="14" text-anchor="middle" fill="#1f2933">point, then restore to a</text>
<text x="898.0" y="336" font-size="14" text-anchor="middle" fill="#1f2933">known-good restore point</text>
<rect x="1037" y="240" width="218" height="150" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="1146.0" y="268" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2933">5. Not solved by 1 to 4</text>
<text x="1146.0" y="296" font-size="14" text-anchor="middle" fill="#1f2933">Reprovision the Cloud PC.</text>
<text x="1146.0" y="316" font-size="14" text-anchor="middle" fill="#1f2933">Last resort.</text>
<rect x="45" y="410" width="218" height="60" rx="8" fill="#f3faf3" stroke="#8cc08c" stroke-width="1.5"/>
<text x="154.0" y="445.0" font-size="14" text-anchor="middle" fill="#1f2933">Data impact: None</text>
<rect x="293" y="410" width="218" height="60" rx="8" fill="#f3faf3" stroke="#8cc08c" stroke-width="1.5"/>
<text x="402.0" y="445.0" font-size="14" text-anchor="middle" fill="#1f2933">Data impact: None</text>
<rect x="541" y="410" width="218" height="60" rx="8" fill="#f3faf3" stroke="#8cc08c" stroke-width="1.5"/>
<text x="650.0" y="445.0" font-size="14" text-anchor="middle" fill="#1f2933">Data impact: None</text>
<rect x="789" y="410" width="218" height="60" rx="8" fill="#fdf3f2" stroke="#d9a09a" stroke-width="1.5"/>
<text x="898.0" y="435.0" font-size="14" text-anchor="middle" fill="#1f2933">Changes after the selected</text>
<text x="898.0" y="455.0" font-size="14" text-anchor="middle" fill="#1f2933">restore point are lost</text>
<rect x="1037" y="410" width="218" height="60" rx="8" fill="#fdf3f2" stroke="#d9a09a" stroke-width="1.5"/>
<text x="1146.0" y="435.0" font-size="14" text-anchor="middle" fill="#1f2933">Enterprise: all user data,</text>
<text x="1146.0" y="455.0" font-size="14" text-anchor="middle" fill="#1f2933">apps and settings deleted</text>
<line x1="263" y1="315" x2="293" y2="315" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="511" y1="315" x2="541" y2="315" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="759" y1="315" x2="789" y2="315" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1007" y1="315" x2="1037" y2="315" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="30" y="510" width="1240" height="120" rx="8" fill="#f4f8fd" stroke="#9bbbe0" stroke-width="1.8" stroke-dasharray="8 5"/>
<text x="50" y="534" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Bulk remote actions</text>
<text x="50" y="568" font-size="16" text-anchor="start" fill="#1f2933">Most remote actions support bulk, including Restart, Restore, Resize, Reprovision and Troubleshoot.</text>
<text x="50" y="596" font-size="16" text-anchor="start" fill="#1f2933">Bulk actions support up to 5,000 Cloud PCs per operation, except where noted. Rename and Update Windows Defender do not support bulk.</text>
</svg>