<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 780" width="1000" height="780" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">What protects a Windows 365 Enterprise Cloud PC and what an admin does in a regional outage</title><desc id="d">Left: four protections for a Windows 365 Enterprise Cloud PC. Automated in-zone recovery needs no admin action and has an RPO of about 0. Point-in-time restore returns a Cloud PC to an earlier point. Cross region disaster recovery has an RPO under 4 hours and an RTO under 4 hours when fewer than 50,000 Cloud PCs are DR-licensed, and an admin activates it manually. Disaster Recovery Plus reserves capacity in the alternate region with an RTO under 31 minutes. Right: a short version of what an admin does in a regional outage, in five steps. 1 Check Service health. 2 If the admin center is not reachable, use the backup status pages. 3 In the Intune admin center, check the status report. 4 Activate cross region disaster recovery. 5 After Microsoft declares the outage over, deactivate it or wait for automatic failback within 7 days.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs>
<rect x="6" y="6" width="988" height="768" rx="8" fill="#ffffff" stroke="#5f6b7a" stroke-width="2"/>
<rect x="24" y="24" width="470" height="730" rx="8" fill="#f4f8fd" stroke="#9bbbe0" stroke-width="1.8"/>
<text x="44" y="50" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">What protects a Cloud PC (Windows 365 Enterprise)</text>
<rect x="44" y="70" width="430" height="64" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="102" y="98.0" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Cloud PC</text>
<text x="102" y="120.0" font-size="14" text-anchor="start" fill="#1f2933">Windows 365 Enterprise</text>
<image x="58" y="87.0" width="30" height="30" href="data:image/svg+xml;base64,"/>
<rect x="44" y="150" width="430" height="118" rx="8" fill="#ffffff" stroke="#7fbf8e" stroke-width="1.5"/>
<text x="259.0" y="178" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Automated in-zone recovery</text>
<text x="259.0" y="204" font-size="14" text-anchor="middle" fill="#1f2933">Host, power or networking failure in a zone</text>
<text x="259.0" y="226" font-size="14" text-anchor="middle" fill="#1f2933">Moves to healthy compute in the same zone</text>
<text x="259.0" y="248" font-size="14" text-anchor="middle" fill="#1f2933">RPO ~0. No admin action. User reconnects</text>
<rect x="44" y="298" width="430" height="118" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="259.0" y="326" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Point-in-time restore</text>
<text x="259.0" y="352" font-size="14" text-anchor="middle" fill="#1f2933">Restores a Cloud PC to an earlier point</text>
<text x="259.0" y="374" font-size="14" text-anchor="middle" fill="#1f2933">Changes made after that point are lost</text>
<text x="259.0" y="396" font-size="14" text-anchor="middle" fill="#1f2933">An admin starts it. Users can too, if allowed</text>
<rect x="44" y="446" width="430" height="118" rx="8" fill="#ffffff" stroke="#e0a96b" stroke-width="1.5"/>
<text x="259.0" y="474" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Cross region disaster recovery</text>
<text x="259.0" y="500" font-size="14" text-anchor="middle" fill="#1f2933">For a regional outage. RPO &lt; 4 hours</text>
<text x="259.0" y="522" font-size="14" text-anchor="middle" fill="#1f2933">RTO &lt; 4 hours (fewer than 50,000 DR-licensed Cloud PCs)</text>
<text x="259.0" y="544" font-size="14" text-anchor="middle" fill="#1f2933">An admin activates it manually</text>
<rect x="44" y="594" width="430" height="118" rx="8" fill="#ffffff" stroke="#e0a96b" stroke-width="1.5"/>
<text x="259.0" y="622" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">Disaster Recovery Plus</text>
<text x="259.0" y="648" font-size="14" text-anchor="middle" fill="#1f2933">Capacity is reserved in the alternate region</text>
<text x="259.0" y="670" font-size="14" text-anchor="middle" fill="#1f2933">RTO is less than 31 minutes</text>
<text x="259.0" y="692" font-size="14" text-anchor="middle" fill="#1f2933">Users can self-activate if the setting is on</text>
<rect x="514" y="24" width="462" height="730" rx="8" fill="#f4f8fd" stroke="#9bbbe0" stroke-width="1.8"/>
<text x="534" y="50" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">What you do in a regional outage</text>
<rect x="534" y="70" width="422" height="90" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="745.0" y="98" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">1. Check Service health</text>
<text x="745.0" y="124" font-size="14" text-anchor="middle" fill="#1f2933">Microsoft 365 admin center &gt; Health &gt; Service health</text>
<text x="745.0" y="146" font-size="14" text-anchor="middle" fill="#1f2933">Look for incidents on Windows 365 or Azure</text>
<rect x="534" y="185" width="422" height="90" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="745.0" y="213" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">2. If the admin center is not reachable</text>
<text x="745.0" y="239" font-size="14" text-anchor="middle" fill="#1f2933">status.cloud.microsoft, azure.status.microsoft</text>
<text x="745.0" y="261" font-size="14" text-anchor="middle" fill="#1f2933">@MSFT365Status</text>
<rect x="534" y="300" width="422" height="302" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.8" stroke-dasharray="8 5"/>
<image x="548" y="306" width="30" height="30" href="data:image/svg+xml;base64,"/>
<text x="594" y="324" font-size="16" font-weight="600" text-anchor="start" fill="#1f2933">Microsoft Intune admin center</text>
<rect x="550" y="355" width="390" height="85" rx="8" fill="#ffffff" stroke="#9bbbe0" stroke-width="1.5"/>
<text x="745.0" y="383" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">3. Check the status report</text>
<text x="745.0" y="409" font-size="14" text-anchor="middle" fill="#1f2933">Cloud PC optional business continuity and</text>
<text x="745.0" y="431" font-size="14" text-anchor="middle" fill="#1f2933">disaster recovery status report</text>
<rect x="550" y="468" width="390" height="120" rx="8" fill="#ffffff" stroke="#e0a96b" stroke-width="1.5"/>
<text x="745.0" y="496" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">4. Activate cross region DR</text>
<text x="745.0" y="522" font-size="14" text-anchor="middle" fill="#1f2933">Devices &gt; All devices &gt; Bulk device actions</text>
<text x="745.0" y="544" font-size="14" text-anchor="middle" fill="#1f2933">Device action: Optional disaster recovery</text>
<text x="745.0" y="566" font-size="14" text-anchor="middle" fill="#1f2933">Action type: Activate cross region disaster recovery</text>
<rect x="534" y="630" width="422" height="108" rx="8" fill="#ffffff" stroke="#e0a96b" stroke-width="1.5"/>
<text x="745.0" y="658" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2933">5. After Microsoft declares it over</text>
<text x="745.0" y="684" font-size="14" text-anchor="middle" fill="#1f2933">Deactivate in Intune, or wait for automatic</text>
<text x="745.0" y="706" font-size="14" text-anchor="middle" fill="#1f2933">failback (up to 7 days). Deactivating deletes</text>
<text x="745.0" y="728" font-size="14" text-anchor="middle" fill="#1f2933">the temporary Cloud PC</text>
<line x1="745" y1="275" x2="745" y2="300" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="745" y1="440" x2="745" y2="468" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="745" y1="602" x2="745" y2="630" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#a)"/>
</svg>